        '<div class="contractor-selector">' +
        '<div class="select-all-row">' +
        '<input type="checkbox" id="select-all-contractors" ' + (isAllSelected ? 'checked' : '') + ' />' +

        '</div>' +
        '</div>';

        '<div class="field"><label>Выбор подрядчиков</label>' +
        '<div class="banner warning" style="margin: 0;">' + icon("info") + '<div>Справочник подрядчиков пуст. Добавьте подрядчиков в разделе «Справочник подрядчиков».</div></div>' +
        '</div>';
    }

    const pendingContractorCount = contractorDirectoryRows().filter(function (row) { return row.detected && !row.entry; }).length;
    const directoryAlert = kfo.status === "active" && pendingContractorCount
      ? '<div class="banner warning">' + icon("info") + '<div><strong>' + formatNumber(pendingContractorCount, 0) + ' подрядчиков отсутствуют в справочнике.</strong> Объёмы не потеряны и временно показаны под исходными наименованиями. Выполните акцепт перед выпуском отчёта.</div>' + button("Открыть справочник", "users", "banner-action", 'id="open-contractor-directory"') + '</div>'
      : "";

    const kfoActions = state.editMode && state.aggregation.parserConfig
      ? button("Скачать JSON коэффициентов", "download", state.aggregation.parserDirty ? "btn-primary" : "", 'id="download-parser-config"')
      : "";

    const kpi = state.kpi;
    const kpiContractors = new Set((kpi.groups || []).map(function(group) { return normalizeParserLabel(group.contractor); })).size;
    const kpiTypes = new Set((kpi.groups || []).map(function(group) { return normalizeParserLabel(group.kqCode); })).size;
    const kpiBlock = '<section class="card"><div class="card-header"><div class="card-title-row"><div><h3 class="card-title">Ключевые показатели проекта</h3><p class="card-desc">Независимая аналитика только уровня KQ-1. Проверка источника не запускает чтение данных.</p></div>' + button(kpi.status === "loading" ? "Загрузка…" : "Загрузить KPI KQ-1", "upload", "btn-primary", 'id="load-project-kpi" ' + (kpi.status === "loading" ? "disabled" : "")) + '</div></div><div class="card-body"><div class="metric-strip"><div class="stat"><div class="stat-label">Подрядчиков</div><div class="stat-value">' + (kpi.status === "active" ? formatNumber(kpiContractors, 0) : "—") + '</div></div><div class="stat highlight"><div class="stat-label">Строк для анализа</div><div class="stat-value">' + (kpi.status === "active" ? formatNumber(kpi.totalRows, 0) : "—") + '</div><div class="stat-note">' + escapeHtml(kpi.message) + '</div></div><div class="stat"><div class="stat-label">Групп KQ-1</div><div class="stat-value">' + (kpi.status === "active" ? formatNumber(kpiTypes, 0) : "—") + '</div></div></div></div></section>';

    return pageHead(item, kfoActions) +
      '<div class="stack">' +
        directoryAlert +
        '<section class="card editable-card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Источники БД КФО</h3><span class="badge">Источников: ' + formatNumber(sources.length, 0) + '</span></div><p class="card-desc">Ссылка открывает файл-источник. Состояние подключения и происхождение дат показаны отдельно.</p></div><div class="card-body"><div class="source-grid">' + sourceCards + '</div></div><div class="card-footer edit-only block">' + button("Добавить источник", "plus", "", 'id="add-kfo-source"') + '</div></section>' +
        '<section class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Срез и способ расчёта</h3><span class="badge">На ' + formatDateShort(state.asOfDate) + '</span></div><p class="card-desc">Дата ограничивает строки по дате записи; факт СМР с более поздней датой последнего факта исключается. Для СК и ИД отдельных дат в книге нет, поэтому точный исторический откат этих этапов требует отдельного файла-среза. Регламентные коэффициенты не изменяют значения этапов и учитываются только в итоговой колонке оценки.</p></div><div class="card-body">' +
          '<div class="filter-section">' +
            '<div class="field"><label for="as-of-date">Дата сведений</label><input class="input" id="as-of-date" type="date" value="' + escapeHtml(state.asOfDate) + '" /></div>' +
            '<div class="field"><label for="kq-level">Уровень расчёта</label><select class="input" id="kq-level"><option value="kq1"' + (state.kqLevel === "kq1" ? " selected" : "") + '>KQ-1</option><option value="kq2"' + (state.kqLevel === "kq2" ? " selected" : "") + '>KQ-2</option></select></div>' +
            '<button class="btn btn-primary" id="refresh-kfo-data">' + icon("refresh") + 'Собрать сведения</button>' +
          '</div>' +
          '<div style="margin-top: 16px;">' + contractorSelectorHTML + '</div>' +
          '</div></section>' +
        kpiBlock +
        (function() {
          const groups = visibleGroups;
          if (kfo.status === "loading") return emptyState("Читаем БД КФО", "Большой файл .xlsb обрабатывается в браузере. Не закрывайте страницу.", "database");
          if (!groups.length) return emptyState("Нет ненулевых физических объёмов", kfo.message || "Проверьте источники, дату среза и параметры расчёта.", "database");

          const byContractor = new Map();
          groups.forEach(function (entry) {
            const key = normalizeParserLabel(entry.contractor);
            if (!byContractor.has(key)) byContractor.set(key, []);
            byContractor.get(key).push(entry);
          });

          const contractorCards = visibleContractors.map(function (contractor) {
            const workRows = (byContractor.get(normalizeParserLabel(contractor.name)) || []).map(function (entry) {
              return '<tr><td class="work-code"><strong>' + escapeHtml(entry.kqCode) + '</strong></td><td class="work-name">' + escapeHtml(entry.kqName || entry.erName || "Наименование не найдено") + '</td><td>' + escapeHtml(entry.unit) + '</td><td class="num">' + formatNumber(entry.actualSmr, 0) + '</td><td class="num">' + formatNumber(entry.acceptedSk, 0) + '</td><td class="num">' + formatNumber(entry.acceptedId, 0) + '</td><td class="num">' + (entry.evaluatedVolume == null ? "—" : formatNumber(entry.evaluatedVolume, 0)) + '</td></tr>';
            }).join("");
            const coverage = contractor.regulationCoverage == null ? "Регламент не применяется" : "Покрытие ДК " + formatNumber(contractor.regulationCoverage, 0) + "%";
            return '<details class="contractor-item"><summary><span class="contractor-name">' + escapeHtml(contractor.name) + '</span><span class="contractor-metrics"><span class="metric-inline"><strong>' + formatNumber(contractor.workTypes, 0) + '</strong> видов работ</span><span class="metric-inline"><strong>' + formatNumber(contractor.rows, 0) + '</strong> строк с объёмами</span><span class="metric-inline">' + coverage + '</span></span></summary><div class="contractor-body"><div class="table-wrap"><table><thead><tr><th>Шифр KQ</th><th>Наименование работ</th><th>Ед.</th><th class="num">Факт СМР</th><th class="num">Принято СК</th><th class="num">Принято ИД</th><th class="num">Оценка по регламенту</th></tr></thead><tbody>' + workRows + '</tbody></table></div></div></details>';
          }).join("");

          return '<section class="card"><div class="card-header"><h3 class="card-title">Физические объёмы по подрядчикам</h3><p class="card-desc">Выберите подрядчика, чтобы увидеть его виды работ. Нулевые строки скрыты; отображаемые объёмы округлены до целых, расчётная точность сохранена.</p></div><div class="card-body"><div class="contractor-list">' + contractorCards + '</div><p class="result-note">Факт СМР, Принято СК и Принято ИД рассчитываются без регламентов: исходный объём умножается только на коэффициент выбранного уровня KQ. Оценка по регламенту формируется отдельно по данным раздела «Регламенты»; без подключённого источника её значение равно 0.</p></div></section>';
        })() +
      '</div>';
  }

  // =====================================================================
  // 14. РЕНДЕР СТРАНИЦЫ "СПРАВОЧНИК ПОДРЯДЧИКОВ"
  // =====================================================================
  function renderContractorDirectory(item) {
    const rows = contractorDirectoryRows();
    const pending = rows.filter(function (row) { return row.detected && !row.entry; });
    const canonicalNames = canonicalContractorNames();
    const canonicalCount = canonicalContractorNames().length;
    const detectedCount = (state.kfo.rawContractors || []).length;
    const options = canonicalNames.map(function (name) { return '<option value="' + escapeHtml(name) + '"></option>'; }).join("");

    let tableRows = rows.map(function (row) {
      const entry = row.entry;
      const status = !entry ? "pending" : entry.status;
      const statusLabel = status === "pending" ? "Требует акцепта" : (status === "canonical" ? "Канонический" : "Объединён");
      const statusClass = status === "pending" ? "warning" : "green";
      const suggestion = !entry ? suggestCanonicalContractor(row.sourceName) : "";
      const canonicalValue = entry ? entry.canonicalName : suggestion;
      const kfoStatus = row.detected
        ? '<span class="badge green">Подтверждено</span>'
        : '<span class="badge">Нет в текущем срезе</span>';
      const canonicalCell = state.editMode
        ? '<div class="directory-editor"><input class="input" list="contractor-canonical-options" value="' + escapeHtml(canonicalValue) + '" aria-label="Каноническое наименование для ' + escapeHtml(row.sourceName) + '" data-contractor-input="' + escapeHtml(row.sourceName) + '" /><div class="directory-actions">' + button("Сохранить", "check", status === "pending" ? "btn-primary" : "", 'data-save-contractor="' + escapeHtml(row.sourceName) + '"') + button("Канонический", "", "", 'data-canonical-contractor="' + escapeHtml(row.sourceName) + '"') + (entry ? button("Удалить", "", "btn-ghost", 'data-remove-contractor="' + escapeHtml(row.sourceName) + '"') : "") + '</div></div>' + (suggestion ? '<span class="directory-suggestion">Предложено по совпадению основы: ' + escapeHtml(suggestion) + '</span>' : "")
        : (entry ? '<strong>' + escapeHtml(entry.canonicalName) + '</strong>' : '<span class="muted">Не определено</span>');
      return '<tr data-directory-status="' + status + '" data-directory-search="' + escapeHtml(normalizeParserLabel(row.sourceName + " " + (entry ? entry.canonicalName : ""))) + '"><td class="directory-source">' + escapeHtml(row.sourceName) + '</td><td class="directory-status">' + kfoStatus + '</td><td class="num">' + (row.detected ? formatNumber(row.rows, 0) : "—") + '</td><td class="directory-status"><span class="badge ' + statusClass + '">' + statusLabel + '</span></td><td class="directory-canonical">' + canonicalCell + '</td></tr>';
    }).join("");

    const locked = state.editMode ? "" : '<div class="banner warning">' + icon("lock") + '<div>Для акцепта включите <strong>режим редактирования</strong>. Изменения сохраняются в общем config.json и не зависят от браузера конкретного пользователя.</div></div>';
    const warning = pending.length
      ? '<div class="banner warning">' + icon("info") + '<div><strong>Новых подрядчиков: ' + formatNumber(pending.length, 0) + '.</strong> Для каждого выберите существующее каноническое наименование либо отметьте исходное наименование как каноническое.</div></div>'
      : '<div class="banner">' + icon("check") + '<div>Все подрядчики текущей БД КФО акцептованы. Расчёт выполняется по исходным строкам, а объединение применяется после расчёта.</div></div>';

    const body = rows.length
      ? '<div class="directory-toolbar"><div class="field"><label for="directory-search">Поиск подрядчика</label><input class="input" id="directory-search" type="search" placeholder="Исходное или каноническое наименование" value="' + escapeHtml(state.directorySearch) + '" /></div><div class="field"><label for="directory-filter">Статус</label><select class="input" id="directory-filter"><option value="all"' + (state.directoryFilter === "all" ? " selected" : "") + '>Все</option><option value="pending"' + (state.directoryFilter === "pending" ? " selected" : "") + '>Требуют акцепта</option><option value="canonical"' + (state.directoryFilter === "canonical" ? " selected" : "") + '>Канонические</option><option value="alias"' + (state.directoryFilter === "alias" ? " selected" : "") + '>Объединённые</option></select></div></div><datalist id="contractor-canonical-options">' + options + '</datalist><div class="table-wrap"><table><thead><tr><th>Наименование в БД КФО</th><th>Статус БД КФО</th><th class="num">Строк</th><th>Статус</th><th>Канонический подрядчик</th></tr></thead><tbody id="contractor-directory-body">' + tableRows + '</tbody></table></div><p class="result-note">После акцепта скачайте обновлённый config.json и разместите его в общем источнике. Тогда соответствия будут одинаковыми для всех пользователей.</p>'
      : emptyState("Подрядчики ещё не обнаружены", "Нажмите «Сверить с БД КФО», чтобы прочитать актуальный файл и сформировать список для акцепта.", "users");

    return pageHead(item, button("Сверить с БД КФО", "refresh", "", 'id="sync-contractors"') + button("Скачать config.json", "download", "btn-primary edit-only", 'id="directory-download"')) +
      '<div class="stack">' + locked + warning + '<div class="metric-strip"><div class="stat"><div class="stat-label">Наименований в БД КФО</div><div class="stat-value">' + (state.kfo.status === "active" ? formatNumber(detectedCount, 0) : "—") + '</div><div class="stat-note">уникальные исходные значения</div></div><div class="stat"><div class="stat-label">Канонических подрядчиков</div><div class="stat-value">' + formatNumber(canonicalCount, 0) + '</div><div class="stat-note">единые группы для отчёта</div></div><div class="stat ' + (pending.length ? "" : "highlight") + '"><div class="stat-label">Требуют акцепта</div><div class="stat-value">' + (state.kfo.status === "active" ? formatNumber(pending.length, 0) : "—") + '</div><div class="stat-note">обнаружены в текущей базе</div></div></div>' +
      '<section class="card editable-card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Общий справочник подрядчиков</h3><span class="badge green">config.json</span></div><p class="card-desc">Исходные наименования сохраняются для аудита. Каноническое наименование используется только при последующей группировке рассчитанных объёмов.</p></div><div class="card-body">' + body + '</div></section></div>';
  }

  // =====================================================================
  // 15. РЕНДЕР СТРАНИЦЫ "РЕГЛАМЕНТЫ"
  // =====================================================================
  function renderCoefficients(item) {
    const source = getRegulationsSource();
    const regulations = state.regulations;
    const entries = (regulations.entries || []).map(function (entry) {
      if (!entry.contractor) return entry;
      return Object.assign({}, entry, {
        sourceContractor: entry.sourceContractor || entry.contractor,
        contractor: canonicalContractorName(entry.sourceContractor || entry.contractor)
      });
    });
    const common = entries.filter(function (entry) { return !entry.contractor; });
    const contractorNames = Array.from(new Set(entries.map(function (entry) { return entry.contractor; }).filter(Boolean))).sort(function (a, b) { return a.localeCompare(b, "ru"); });
    const coverageValues = (state.kfo.sourceSummaries || []).map(function (summary) { return summary.regulationCoverage; }).filter(function (value) { return value != null; });
    const coverage = coverageValues.length ? coverageValues.reduce(function (sum, value) { return sum + value; }, 0) / coverageValues.length : null;
    const statusClass = regulations.status === "active" ? "green" : regulations.status === "error" ? "warning" : "";
    const statusLabel = regulations.status === "active" ? "Подключено" : regulations.status === "loading" ? "Загрузка…" : regulations.status === "error" ? "Ошибка" : "Нет источника";
    const sourceLink = source.url ? '<a href="' + escapeHtml(source.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(source.name || "Регламенты КФО") + ' ↗</a>' : "Ссылка не указана";

    const editor = '<section class="card editable-card edit-only block"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Источник регламентов</h3><span class="badge green">config.json</span></div><p class="card-desc">Источник задаётся отдельно от БД КФО и читается по правилам parsers.dk JSON-конфигуратора.</p></div><div class="card-body"><div class="field-grid"><div class="field"><label for="regulations-source-name">Наименование</label><input class="input" id="regulations-source-name" value="' + escapeHtml(source.name) + '" /></div><div class="field field-wide"><label for="regulations-source-url">Ссылка на документ с вкладкой ДК</label><input class="input" id="regulations-source-url" type="url" value="' + escapeHtml(source.url) + '" /></div><div class="field"><label for="regulations-source-sheet">Вкладка</label><input class="input" id="regulations-source-sheet" value="' + escapeHtml(source.sheetName) + '" /></div><div class="field"><label for="regulations-default-smr">Без вида работ: Факт СМР</label><input class="input" id="regulations-default-smr" type="number" min="0" max="1" step="0.01" value="' + escapeHtml(source.defaultDistribution.actualSmr) + '" /></div><div class="field"><label for="regulations-default-sk">Без вида работ: Принято СК</label><input class="input" id="regulations-default-sk" type="number" min="0" max="1" step="0.01" value="' + escapeHtml(source.defaultDistribution.acceptedSk) + '" /></div><div class="field"><label for="regulations-default-id">Без вида работ: Принято ИД</label><input class="input" id="regulations-default-id" type="number" min="0" max="1" step="0.01" value="' + escapeHtml(source.defaultDistribution.acceptedId) + '" /></div></div></div><div class="card-footer">' + button("Применить источник", "check", "btn-primary", 'id="apply-regulations-source"') + '</div></section>';

    let matrix = "";
    if (regulations.status === "loading") {
      matrix = emptyState("Читаем регламенты", "Большой файл .xlsb обрабатывается в браузере.", "sliders");
    } else if (!entries.length) {
      matrix = emptyState("Источник регламентов не подключён", regulations.message || "До подключения источника колонка «Оценка по регламенту» равна 0.", "sliders");
    } else {
      const groups = [{ name: "Общие регламенты КФО", entries: common, common: true }].concat(contractorNames.map(function (contractor) { return { name: contractor, entries: entries.filter(function (entry) { return entry.contractor === contractor; }), common: false }; }));
      matrix = '<div class="contractor-list">' + groups.map(function (group) {
        const rows = group.entries.map(function (entry) {
          return '<tr><td><strong>' + escapeHtml(entry.markCode) + '</strong></td><td>' + escapeHtml(entry.contractNumber || "—") + '</td><td class="num">' + formatNumber(entry.actualSmr * 100, 0) + '%</td><td class="num">' + formatNumber(entry.acceptedSk * 100, 0) + '%</td><td class="num">' + formatNumber(entry.acceptedId * 100, 0) + '%</td><td><a href="' + escapeHtml(source.url) + '" target="_blank" rel="noopener noreferrer">Открыть регламент ↗</a></td></tr>';
        }).join("");
        return '<details class="contractor-item"' + (group.common ? " open" : "") + '><summary><span class="contractor-name">' + escapeHtml(group.name) + '</span><span class="contractor-metrics"><span class="metric-inline"><strong>' + formatNumber(group.entries.length, 0) + '</strong> правил</span><span class="badge ' + (group.common ? "" : "green") + '">' + (group.common ? "Для остальных подрядчиков" : "Особые коэффициенты") + '</span></span></summary><div class="contractor-body"><div class="table-wrap"><table><thead><tr><th>Вид работ</th><th>Договор</th><th class="num">Факт СМР</th><th class="num">Принято СК</th><th class="num">Принято ИД</th><th>Документ</th></tr></thead><tbody>' + rows + '</tbody></table></div></div></details>';
      }).join("") + '</div>';
    }

    return pageHead(item, button("Обновить регламенты", "refresh", "", 'id="load-regulations"')) +
      '<div class="stack"><div class="grid-3"><div class="stat"><div class="stat-label">Регламентов</div><div class="stat-value">' + (regulations.status === "active" ? formatNumber(entries.length, 0) : "—") + '</div><div class="stat-note">' + formatNumber(common.length, 0) + ' общих</div></div><div class="stat"><div class="stat-label">Подрядчиков</div><div class="stat-value">' + (regulations.status === "active" ? formatNumber(contractorNames.length, 0) : "—") + '</div><div class="stat-note">с особыми коэффициентами</div></div><div class="stat highlight"><div class="stat-label">Покрытие расчёта</div><div class="stat-value">' + (coverage == null ? "—" : formatNumber(coverage, 0) + "%") + '</div><div class="stat-note">после обновления БД КФО</div></div></div>' + editor +
      '<section class="card editable-card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Матрица регламентов</h3><span class="badge ' + statusClass + '">' + statusLabel + '</span></div><p class="card-desc">Источник: ' + sourceLink + '. Общие правила применяются к подрядчикам без персональной записи; персональные правила имеют приоритет.</p></div><div class="card-body">' + matrix + '</div></section></div>';
  }

  // =====================================================================
  // 16. РЕНДЕР СТРАНИЦЫ "СПРАВОЧНИК BOQ"
  // =====================================================================
  function renderAggregation(item) {
    const entries = state.aggregation.entries || [];
    const runtimeConfig = state.aggregation.parserConfig;
    const aggregationQuery = normalizeParserLabel(state.aggregationSearch);
    const filteredEntries = aggregationQuery ? entries.filter(function (entry) {
      const searchableKq1 = runtimeConfig ? getEffectiveAggregationGroup("kq1", entry.kq1Code, entry.kq1Name, runtimeConfig).code : entry.kq1Code;
      const searchableKq2 = runtimeConfig ? getEffectiveAggregationGroup("kq2", entry.kq2Code, entry.kq2Name, runtimeConfig).code : entry.kq2Code;
      return normalizeParserLabel(searchableKq1).indexOf(aggregationQuery) >= 0 ||
        normalizeParserLabel(searchableKq2).indexOf(aggregationQuery) >= 0 ||
        normalizeParserLabel(entry.erCode).indexOf(aggregationQuery) >= 0;
    }) : entries;

    const source = state.config.aggregationSource || DEFAULT_CONFIG.aggregationSource;
    const activeLevel = runtimeConfig && runtimeConfig.aggregationLogic ? runtimeConfig.aggregationLogic.activeLevel : "kq2";
    const priorityText = runtimeConfig && Array.isArray(runtimeConfig.sourcePriority) ? runtimeConfig.sourcePriority.slice().sort(function (a, b) { return b.priority - a.priority; }).map(function (entry) { return entry.source; }).join(" → ") : "kfo → contractPrice → aggregation";

    const hierarchy = new Map();
    filteredEntries.forEach(function (entry) {
      const effectiveKq1 = runtimeConfig ? getEffectiveAggregationGroup("kq1", entry.kq1Code, entry.kq1Name, runtimeConfig) : { code: entry.kq1Code, name: entry.kq1Name, corrected: false };
      const effectiveKq2 = runtimeConfig ? getEffectiveAggregationGroup("kq2", entry.kq2Code, entry.kq2Name, runtimeConfig) : { code: entry.kq2Code, name: entry.kq2Name, corrected: false };
      const kq1Key = effectiveKq1.code || "Без KQ-1";
      if (!hierarchy.has(kq1Key)) hierarchy.set(kq1Key, { code: kq1Key, name: effectiveKq1.name || "Без наименования", corrected: effectiveKq1.corrected, groups: new Map(), count: 0 });
      const kq1 = hierarchy.get(kq1Key);
      const kq2Key = effectiveKq2.code || "Без KQ-2";
      if (!kq1.groups.has(kq2Key)) kq1.groups.set(kq2Key, { code: kq2Key, name: effectiveKq2.name || "Без наименования", corrected: effectiveKq2.corrected, entries: [] });
      kq1.groups.get(kq2Key).entries.push(entry);
      kq1.count += 1;
    });

    const coefficientOverview = (function () {
      const levels = [
        { key: "kq1", label: "KQ-1" },
        { key: "kq2", label: "KQ-2" }
      ];
      const stats = levels.map(function (level) {
        const values = filteredEntries.map(function (entry) {
          const value = runtimeConfig ? getEffectiveLevelCoefficient(level.key, entry, runtimeConfig) : Number(entry[level.key + "Coefficient"]);
          return Number.isFinite(Number(value)) ? Number(value) : null;
        }).filter(function (value) { return value !== null; });
        if (!values.length) return { label: level.label, count: 0, average: 0, min: 0, max: 0 };
        const total = values.reduce(function (sum, value) { return sum + value; }, 0);
        return {
          label: level.label,
          count: values.length,
          average: total / values.length,
          min: Math.min.apply(Math, values),
          max: Math.max.apply(Math, values)
        };
      });
      const maxAverage = Math.max.apply(Math, stats.map(function (stat) { return stat.average; }).concat([1]));
      const bars = stats.map(function (stat) {
        const width = stat.count ? Math.max(2, Math.min(100, stat.average / maxAverage * 100)) : 0;
        const valueText = stat.count
          ? formatNumber(stat.average, 3) + " (" + formatNumber(stat.min, 3) + "–" + formatNumber(stat.max, 3) + ")"
          : "нет данных";
        return '<div class="coefficient-bar-row" role="img" aria-label="' + escapeHtml(stat.label + ": среднее " + valueText) + '"><span class="coefficient-bar-label">' + stat.label + '</span><span class="coefficient-bar-track" aria-hidden="true"><span class="coefficient-bar-fill" style="width:' + width.toFixed(1) + '%"></span></span><span class="coefficient-bar-value">' + escapeHtml(valueText) + '</span></div>';
      }).join("");
      return '<div class="coefficient-overview"><div><div class="coefficient-overview-title">Распределение коэффициентов по уровням</div><div class="coefficient-overview-note">Среднее значение; в скобках — диапазон по найденным строкам (' + formatNumber(filteredEntries.length, 0) + ' ЕР).</div></div><div class="coefficient-bars">' + bars + '</div></div>';
    }());

    function coefficientCell(levelName, entry) {
      const effective = runtimeConfig ? getEffectiveLevelCoefficient(levelName, entry, runtimeConfig) : Number(entry[levelName + "Coefficient"]);
      const sourceValue = Number(entry[levelName + "Coefficient"]);
      const corrected = Number.isFinite(sourceValue) && Number(effective) !== sourceValue;
      if (!state.editMode) return '<strong>' + escapeHtml(effective) + '</strong>' + (corrected ? '<br><span class="badge warning">JSON</span>' : '');
      return '<button type="button" class="btn aggregation-coefficient-edit" data-coefficient-level="' + escapeHtml(levelName) + '" data-er-code="' + escapeHtml(entry.erCode) + '" data-current-value="' + escapeHtml(effective) + '" aria-label="Изменить коэффициент ' + escapeHtml(levelName.toUpperCase()) + ' для ' + escapeHtml(entry.erCode) + '"><strong>' + escapeHtml(effective) + '</strong>' + (corrected ? ' <span class="badge warning">JSON</span>' : '') + '</button>';
    }

    function groupCoefficientControl(levelName, code, groupEntries) {
      const values = Array.from(new Set(groupEntries.map(function (entry) { return runtimeConfig ? getEffectiveLevelCoefficient(levelName, entry, runtimeConfig) : Number(entry[levelName + "Coefficient"]); })));
      const summary = values.length === 1 ? String(values[0]) : "разные: " + Math.min.apply(Math, values) + "–" + Math.max.apply(Math, values);
      if (!state.editMode) return '<span class="badge">Коэф. ' + escapeHtml(levelName.toUpperCase()) + ': ' + escapeHtml(summary) + '</span>';
      return '<button type="button" class="btn aggregation-group-coefficient-edit" data-coefficient-level="' + escapeHtml(levelName) + '" data-group-code="' + escapeHtml(code) + '" data-current-value="' + (values.length === 1 ? escapeHtml(values[0]) : '') + '" data-placeholder="' + escapeHtml(summary) + '" onclick="event.stopPropagation()" aria-label="Изменить коэффициент группы ' + escapeHtml(code) + '">Коэф. ' + escapeHtml(levelName.toUpperCase()) + ': ' + escapeHtml(summary) + '</button>';
    }

    const groupedRows = Array.from(hierarchy.values()).sort(function (a, b) { return a.code.localeCompare(b.code, "ru"); }).map(function (kq1) {
      const kq1Entries = Array.from(kq1.groups.values()).reduce(function (all, group) { return all.concat(group.entries); }, []);
      const kq2Rows = Array.from(kq1.groups.values()).sort(function (a, b) { return a.code.localeCompare(b.code, "ru"); }).map(function (kq2) {
        const erRows = kq2.entries.sort(function (a, b) { return a.erCode.localeCompare(b.erCode, "ru"); }).map(function (entry) {
          return '<tr><td><strong>' + escapeHtml(entry.erCode) + '</strong></td><td>' + escapeHtml(entry.erName) + '</td><td>' + escapeHtml(entry.unit) + '</td><td class="num">' + coefficientCell("kq1", entry) + '</td><td class="num">' + coefficientCell("kq2", entry) + '</td><td>' + escapeHtml(entry.status || "Действует") + '</td></tr>';
        }).join("");
        return '<details class="card" style="margin:8px 0"><summary style="cursor:pointer;padding:12px 16px"><span class="badge">Уровень 2 · KQ-2</span> <strong>' + escapeHtml(kq2.code) + '</strong> — ' + escapeHtml(kq2.name) + (kq2.corrected ? ' <span class="badge warning">JSON</span>' : '') + ' ' + groupCoefficientControl("kq2", kq2.code, kq2.entries) + ' <span class="badge">ЕР: ' + kq2.entries.length + '</span></summary><div class="table-wrap"><table><thead><tr><th>Уровень 3 · Шифр ЕР</th><th>Наименование ЕР</th><th>Ед. изм.</th><th class="num">Коэф. KQ-1</th><th class="num">Коэф. KQ-2</th><th>Статус</th></tr></thead><tbody>' + erRows + '</tbody></table></div></details>';
      }).join("");
      return '<details class="card" style="margin:12px 0"><summary style="cursor:pointer;padding:14px 16px"><span class="badge green">Уровень 1 · KQ-1</span> <strong>' + escapeHtml(kq1.code) + '</strong> — ' + escapeHtml(kq1.name) + (kq1.corrected ? ' <span class="badge warning">JSON</span>' : '') + ' ' + groupCoefficientControl("kq1", kq1.code, kq1Entries) + ' <span class="badge">KQ-2: ' + kq1.groups.size + '</span> <span class="badge">ЕР: ' + kq1.count + '</span></summary><div style="padding:0 12px 12px">' + kq2Rows + '</div></details>';
    }).join("");

    const searchBlock = '<div class="field"><label for="aggregation-search">Поиск по шифрам</label><div class="form-actions"><input class="input" id="aggregation-search" type="search" placeholder="Введите KQ-1, KQ-2 или Шифр ЕР" value="' + escapeHtml(state.aggregationSearch) + '" />' + (state.aggregationSearch ? button("Очистить", "refresh", "", 'id="clear-aggregation-search"') : '') + '</div><p class="field-note">Поиск выполняется одновременно по кодам KQ-1, KQ-2 и единичных расценок.</p></div>';
    const editHint = state.editMode ? '<div class="banner">' + icon("sliders") + '<div><strong>Режим редактирования:</strong> нажмите на любой коэффициент KQ-1 или KQ-2 в таблице либо на коэффициент группы в заголовке. Для значений из БД КФО используйте таблицу раздела «БД КФО». Enter сохраняет значение, Esc отменяет, клик вне поля сохраняет. После изменений скачайте обновлённый JSON.</div></div>' : '';
    const body = entries.length
      ? editHint + searchBlock + '<div class="banner">' + icon("info") + '<div>Уровни скрываются и раскрываются последовательно: KQ-1 → KQ-2 → Шифр ЕР. Найдено ' + filteredEntries.length + ' из ' + entries.length + ' шифров ЕР.</div></div>' + (filteredEntries.length ? coefficientOverview + groupedRows : emptyState("Совпадений не найдено", "Измените запрос: поиск проверяет только коды KQ-1, KQ-2 и Шифр ЕР.", "book"))
      : emptyState("Справочник BOQ не загружен", state.aggregation.message, "book");

    const aggregationActions = button("Загрузить справочник BOQ", "upload", "", 'id="load-aggregation"') + (state.editMode && runtimeConfig ? button("Скачать JSON", "download", state.aggregation.parserDirty ? "btn-primary" : "", 'id="download-parser-config"') : "");

    return pageHead(item, aggregationActions) +
      '<div class="stack"><div class="banner">' + icon("info") + '<div>Облегчённый модуль BOQ не загружается автоматически. Excel читается только по нажатию кнопки и по правилам внешнего JSON-конфигуратора.</div></div>' +
      '<section class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Подключение справочника BOQ</h3><span class="badge ' + (entries.length ? "green" : "warning") + '">' + (entries.length ? entries.length + " записей" : "Нет данных") + '</span></div><p class="card-desc">Источник из JSON: ' + escapeHtml((runtimeConfig && runtimeConfig.sources && runtimeConfig.sources.aggregation.url) || source.url || "не задан") + '<br>Конфигуратор: ' + escapeHtml(state.config.parserConfigUrl || "не задан") + (state.aggregation.parserVersion ? ' (версия ' + escapeHtml(state.aggregation.parserVersion) + ')' : '') + '<br>Активный уровень: ' + escapeHtml(activeLevel.toUpperCase()) + '; приоритет: ' + escapeHtml(priorityText) + '</p></div><div class="card-body">' + body + '</div></section></div>';
  }

  // =====================================================================
  // 17. РЕНДЕР СТРАНИЦЫ "ОТЧЁТ"
  // =====================================================================
  function findLoadedRatePrice(contractor, rateCode) {
    const contractorData = state.pricing.data[contractor];
    if (!contractorData) return null;
    for (const contract of Object.values(contractorData.contracts || {})) {
      for (const calculation of Object.values(contract.priceCalculations || {})) {
        const rate = calculation.rates && calculation.rates[rateCode];
        if (rate && Number.isFinite(Number(rate.totalPrice))) return Number(rate.totalPrice);
      }
    }
    return null;
  }

  function reportReadiness() {
    const kfoReady = state.kfo.status === "active" && state.kfo.groups.length > 0;
    const pricingReady = state.pricing.status === "active" && Object.keys(state.pricing.data).length > 0;
    const matched = kfoReady && pricingReady && state.kfo.groups.some(function(group) { return findLoadedRatePrice(group.contractor, group.kqCode) != null; });
    return [
      { label: "БД КФО загружена", ready: kfoReady },
      { label: "Источники расценок загружены", ready: pricingReady },
      { label: "Выполнено сопоставление данных", ready: matched },
      { label: "Все обязательные проверки завершены", ready: kfoReady && pricingReady && matched }
    ];
  }

  function calculateReport() {
    const readiness = reportReadiness();
    if (!readiness.every(function(item) { return item.ready; })) return false;
    const rows = [];
    const monthly = {};
    const monthlyByContractor = {};
    let total = 0;
    state.kfo.groups.forEach(function(group) {
      const price = findLoadedRatePrice(group.contractor, group.kqCode);
      if (price == null) return;
      const volume = Number(group.actualSmr) || 0;
      const cost = volume * price;
      rows.push({ contractor: group.contractor, code: group.kqCode, volume: volume, price: price, cost: cost });
      total += cost;
      Object.keys(group.monthly || {}).forEach(function(month) {
        const monthCost = (Number(group.monthly[month]) || 0) * price;
        monthly[month] = (monthly[month] || 0) + monthCost;
        const contractorMonths = monthlyByContractor[group.contractor] = monthlyByContractor[group.contractor] || {};
        contractorMonths[month] = (contractorMonths[month] || 0) + monthCost;
      });
    });
    state.report = { contractor: state.report.contractor || "__ALL__", calculated: true, rows: rows, monthly: monthly, monthlyByContractor: monthlyByContractor, total: total, message: "Расчёт завершён: " + rows.length + " сопоставлений" };
    return true;
  }

  function renderReport(item) {
    const readiness = reportReadiness();
    const ready = readiness.every(function(entry) { return entry.ready; });
    const contractors = Array.from(new Set((state.report.rows || []).map(function(row) { return row.contractor; }))).sort();
    const selected = state.report.contractor || "__ALL__";
    const filteredRows = (state.report.rows || []).filter(function(row) { return selected === "__ALL__" || row.contractor === selected; });
    const total = filteredRows.reduce(function(sum, row) { return sum + row.cost; }, 0);
    const selectedMonthly = selected === "__ALL__" ? (state.report.monthly || {}) : ((state.report.monthlyByContractor || {})[selected] || {});
    const months = Object.keys(selectedMonthly).sort();
    const values = months.map(function(month) { return selectedMonthly[month]; });
    const max = Math.max.apply(null, values.concat([1]));
    const points = values.map(function(value, index) { return (20 + index * (560 / Math.max(1, values.length - 1))) + ',' + (180 - value / max * 150); }).join(' ');
    const chart = months.length ? '<svg viewBox="0 0 600 210" role="img" aria-label="Месячная динамика"><line x1="20" y1="180" x2="580" y2="180" stroke="#cbd5e1"/><polyline fill="none" stroke="#2563eb" stroke-width="4" points="' + points + '"/>' + months.map(function(month, i) { return '<text x="' + (20 + i * (560 / Math.max(1, months.length - 1))) + '" y="202" text-anchor="middle" font-size="10">' + escapeHtml(month) + '</text>'; }).join('') + '</svg>' : emptyState("Нет рассчитанной динамики", "Выполните ручной расчёт стоимости.", "clipboard");
    const checklist = readiness.map(function(entry) { return '<li style="color:' + (entry.ready ? 'var(--success)' : 'var(--danger)') + '">' + (entry.ready ? '✓ ' : '✕ ') + escapeHtml(entry.label) + '</li>'; }).join('');
    const rowsHtml = filteredRows.map(function(row) { return '<tr><td>' + escapeHtml(row.contractor) + '</td><td>' + escapeHtml(row.code) + '</td><td class="num">' + formatNumber(row.volume, 2) + '</td><td class="num">' + formatNumber(row.price, 2) + '</td><td class="num">' + formatNumber(row.cost, 2) + '</td></tr>'; }).join('');
    return pageHead(item, button("Рассчитать стоимость", "calculator", "btn-primary", 'id="calculate-report" ' + (ready ? '' : 'disabled'))) + '<div class="stack"><section class="card"><div class="card-header"><h3 class="card-title">Check List готовности</h3></div><div class="card-body"><ul>' + checklist + '</ul><p class="result-note">' + escapeHtml(state.report.message) + '</p></div></section><section class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Месячная динамика выполнения</h3><select class="input" id="report-contractor" style="max-width:280px"><option value="__ALL__">Все подрядчики</option>' + contractors.map(function(name) { return '<option value="' + escapeHtml(name) + '"' + (name === selected ? ' selected' : '') + '>' + escapeHtml(name) + '</option>'; }).join('') + '</select></div></div><div class="card-body">' + chart + '</div></section><section class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Отчёт</h3><span class="badge green">' + formatNumber(total, 2) + ' ₽</span></div></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>Подрядчик</th><th>Расценка</th><th class="num">Объём</th><th class="num">Цена</th><th class="num">Стоимость</th></tr></thead><tbody>' + (rowsHtml || '<tr><td colspan="5">Нет рассчитанных данных</td></tr>') + '</tbody></table></div></div></section></div>';
  }

  // =====================================================================
  // 18. РЕНДЕР СТРАНИЦЫ "АДМИНИСТРАТИВНЫЕ НАСТРОЙКИ"
  // =====================================================================
  function renderAdmin(item) {
    const cfg = state.config || DEFAULT_CONFIG;
    const exportConfig = cfg.export || DEFAULT_CONFIG.export;
    const locked = state.editMode ? "" : '<div class="banner warning">' + icon("lock") + '<div>Включите <strong>режим редактирования</strong> в футере, чтобы изменить настройки.</div></div>';

    return pageHead(item, button("Скачать config.json", "download", "btn-primary edit-only", 'id="admin-download"')) +
      '<div class="stack">' + locked +
      '<section class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Основные параметры</h3><span class="badge green">config.json</span></div><p class="card-desc">Расположение конфигурации, настройки интерфейса и параметры экспортируемого отчёта.</p></div><div class="card-body"><div class="field-grid">' +
      '<div class="field field-wide"><label for="setting-config-url">Адрес расположения config.json (только для чтения)</label><input class="input" id="setting-config-url" type="url" value="' + escapeHtml(DEFAULT_CONFIG.configUrl || '') + '" disabled readonly style="background: var(--muted); cursor: default;" /></div>' +
      '<div class="field"><label for="setting-title">Заголовок приложения</label><input class="input" id="setting-title" value="' + escapeHtml(cfg.title || DEFAULT_CONFIG.title) + '" ' + (state.editMode ? "" : "disabled") + ' /></div>' +
      '<div class="field"><label for="setting-version">Версия конфигурации</label><input class="input" id="setting-version" value="' + escapeHtml(cfg.version || DEFAULT_CONFIG.version) + '" ' + (state.editMode ? "" : "disabled") + ' /></div>' +
      '<div class="field"><label for="setting-file">Имя файла экспорта</label><input class="input" id="setting-file" value="' + escapeHtml(exportConfig.fileName || DEFAULT_CONFIG.export.fileName) + '" ' + (state.editMode ? "" : "disabled") + ' /></div>' +
      '<div class="field"><label for="setting-sheet">Название листа Excel</label><input class="input" id="setting-sheet" value="' + escapeHtml(exportConfig.sheetName || DEFAULT_CONFIG.export.sheetName) + '" ' + (state.editMode ? "" : "disabled") + ' /></div>' +
      '</div></div><div class="card-footer edit-only block">' + button("Применить изменения", "check", "btn-primary", 'id="apply-settings"') + '</div></section>' +
      '<section class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">Источники и логика проекта</h3><span class="badge">Централизованное управление</span></div><p class="card-desc">Ссылки на нормативный Excel и JSON-конфигуратор парсеров.</p></div><div class="card-body"><div class="field-grid">' +
      '<div class="field field-wide"><label for="setting-aggregation-url">Справочник BOQ (Excel)</label><input class="input" id="setting-aggregation-url" type="url" placeholder="https://...sharepoint.com/.../aggregation.xlsx" value="' + escapeHtml((cfg.aggregationSource || {}).url || "") + '" ' + (state.editMode ? "" : "disabled") + ' /></div>' +
      '<div class="field field-wide"><label for="setting-parser-config-url">JSON-конфигуратор парсеров</label><input class="input" id="setting-parser-config-url" type="url" value="' + escapeHtml(cfg.parserConfigUrl || "") + '" ' + (state.editMode ? "" : "disabled") + ' /></div>' +
      '</div></div><div class="card-footer edit-only block">' + button("Проверить конфигуратор", "refresh", "", 'id="check-parser-config"') + button("Применить изменения", "check", "btn-primary", 'id="apply-source-settings"') + '</div></section>' +
      '<section class="card"><div class="card-header"><h3 class="card-title">Структура конфигурации</h3><p class="card-desc">Состояние подключённых источников и соответствий.</p></div><div class="card-body"><div class="grid-3"><div class="stat"><div class="stat-label">Источников данных</div><div class="stat-value">' + (state.config.dataSources || []).length + '</div></div><div class="stat"><div class="stat-label">Регламентов</div><div class="stat-value">' + Object.keys(state.config.coefficientBindings || {}).length + '</div></div><div class="stat"><div class="stat-label">Баз расценок</div><div class="stat-value">' + Object.keys(state.config.pricingBindings || {}).length + '</div></div></div></div></section>' +
      '</div>';
  }


  // =====================================================================
  // 19. РЕНДЕР СТРАНИЦЫ "РАСЦЕНКИ" (С ИНТЕГРАЦИЕЙ СО СПРАВОЧНИКОМ)
  // =====================================================================
  function renderPricing(item) {
    const isEdit = state.editMode;
    const pricing = state.pricing;
    const allContractorNames = getContractorNamesFromDirectory();
    const allRates = getAllRates();
    const addForm = state.pricing.addForm || {};
    const searchVal = state.pricing.rateSearchInput || '';

    const devBanner = '<div class="banner warning" style="margin-bottom:8px;">' +
        icon("info") +
        '<div><strong>Раздел расценок.</strong> Загрузка стоимости работ и привязка расценок к контрагентам. Список подрядчиков из справочника.</div>' +
    '</div>';

    let addFormHTML = '';
    if (isEdit) {
        const selectedAddContractor = addForm.contractor || '';
        const addContractList = getKfoContracts(selectedAddContractor);
        const contractOptions = addContractList.map(function(contract) {
            return '<option value="' + escapeHtml(contract) + '"' + (contract === addForm.contract ? ' selected' : '') + '>' + escapeHtml(contract) + '</option>';
        }).join('');
        const addContractReady = addContractList.indexOf(addForm.contract) >= 0;
        const contractorOptions = allContractorNames.map(function(name) {
            const hasRates = state.pricing.data[name] &&
                           Object.keys(state.pricing.data[name].contracts || {}).length > 0;
            return '<option value="' + escapeHtml(name) + '"' + (name === selectedAddContractor ? ' selected' : '') + '>' +
                   escapeHtml(name) + (hasRates ? ' ✓' : '') +
                   '</option>';
        }).join('');
        const availableSheets = Array.isArray(addForm.availableSheets) ? addForm.availableSheets : [];
        const sheetOptions = availableSheets.map(function(name) { return '<option value="' + escapeHtml(name) + '"></option>'; }).join('');
        const fileCheckNote = addForm.fileCheckMessage
          ? '<div class="banner ' + (addForm.fileCheckStatus === "error" ? "warning" : "") + '" style="margin-top:10px"><div>' + escapeHtml(addForm.fileCheckMessage) + '</div></div>'
          : '';

        addFormHTML = '<div class="add-form">' +
            '<div class="form-title">➕ Добавление источника расценок</div>' +
            '<div class="form-row">' +
                '<div class="field"><label>Контрагент</label>' +
                    '<select class="input" id="add-contractor">' +
                        '<option value="">— Выберите из справочника —</option>' +
                        contractorOptions +
                    '</select>' +
                    '<span style="font-size:9px;color:var(--muted-foreground);">' +
                        'Подрядчиков в справочнике: ' + allContractorNames.length +
                        ' (✓ - есть расценки)' +
                    '</span>' +
                '</div>' +
                '<div class="field"><label>Договор</label>' +
                    '<select class="input" id="add-contract"' + (selectedAddContractor && contractOptions ? '' : ' disabled') + '><option value="">— Выберите договор из БД КФО —</option>' + contractOptions + '</select>' +
                    (selectedAddContractor && !contractOptions ? '<span style="font-size:9px;color:var(--danger);">У подрядчика нет договоров в загруженной БД КФО</span>' : '') + '</div>' +
                '<div class="field"><label>РДЦ</label>' +
                    '<input class="input" id="add-rdc" placeholder="Например: РДЦ-1" value="' + escapeHtml(addForm.rdc || '') + '" /></div>' +
                '<div>' + button("Добавить", "plus", "btn-primary", 'id="add-pricing-source"' + (selectedAddContractor && addContractReady ? '' : ' disabled')) + '</div>' +
            '</div>' +
            '<div class="form-details">' +
                '<div class="field"><label>URL источника (Excel)</label>' +
                    '<input class="input" id="add-source-url" placeholder="https://sp.sibur.local/..." value="' + escapeHtml(addForm.sourceUrl || '') + '" />' + button("Проверить файл", "check", "btn-ghost", 'id="check-pricing-file"') + '</div>' +
                '<div class="field"><label>Наименование вкладки</label>' +
                    '<input class="input" id="add-sheet-name" list="pricing-sheet-options" placeholder="Расценки" value="' + escapeHtml(addForm.sheetName || 'Расценки') + '" /><datalist id="pricing-sheet-options">' + sheetOptions + '</datalist></div>' +
                '<div class="field"><label>Колонка: шифр ЕР</label>' +
                    '<input class="input" id="add-col-code" placeholder="A" value="' + escapeHtml(addForm.colCode || 'A') + '" style="text-transform:uppercase;" /></div>' +
                '<div class="field"><label>Колонка: наименование</label>' +
                    '<input class="input" id="add-col-name" placeholder="B" value="' + escapeHtml(addForm.colName || 'B') + '" style="text-transform:uppercase;" /></div>' +
                '<div class="field"><label>Колонка: ед. изм.</label>' +
                    '<input class="input" id="add-col-unit" placeholder="C" value="' + escapeHtml(addForm.colUnit || 'C') + '" style="text-transform:uppercase;" /></div>' +
                '<div class="field"><label>Колонка: валюта</label>' +
                    '<input class="input" id="add-col-currency" placeholder="D" value="' + escapeHtml(addForm.colCurrency || 'D') + '" style="text-transform:uppercase;" /></div>' +
                '<div class="field"><label>Колонка: цена (прямые)</label>' +
                    '<input class="input" id="add-col-baseprice" placeholder="E" value="' + escapeHtml(addForm.colBasePrice || 'E') + '" style="text-transform:uppercase;" /></div>' +
                '<div class="field"><label>% косвенных</label>' +
                    '<input class="input" id="add-indirect-percent" placeholder="12.5" value="' + escapeHtml(addForm.indirectPercent || '') + '" type="number" step="0.01" min="0" max="100" /></div>' +
            '</div>' +
            '<div style="margin-top:10px;font-size:11px;color:var(--muted-foreground);">' +
                'Подрядчик выбирается из справочника, а договор — только из актуальной БД КФО. После проверки Excel вкладку можно ввести вручную или выбрать из найденного списка.' +
            '</div>' + fileCheckNote +
        '</div>';
    }

    let treeHTML = '';
    const searchLower = searchVal.trim().toLowerCase();

    let filteredTree = {};
    if (searchLower) {
        Object.keys(pricing.data).forEach(function(contractor) {
            const contracts = pricing.data[contractor].contracts || {};
            Object.keys(contracts).forEach(function(contract) {
                const rdц = contracts[contract].priceCalculations || {};
                Object.keys(rdц).forEach(function(rdцKey) {
                    const rates = rdц[rdцKey].rates || {};
                    Object.keys(rates).forEach(function(rateKey) {
                        const rate = rates[rateKey];
                        const nameMatch = (rate.name || "").toLowerCase().indexOf(searchLower) >= 0;
                        const codeMatch = rateKey.toLowerCase().indexOf(searchLower) >= 0;
                        if (nameMatch || codeMatch) {
                            if (!filteredTree[contractor]) filteredTree[contractor] = { contracts: {} };
                            if (!filteredTree[contractor].contracts[contract]) {
                                filteredTree[contractor].contracts[contract] = { priceCalculations: {} };
                            }
                            if (!filteredTree[contractor].contracts[contract].priceCalculations[rdцKey]) {
                                filteredTree[contractor].contracts[contract].priceCalculations[rdцKey] = { rates: {} };
                            }
                            filteredTree[contractor].contracts[contract].priceCalculations[rdцKey].rates[rateKey] = rate;
                            filteredTree[contractor].contracts[contract].priceCalculations[rdцKey].indirectPercent = rdц[rdцKey].indirectPercent || 0;
                            filteredTree[contractor].contracts[contract].priceCalculations[rdцKey].sourceUrl = rdц[rdцKey].sourceUrl || "";
                        }
                    });
                });
            });
        });
    }

    const dataToRender = searchLower ? filteredTree : pricing.data;
    const treeContractorNames = Object.keys(dataToRender).sort();

    if (treeContractorNames.length) {
        treeHTML = treeContractorNames.map(function(contractorName, cIdx) {
            const contractor = dataToRender[contractorName];
            const contractKeys = Object.keys(contractor.contracts || {});

            let contractsHTML = contractKeys.map(function(contractKey, dIdx) {
                const contract = contractor.contracts[contractKey];
                const rdцKeys = Object.keys(contract.priceCalculations || {});

                let rdцHTML = rdцKeys.map(function(rdцKey, rIdx) {
                    const rdц = contract.priceCalculations[rdцKey];
                    const rateKeys = Object.keys(rdц.rates || {});
                    const indirect = rdц.indirectPercent || 0;
                    const sourceUrl = rdц.sourceUrl || "";
                    const sourceSheetName = rdц.sheetName || "";

                    let ratesHeader = '<div class="rate-header">' +
                        '<span class="h-check">✓</span>' +
                        '<span class="h-code">Шифр ЕР</span>' +
                        '<span class="h-name">Наименование</span>' +
                        '<span class="h-unit">Ед.</span>' +
                        '<span class="h-price">Цена (прямые)</span>' +
                        '<span class="h-total">Цена (прямые+косв.)</span>' +
                        '<span class="h-currency">Валюта</span>' +
                    '</div>';

                    let ratesHTML = rateKeys.map(function(rateKey) {
                        const rate = rdц.rates[rateKey];
                        const sourceSelected = state.pricing.comparison.selectedContractors.some(function(entry) {
                            return entry.name === contractorName && entry.contract === contractKey && entry.priceCalculation === rdцKey;
                        });
                        const isSelected = sourceSelected && state.pricing.comparison.selectedRates.indexOf(rateKey) >= 0;
                        return '<div class="rate-row">' +
                            '<span class="rate-check"><input type="checkbox" data-rate-check="' + escapeHtml(rateKey) + '" ' + (isSelected ? 'checked' : '') + ' data-contractor="' + escapeHtml(contractorName) + '" data-contract="' + escapeHtml(contractKey) + '" data-rdc="' + escapeHtml(rdцKey) + '" /></span>' +
                            '<span class="rate-code">' + escapeHtml(rateKey) + '</span>' +
                            '<span class="rate-name" title="' + escapeHtml(rate.name || '') + '">' + escapeHtml(rate.name || rateKey) + '</span>' +
                            '<span class="rate-unit">' + escapeHtml(rate.unit || "—") + '</span>' +
                            '<span class="rate-price">' + formatNumber(rate.basePrice) + '</span>' +
                            '<span class="rate-total">' + formatNumber(rate.totalPrice) + '</span>' +
                            '<span class="rate-currency">' + escapeHtml(rate.currency || "RUB") + '</span>' +
                            (isEdit ? '<span class="rate-actions">' + button("✕", "trash", "btn-ghost", 'style="min-height:18px;padding:0 4px;font-size:9px;"') + '</span>' : '') +
                            '</div>';
                    }).join('');

                    const rdcId = generateNodeId('rdc', [cIdx, dIdx, rIdx]);
                    const isOpen = state.pricing.expanded.rdcs[rdcId] !== undefined ? state.pricing.expanded.rdcs[rdcId] : (isEdit || false);
                    const displayStyle = isOpen ? '' : 'none';
                    const toggleIcon = isOpen ? icon("chevronDown") : icon("chevronRight");

                    const urlField = isEdit ? '<div class="source-url-edit" style="margin-top:4px;padding-left:20px;">' +
                        '<label style="font-size:10px;color:var(--muted-foreground);">Источник:</label>' +
                        '<input type="text" value="' + escapeHtml(sourceUrl) + '" data-source-url="' + escapeHtml(contractorName) + '" data-contract="' + escapeHtml(contractKey) + '" data-rdc="' + escapeHtml(rdцKey) + '" style="flex:1;min-width:200px;" />' +
                        '<label style="font-size:10px;color:var(--muted-foreground);">Вкладка:</label>' +
                        '<input type="text" value="' + escapeHtml(sourceSheetName) + '" data-source-sheet="' + escapeHtml(contractorName) + '" data-contract="' + escapeHtml(contractKey) + '" data-rdc="' + escapeHtml(rdцKey) + '" style="width:160px;" />' +
                        '</div>' : '';

                    return '<div class="pricing-node" style="margin:2px 0;">' +
                        '<div class="node-header level-2" data-toggle="rdc-' + cIdx + '-' + dIdx + '-' + rIdx + '">' +
                            '<span class="toggle">' + toggleIcon + '</span>' +
                            '<span>📊 ' + escapeHtml(rdцKey) + '</span>' +
                            '<span class="indirect-edit">' +
                                '% косв.: <input type="number" step="0.01" min="0" max="100" value="' + escapeHtml(indirect) + '" data-indirect-contractor="' + escapeHtml(contractorName) + '" data-contract="' + escapeHtml(contractKey) + '" data-rdc="' + escapeHtml(rdцKey) + '" ' + (isEdit ? '' : 'disabled') + ' />%' +
                                (isEdit ? button("✓", "refresh", "btn-ghost", 'style="min-height:20px;padding:0 4px;font-size:9px;"') : '') +
                            '</span>' +
                            (isEdit ? '<span class="node-actions">' +
                                button("✕", "trash", "btn-ghost", 'style="min-height:20px;padding:0 4px;font-size:9px;"') +
                            '</span>' : '') +
                        '</div>' +
                        '<div class="node-children" data-children="rdc-' + cIdx + '-' + dIdx + '-' + rIdx + '" style="display:' + displayStyle + ';">' +
                            urlField +
                            ratesHeader + ratesHTML +
                        '</div>' +
                    '</div>';
                }).join('');

                const contractId = generateNodeId('contract', [cIdx, dIdx]);
                const isOpenContract = state.pricing.expanded.contracts[contractId] !== undefined ? state.pricing.expanded.contracts[contractId] : (isEdit || false);
                const displayContractStyle = isOpenContract ? '' : 'none';
                const toggleContractIcon = isOpenContract ? icon("chevronDown") : icon("chevronRight");

                return '<div class="pricing-node" style="margin:2px 0;">' +
                    '<div class="node-header level-1" data-toggle="contract-' + cIdx + '-' + dIdx + '">' +
                        '<span class="toggle">' + toggleContractIcon + '</span>' +
                        '<span>📄 ' + escapeHtml(contractKey) + '</span>' +
                        (isEdit ? '<span class="node-actions">' +
                            button("+ РДЦ", "plus", "btn-ghost", 'style="min-height:22px;padding:1px 8px;font-size:10px;"') +
                            button("✕", "trash", "btn-ghost", 'style="min-height:20px;padding:0 4px;font-size:9px;"') +
                        '</span>' : '') +
                    '</div>' +
                    '<div class="node-children" data-children="contract-' + cIdx + '-' + dIdx + '" style="display:' + displayContractStyle + ';">' +
                        rdцHTML +
                    '</div>' +
                '</div>';
            }).join('');

            const contractorId = generateNodeId('contractor', [cIdx]);
            const isOpenContractor = state.pricing.expanded.contractors[contractorId] !== undefined ? state.pricing.expanded.contractors[contractorId] : (isEdit || false);
            const displayContractorStyle = isOpenContractor ? '' : 'none';
            const toggleContractorIcon = isOpenContractor ? icon("chevronDown") : icon("chevronRight");

            return '<div class="pricing-node" style="margin:2px 0;">' +
                '<div class="node-header level-0" data-toggle="contractor-' + cIdx + '">' +
                    '<span class="toggle">' + toggleContractorIcon + '</span>' +
                    '<span>🏢 ' + escapeHtml(contractorName) + '</span>' +
                    ' <span class="badge" style="font-size:9px;">' + contractKeys.length + ' договоров</span>' +
                    (isEdit ? '<span class="node-actions">' +
                        button("+ Договор", "plus", "btn-ghost", 'style="min-height:22px;padding:1px 8px;font-size:10px;"') +
                        button("✕", "trash", "btn-ghost", 'style="min-height:20px;padding:0 4px;font-size:9px;"') +
                    '</span>' : '') +
                '</div>' +
                '<div class="node-children" data-children="contractor-' + cIdx + '" style="display:' + displayContractorStyle + ';">' +
                    contractsHTML +
                '</div>' +
            '</div>';
        }).join('');
    } else {
        treeHTML = searchLower
            ? '<div class="empty" style="min-height:80px;"><div class="empty-title" style="font-size:12px;">Совпадений не найдено</div><div class="empty-note">Попробуйте изменить запрос поиска</div></div>'
            : '<div class="empty"><div class="empty-icon">' + icon("info") + '</div><div class="empty-title">Расценки не загружены</div><div class="empty-note">Добавьте источник расценок в режиме редактирования</div></div>';
    }

    // Сравнительный анализ
    const comparison = state.pricing.comparison;
    let comparisonTableHTML = '';
    const selectedRates = comparison.selectedRates;
    const selectedContractors = comparison.selectedContractors;

    if (selectedRates.length && selectedContractors.length) {
        let headers = '<th style="text-align:left;min-width:100px;">Шифр ЕР</th>' +
                      '<th style="text-align:left;min-width:120px;">Наименование</th>' +
                      '<th style="text-align:center;min-width:50px;">Ед.</th>';
        selectedContractors.forEach(function(entry) {
            headers += '<th class="contractor-header">' + escapeHtml(entry.name) +
                '<span class="sub">' + escapeHtml(entry.contract) + ' · ' + escapeHtml(entry.priceCalculation) + '</span></th>';
        });
        if (selectedContractors.length === 2) {
            headers += '<th class="num">Разница</th>';
        }

        let rows = selectedRates.map(function(rateCode) {
            const rateName = getRateName(rateCode);
            const unit = getRateUnit(rateCode);
            let row = '<td class="rate-code-cell">' + escapeHtml(rateCode) + '</td>' +
                      '<td class="rate-name-cell">' + escapeHtml(rateName) + '</td>' +
                      '<td class="rate-unit-cell">' + escapeHtml(unit) + '</td>';

            let values = [];
            selectedContractors.forEach(function(entry) {
                const price = getRatePrice(entry.name, entry.contract, entry.priceCalculation, rateCode);
                const formatted = price !== null ? formatNumber(price) : "—";
                row += '<td class="num">' + formatted + '</td>';
                values.push(price);
            });

            if (selectedContractors.length === 2) {
                const diff = values[0] !== null && values[1] !== null ? values[0] - values[1] : null;
                const diffClass = diff !== null ? (diff > 0 ? 'highlight-diff' : (diff < 0 ? 'highlight-negative' : '')) : '';
                row += '<td class="num ' + diffClass + '">' + (diff !== null ? formatNumber(diff) : "—") + '</td>';
            }

            return '<tr>' + row + '</tr>';
        }).join('');

        comparisonTableHTML = '<div class="comparison-table-wrap"><table class="comparison-table"><thead><tr>' + headers + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    } else {
        comparisonTableHTML = '<div class="empty" style="min-height:120px;"><div class="empty-title" style="font-size:12px;">Выберите подрядчиков и расценки для сравнения</div><div class="empty-note">Используйте поиск слева для добавления элементов</div></div>';
    }

    const selectedContractorsHTML = selectedContractors.map(function(entry) {
        const contracts = getContractorContracts(entry.name);
        const rdcs = getContractorRDC(entry.name, entry.contract);

        return '<div class="comparison-item" style="flex-wrap:wrap;padding:4px 0;">' +
            '<input type="checkbox" checked data-remove-contractor="' + escapeHtml(entry.name) + '" data-remove-contract="' + escapeHtml(entry.contract) + '" data-remove-rdc="' + escapeHtml(entry.priceCalculation) + '" style="align-self:flex-start;margin-top:3px;" />' +
            '<div style="flex:1;min-width:100px;">' +
                '<div style="font-weight:600;font-size:12px;">' + escapeHtml(entry.name) + '</div>' +
                '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;">' +
                    '<select class="input input-sm" style="min-height:24px;width:90px;font-size:10px;" data-comparison-contract="' + escapeHtml(entry.name) + '">' +
                        contracts.map(function(c) {
                            return '<option value="' + escapeHtml(c) + '" ' + (c === entry.contract ? 'selected' : '') + '>' + escapeHtml(c) + '</option>';
                        }).join('') +
                    '</select>' +
                    '<select class="input input-sm" style="min-height:24px;width:90px;font-size:10px;" data-comparison-rdc="' + escapeHtml(entry.name) + '">' +
                        rdcs.map(function(r) {
                            return '<option value="' + escapeHtml(r) + '" ' + (r === entry.priceCalculation ? 'selected' : '') + '>' + escapeHtml(r) + '</option>';
                        }).join('') +
                    '</select>' +
                '</div>' +
            '</div>' +
        '</div>';
    }).join('');

    const selectedRatesHTML = selectedRates.map(function(rate) {
        const name = getRateName(rate);
        return '<div class="comparison-item">' +
            '<input type="checkbox" checked data-remove-rate="' + escapeHtml(rate) + '" />' +
            '<span class="item-code">' + escapeHtml(rate) + '</span>' +
            '<span class="item-name">' + escapeHtml(name) + '</span>' +
        '</div>';
    }).join('');

    const primaryRate = selectedRates[0] || "";
    const primaryControl = primaryRate
      ? '<div class="banner"><div><strong>Основная сравниваемая расценка:</strong> ' + escapeHtml(primaryRate) + ' — ' + escapeHtml(getRateName(primaryRate)) + '</div>' + button("Удалить", "trash", "btn-danger", 'data-remove-primary-rate="' + escapeHtml(primaryRate) + '"') + '</div>'
      : '';
    const comparisonHTML =
        '<div class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">📈 Сравнительный анализ расценок</h3><span class="badge green">' + selectedContractors.length + ' подрядчиков · ' + selectedRates.length + ' расценок</span></div><p class="card-desc">Состав сравнения формируется флажками в основном дереве расценок. Дополнительные фильтры удалены.</p></div><div class="card-body">' +
        primaryControl +
        '<div class="grid-2"><section><h4>Выбранные подрядчики</h4>' + (selectedContractorsHTML || '<p class="result-note">Нет выбранных подрядчиков.</p>') + '</section><section><h4>Выбранные расценки</h4>' + (selectedRatesHTML || '<p class="result-note">Нет выбранных расценок.</p>') + '</section></div>' +
        '<div style="margin-top:12px">' + comparisonTableHTML + '</div></div></div>';

    const pricingBlock =
        '<section class="card"><div class="card-header"><div class="card-title-row"><h3 class="card-title">📊 Расценки</h3><span class="badge green">' + allContractorNames.length + ' подрядчиков · ' + allRates.length + ' расценок</span></div><p class="card-desc">Управление расценками: добавление источников, поиск и просмотр структуры.</p></div><div class="card-body">' +
        addFormHTML +
        '<div class="rate-search-wrap">' +
            '<div class="field">' +
                '<label for="rate-search">Поиск расценки</label>' +
                '<input class="input" id="rate-search" type="search" placeholder="Поиск по наименованию или шифру..." value="' + escapeHtml(state.pricing.rateSearchInput || '') + '" style="min-height:32px;font-size:12px;" />' +
            '</div>' +
            '<span class="badge" style="font-size:10px;white-space:nowrap;align-self:flex-end;margin-bottom:3px;">Найдено: ' + (searchLower ? Object.keys(filteredTree).length : allRates.length) + ' расценок</span>' +
            (searchLower ? button("Очистить", "refresh", "btn-ghost", 'id="clear-rate-search" style="min-height:30px;font-size:11px;"') : '') +
            button("Свернуть все", "chevronRight", "btn-ghost", 'id="collapse-all" style="min-height:30px;font-size:11px;"') +
        '</div>' +
        '<div class="pricing-tree">' + treeHTML + '</div>' +
        '</div></section>';

    const actions = button(state.pricing.status === "active" ? "Обновить расценки" : "Загрузить расценки", "refresh", "", 'id="refresh-pricing"');
    return pageHead(item, actions) +
    '<div class="stack">' +
        devBanner +
        (isEdit ? '<div class="banner">' + icon("info") + '<div><strong>Режим редактирования включён.</strong> Добавляйте источники расценок, управляйте договорами, РДЦ и % косвенных.</div></div>' : '') +
        pricingBlock +
        comparisonHTML +
        '<div class="banner" style="background:var(--muted);border-color:var(--border);">' +
            icon("info") +
            '<div><strong>Источники расценок.</strong> Для загрузки реальных данных добавьте источники в режиме редактирования. Список подрядчиков формируется из справочника подрядчиков.</div>' +
        '</div>' +
    '</div>';
  }

  // =====================================================================
  // 20. ОБРАБОТЧИКИ СОБЫТИЙ
  // =====================================================================
  function bindContentEvents() {
    const contentRoot = document.getElementById("content");
    document.getElementById("close-process-indicator")?.addEventListener("click", function() {
      state.process.visible = false;
      renderContent();
    });

    // БД КФО - дата среза
    const asOfDate = document.getElementById("as-of-date");
    if (asOfDate) asOfDate.addEventListener("change", function () { state.asOfDate = asOfDate.value || new Date().toISOString().slice(0, 10); });

    // БД КФО - уровень KQ
    const kqLevel = document.getElementById("kq-level");
    if (kqLevel) kqLevel.addEventListener("change", function () {
      state.kqLevel = ["kq1", "kq2"].indexOf(kqLevel.value) >= 0 ? kqLevel.value : "kq2";
    });

    // БД КФО - обновить
    document.getElementById("refresh-kfo-data")?.addEventListener("click", function() {
      const dateInput = document.getElementById("as-of-date");
      if (dateInput) state.asOfDate = dateInput.value || state.asOfDate;
      const levelInput = document.getElementById("kq-level");
      if (levelInput) {
        state.kqLevel = ["kq1", "kq2"].indexOf(levelInput.value) >= 0 ? levelInput.value : "kq2";
      }
      state.calculationMode = "with-regulations";
      loadKfoSources();
    });
    document.getElementById("load-project-kpi")?.addEventListener("click", loadProjectKpis);
    document.getElementById("calculate-report")?.addEventListener("click", function() {
      startProcess("Интегрированные данные", "Формирование отчета");
      updateProcess("Формирование отчета", 25, 0, "Проверяем готовность обязательных источников");
      if (calculateReport()) {
        finishProcess("success", "Завершено", state.report.rows.length, state.report.message);
        renderContent();
        showToast("Расчёт завершён", state.report.message);
      } else {
        finishProcess("warning", "Формирование отчета", 0, "Расчёт заблокирован: завершите обязательные этапы Check List");
        renderContent();
        showToast("Расчёт заблокирован", "Завершите обязательные этапы Check List.");
      }
    });
    document.getElementById("report-contractor")?.addEventListener("change", function(e) { state.report.contractor = e.target.value; renderContent(); });

    // БД КФО - поиск подрядчиков
    const contractorSearch = document.getElementById("contractor-search");
    if (contractorSearch) {
      contractorSearch.addEventListener("input", function() {
        state.contractorSearch = contractorSearch.value;
        window.clearTimeout(contractorSearchTimer);
        contractorSearchTimer = window.setTimeout(function() {
          renderContent();
          const newSearch = document.getElementById("contractor-search");
          if (newSearch) {
            newSearch.focus();
            newSearch.setSelectionRange(newSearch.value.length, newSearch.value.length);
          }
        }, 180);
      });
    }

    // БД КФО - выбор всех подрядчиков
    document.getElementById("select-all-contractors")?.addEventListener("change", function() {
      const allCheckbox = document.getElementById("select-all-contractors");
      if (allCheckbox.checked) {
        state.selectedContractors = ["__ALL__"];
        document.querySelectorAll(".contractor-check-item input[type='checkbox']").forEach(function(cb) {
          cb.checked = true;
        });
      } else {
        state.selectedContractors = [];
        document.querySelectorAll(".contractor-check-item input[type='checkbox']").forEach(function(cb) {
          cb.checked = false;
        });
      }
    });

    // БД КФО - выбор подрядчика
    document.querySelectorAll(".contractor-check-item input[type='checkbox']").forEach(function(checkbox) {
      checkbox.addEventListener("change", function() {
        const allCheckbox = document.getElementById("select-all-contractors");
        const checked = [];
        document.querySelectorAll(".contractor-check-item input[type='checkbox']:checked").forEach(function(cb) {
          checked.push(cb.value);
        });
        if (checked.length === 0) {
          state.selectedContractors = [];
          if (allCheckbox) allCheckbox.checked = false;
        } else {
          state.selectedContractors = checked;
          const totalItems = document.querySelectorAll(".contractor-check-item input[type='checkbox']").length;
          if (totalItems > 0 && checked.length === totalItems) {
            if (allCheckbox) allCheckbox.checked = true;
            state.selectedContractors = ["__ALL__"];
          } else {
            if (allCheckbox) allCheckbox.checked = false;
          }
        }
      });
    });

    // БД КФО - добавить источник
    document.getElementById("add-kfo-source")?.addEventListener("click", function() {
      const sources = ensureEditableSources();
      const source = normalizeKfoSource({ id: "kfo-" + Date.now(), name: "БД КФО " + (sources.length + 1), url: "" }, sources.length);
      sources.push(source);
      state.configDirty = true;
      applyConfigToChrome();
      renderContent();
    });

    // БД КФО - удалить источник
    document.querySelectorAll("[data-remove-source]").forEach(function (node) {
      node.addEventListener("click", function() {
        const index = Number(node.getAttribute("data-remove-source"));
        const sources = ensureEditableSources();
        const removed = sources.splice(index, 1)[0];
        if (removed) delete state.sourceConnections[removed.id];
        state.configDirty = true;
        applyConfigToChrome();
        renderContent();
      });
    });

    // БД КФО - изменение поля источника
    document.querySelectorAll("[data-source-field]").forEach(function (node) {
      node.addEventListener("change", function() {
        updateKfoSource(Number(node.getAttribute("data-source-index")), node.getAttribute("data-source-field"), node.value);
      });
      if (node.tagName === "INPUT") {
        node.addEventListener("input", function() {
          updateKfoSource(Number(node.getAttribute("data-source-index")), node.getAttribute("data-source-field"), node.value, true);
        });
      }
    });

    // БД КФО - изменение колонки
    document.querySelectorAll("[data-column-key]").forEach(function (node) {
      node.addEventListener("input", function() {
        updateKfoColumn(Number(node.getAttribute("data-source-index")), node.getAttribute("data-column-key"), node.value);
      });
    });

    // Справочник подрядчиков - синхронизация
    document.getElementById("sync-contractors")?.addEventListener("click", loadKfoSources);

    // Справочник подрядчиков - скачать config
    document.getElementById("directory-download")?.addEventListener("click", downloadConfig);

    // Справочник подрядчиков - поиск
    const directorySearch = document.getElementById("directory-search");
    if (directorySearch) directorySearch.addEventListener("input", function () {
      state.directorySearch = directorySearch.value;
      applyContractorDirectoryFilter();
    });

    // Справочник подрядчиков - фильтр
    const directoryFilter = document.getElementById("directory-filter");
    if (directoryFilter) directoryFilter.addEventListener("change", function () {
      state.directoryFilter = directoryFilter.value;
      applyContractorDirectoryFilter();
    });

    // Справочник подрядчиков - сохранить
    document.querySelectorAll("[data-save-contractor]").forEach(function (node) {
      node.addEventListener("click", function () {
        const sourceName = node.getAttribute("data-save-contractor");
        const input = Array.from(document.querySelectorAll("[data-contractor-input]")).find(function (entry) {
          return entry.getAttribute("data-contractor-input") === sourceName;
        });
        saveContractorMapping(sourceName, input ? input.value : "");
      });
    });

    // Справочник подрядчиков - канонический
    document.querySelectorAll("[data-canonical-contractor]").forEach(function (node) {
      node.addEventListener("click", function () {
        saveContractorMapping(node.getAttribute("data-canonical-contractor"), node.getAttribute("data-canonical-contractor"));
      });
    });

    // Справочник подрядчиков - удалить
    document.querySelectorAll("[data-remove-contractor]").forEach(function (node) {
      node.addEventListener("click", function () {
        removeContractorMapping(node.getAttribute("data-remove-contractor"));
      });
    });

    // Регламенты - обновить
    document.getElementById("load-regulations")?.addEventListener("click", function () { loadRegulations(false); });

    // Регламенты - применить источник
    document.getElementById("apply-regulations-source")?.addEventListener("click", applyRegulationsSource);

    // Справочник BOQ - загрузить
    document.getElementById("load-aggregation")?.addEventListener("click", function () { loadAggregation(false); });

    // Справочник BOQ - поиск
    const aggregationSearch = document.getElementById("aggregation-search");
    if (aggregationSearch) {
      aggregationSearch.addEventListener("input", function () {
        state.aggregationSearch = aggregationSearch.value;
        window.clearTimeout(aggregationSearchTimer);
        aggregationSearchTimer = window.setTimeout(function () {
          renderContent();
          const nextSearch = document.getElementById("aggregation-search");
