          if (nextSearch) {
            nextSearch.focus();
            nextSearch.setSelectionRange(nextSearch.value.length, nextSearch.value.length);
          }
        }, 150);
      });
    }

    document.getElementById("clear-aggregation-search")?.addEventListener("click", function () {
      state.aggregationSearch = "";
      renderContent();
      const nextSearch = document.getElementById("aggregation-search");
      if (nextSearch) nextSearch.focus();
    });

    // Справочник BOQ - редактирование коэффициентов
    document.querySelectorAll(".aggregation-coefficient-edit").forEach(function (buttonNode) {
      buttonNode.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        activateCoefficientEditor(buttonNode, "er");
      });
    });

    document.querySelectorAll(".aggregation-group-coefficient-edit").forEach(function (buttonNode) {
      buttonNode.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        activateCoefficientEditor(buttonNode, "group");
      });
    });

    // Административные настройки - применить
    document.getElementById("apply-settings")?.addEventListener("click", applySettings);

    // Административные настройки - проверить конфигуратор
    document.getElementById("check-parser-config")?.addEventListener("click", function () { checkParserConfig(false); });

    // Административные настройки - применить источники
    document.getElementById("apply-source-settings")?.addEventListener("click", applySourceSettings);

    // Скачать config
    document.getElementById("admin-download")?.addEventListener("click", downloadConfig);

    // Скачать JSON коэффициентов
    document.getElementById("download-parser-config")?.addEventListener("click", downloadParserConfig);

    // Открыть справочник подрядчиков
    document.getElementById("open-contractor-directory")?.addEventListener("click", function () {
      state.active = "contractor-directory";
      renderNav();
      renderContent();
      document.getElementById("main-scroll").scrollTop = 0;
    });

    // ===== СОБЫТИЯ ДЛЯ РАЗДЕЛА РАСЦЕНОК =====
    // Toggle для дерева расценок
    contentRoot.addEventListener("click", function(e) {
      const header = e.target.closest("[data-toggle]");
      if (header && header.closest("#content")) {
        const target = header.getAttribute("data-toggle");
        const children = document.querySelector('[data-children="' + target + '"]');
        const toggle = header.querySelector(".toggle");
        if (children) {
          const isHidden = children.style.display === "none";
          children.style.display = isHidden ? "" : "none";
          if (toggle) {
            toggle.innerHTML = isHidden ? icon("chevronDown") : icon("chevronRight");
          }
          const parts = target.split('-');
          const level = parts[0];
          if (level === 'contractor') {
            state.pricing.expanded.contractors[target] = isHidden;
          } else if (level === 'contract') {
            state.pricing.expanded.contracts[target] = isHidden;
          } else if (level === 'rdc') {
            state.pricing.expanded.rdcs[target] = isHidden;
          }
        }
      }
    });

    // Свернуть все
    document.getElementById("collapse-all")?.addEventListener("click", function() {
      document.querySelectorAll('.node-children').forEach(function(el) {
        el.style.display = 'none';
      });
      document.querySelectorAll('.node-header .toggle').forEach(function(el) {
        el.innerHTML = icon("chevronRight");
      });
      state.pricing.expanded = { contractors: {}, contracts: {}, rdcs: {} };
      showToast("Все свернуто", "Кликните на заголовок для раскрытия.");
    });

    // Поиск по расценкам
    let rateSearchTimer = null;
    const rateSearchInput = document.getElementById("rate-search");
    if (rateSearchInput) {
      rateSearchInput.addEventListener("input", function() {
        clearTimeout(rateSearchTimer);
        rateSearchTimer = setTimeout(function() {
          state.pricing.rateSearchInput = rateSearchInput.value;
          renderContent();
          setTimeout(function() {
            const newInput = document.getElementById("rate-search");
            if (newInput) { newInput.focus(); newInput.setSelectionRange(newInput.value.length, newInput.value.length); }
          }, 50);
        }, 200);
      });
    }

    document.getElementById("clear-rate-search")?.addEventListener("click", function() {
      state.pricing.rateSearchInput = "";
      renderContent();
      setTimeout(function() {
        const input = document.getElementById("rate-search");
        if (input) { input.focus(); }
      }, 50);
    });

    // Чекбоксы для добавления в сравнение
    contentRoot.addEventListener("change", function(e) {
      const checkbox = e.target.closest("[data-rate-check]");
      if (checkbox && checkbox.closest("#content")) {
        const rateCode = checkbox.getAttribute("data-rate-check");
        const contractor = checkbox.getAttribute("data-contractor");
        const contract = checkbox.getAttribute("data-contract");
        const rdc = checkbox.getAttribute("data-rdc");

        if (checkbox.checked) {
          if (!state.pricing.comparison.selectedRates.includes(rateCode)) {
            state.pricing.comparison.selectedRates.push(rateCode);
          }
          if (contractor) {
            const exists = state.pricing.comparison.selectedContractors.some(function(entry) {
              return entry.name === contractor && entry.contract === contract && entry.priceCalculation === rdc;
            });
            if (!exists) {
              state.pricing.comparison.selectedContractors.push({
                name: contractor,
                contract: contract,
                priceCalculation: rdc
              });
              state.configDirty = true;
            }
          }
        } else {
          state.pricing.comparison.selectedContractors = state.pricing.comparison.selectedContractors.filter(function(entry) {
            return !(entry.name === contractor && entry.contract === contract && entry.priceCalculation === rdc);
          });
          if (!state.pricing.comparison.selectedContractors.length) {
            state.pricing.comparison.selectedRates = state.pricing.comparison.selectedRates.filter(function(r) { return r !== rateCode; });
          }
          state.configDirty = true;
        }
        renderContent();
      }
    });

    // Управление составом сравнения без дополнительных фильтров
    contentRoot.addEventListener("click", function(e) {
      const primaryRemove = e.target.closest("[data-remove-primary-rate]");
      if (primaryRemove && primaryRemove.closest("#content")) {
        const rate = primaryRemove.getAttribute("data-remove-primary-rate");
        state.pricing.comparison.selectedRates = state.pricing.comparison.selectedRates.filter(function(item) { return item !== rate; });
        state.configDirty = true;
        renderContent();
        showToast("Основная расценка удалена", "Сравнение автоматически перестроено.");
        return;
      }

      const removeBtn = e.target.closest("[data-remove-contractor]");
      if (removeBtn && removeBtn.closest("#content")) {
        const name = removeBtn.getAttribute("data-remove-contractor");
        const contract = removeBtn.getAttribute("data-remove-contract");
        const rdc = removeBtn.getAttribute("data-remove-rdc");
        state.pricing.comparison.selectedContractors = state.pricing.comparison.selectedContractors.filter(function(entry) {
          return !(entry.name === name && entry.contract === contract && entry.priceCalculation === rdc);
        });
        state.configDirty = true;
        renderContent();
      }

      const removeRateBtn = e.target.closest("[data-remove-rate]");
      if (removeRateBtn && removeRateBtn.closest("#content")) {
        const rate = removeRateBtn.getAttribute("data-remove-rate");
        state.pricing.comparison.selectedRates = state.pricing.comparison.selectedRates.filter(function(r) { return r !== rate; });
        state.configDirty = true;
        renderContent();
      }
    });

    // Изменение договора/РДЦ в сравнении
    contentRoot.addEventListener("change", function(e) {
      const select = e.target.closest("[data-comparison-contract]");
      if (select && select.closest("#content")) {
        const name = select.getAttribute("data-comparison-contract");
        const entry = state.pricing.comparison.selectedContractors.find(function(e) { return e.name === name; });
        if (entry) {
          entry.contract = select.value;
          const rdcs = getContractorRDC(name, entry.contract);
          if (rdcs.length && !rdcs.includes(entry.priceCalculation)) {
            entry.priceCalculation = rdcs[0];
          }
          state.configDirty = true;
          renderContent();
        }
      }

      const rdcSelect = e.target.closest("[data-comparison-rdc]");
      if (rdcSelect && rdcSelect.closest("#content")) {
        const name = rdcSelect.getAttribute("data-comparison-rdc");
        const entry = state.pricing.comparison.selectedContractors.find(function(e) { return e.name === name; });
        if (entry) {
          entry.priceCalculation = rdcSelect.value;
          state.configDirty = true;
          renderContent();
        }
      }
    });

    // Изменение % косвенных
    contentRoot.addEventListener("change", function(e) {
      const input = e.target.closest(".indirect-edit input");
      if (input && input.closest("#content")) {
        const val = parseFloat(input.value);
        if (!isNaN(val) && val >= 0 && val <= 100) {
          const contractor = input.getAttribute("data-indirect-contractor");
          const contract = input.getAttribute("data-contract");
          const rdc = input.getAttribute("data-rdc");
          const runtime = state.pricing.data[contractor] && state.pricing.data[contractor].contracts[contract] && state.pricing.data[contractor].contracts[contract].priceCalculations[rdc];
          const binding = state.config.pricingBindings && state.config.pricingBindings[contractor] && state.config.pricingBindings[contractor][contract] && state.config.pricingBindings[contractor][contract][rdc];
          if (runtime) {
            runtime.indirectPercent = val;
            Object.keys(runtime.rates || {}).forEach(function(code) { runtime.rates[code].totalPrice = runtime.rates[code].basePrice * (1 + val / 100); });
          }
          if (binding) binding.indirectPercent = val;
          state.configDirty = true;
          showToast("Обновлено", "Новый % косвенных: " + val + "%");
          renderContent();
        }
      }
    });

    // Изменение URL источника
    contentRoot.addEventListener("change", function(e) {
      const input = e.target.closest("[data-source-url]");
      if (input && input.closest("#content")) {
        const contractor = input.getAttribute("data-source-url");
        const contract = input.getAttribute("data-contract");
        const rdc = input.getAttribute("data-rdc");
        const url = input.value.trim();
        if (contractor && contract && rdc) {
          if (state.pricing.data[contractor] &&
              state.pricing.data[contractor].contracts[contract] &&
              state.pricing.data[contractor].contracts[contract].priceCalculations[rdc]) {
            state.pricing.data[contractor].contracts[contract].priceCalculations[rdc].sourceUrl = url;
            const binding = state.config.pricingBindings && state.config.pricingBindings[contractor] && state.config.pricingBindings[contractor][contract] && state.config.pricingBindings[contractor][contract][rdc];
            if (binding) binding.sourceUrl = url;
            state.configDirty = true;
            showToast("URL обновлён", "Путь к файлу изменён.");
          }
        }
      }
    });

    contentRoot.addEventListener("change", function(e) {
      const input = e.target.closest("[data-source-sheet]");
      if (!input) return;
      const contractor = input.getAttribute("data-source-sheet");
      const contract = input.getAttribute("data-contract");
      const rdc = input.getAttribute("data-rdc");

      startProcess(url, "Проверка файла");
      try {
        if (!window.XLSX) throw new Error("Библиотека чтения Excel не загрузилась");
        updateProcess("Чтение данных", 35, 0, "Читаем структуру Excel без загрузки расценок");
        const workbook = XLSX.read(await fetchWorkbookBuffer(url), { type: "array", bookSheets: true });
        const names = workbook.SheetNames || [];

          : "Вкладка «" + selectedSheet + "» отсутствует. Найдены вкладки: " + names.join(", ");
        finishProcess(selectedExists ? "success" : "warning", "Завершено", names.length, state.pricing.addForm.fileCheckMessage);

        state.pricing.addForm.fileCheckStatus = "error";
        state.pricing.addForm.fileCheckMessage = error.message || "Не удалось проверить Excel-файл";

        showToast("Ошибка проверки файла", state.pricing.addForm.fileCheckMessage);

    document.getElementById("add-pricing-source")?.addEventListener("click", async function() {
      syncPricingAddForm();
      const contractor = String(state.pricing.addForm.contractor || "").trim();
      const contract = String(state.pricing.addForm.contract || "").trim();
      const rdc = String(state.pricing.addForm.rdc || "").trim();
      const sourceUrl = String(state.pricing.addForm.sourceUrl || "").trim();
      const sheetName = String(state.pricing.addForm.sheetName || "").trim();
      const colCode = String(state.pricing.addForm.colCode || "A").trim() || "A";
      const colName = String(state.pricing.addForm.colName || "B").trim() || "B";
      const colUnit = String(state.pricing.addForm.colUnit || "C").trim() || "C";
      const colCurrency = String(state.pricing.addForm.colCurrency || "D").trim() || "D";
      const colBasePrice = String(state.pricing.addForm.colBasePrice || "E").trim() || "E";
      const indirectPercent = parseFloat(state.pricing.addForm.indirectPercent) || 0;

      if (!contractor || !contract || !rdc || !sourceUrl || !sheetName) {
        showToast("Ошибка", "Заполните все обязательные поля (контрагент, договор, РДЦ, URL, вкладка)");
        return;
      }
      const kfoContracts = getKfoContracts(contractor);
      if (state.kfo.status !== "active" || kfoContracts.indexOf(contract) < 0) {
        showToast("Договор недоступен", "Сначала загрузите БД КФО и выберите договор выбранного подрядчика из списка.");
        return;
      }
      const columns = {
        code: colCode.toUpperCase(), name: colName.toUpperCase(), unit: colUnit.toUpperCase(),
        currency: colCurrency.toUpperCase(), basePrice: colBasePrice.toUpperCase()
      };
      startProcess(sourceUrl, "Проверка файла");
      try {
        updateProcess("Чтение данных", 30, 0, "Читаем только вкладку «" + sheetName + "»");
        const buffer = await fetchWorkbookBuffer(sourceUrl);
        updateProcess("Загрузка расценок", 65, 0, "Проверяем структуру выбранной вкладки");
        const rates = parsePricingWorkbook(buffer, columns, sheetName);
        if (!Object.keys(rates).length) throw new Error("Во вкладке «" + sheetName + "» не найдено ни одной расценки по указанным колонкам");
        const multiplier = 1 + indirectPercent / 100;
        Object.keys(rates).forEach(function(code) { rates[code].totalPrice = rates[code].basePrice * multiplier; });

        state.config.pricingBindings = state.config.pricingBindings || {};
        state.config.pricingBindings[contractor] = state.config.pricingBindings[contractor] || {};
        state.config.pricingBindings[contractor][contract] = state.config.pricingBindings[contractor][contract] || {};
        state.config.pricingBindings[contractor][contract][rdc] = {
          sourceUrl: sourceUrl, sheetName: sheetName, indirectPercent: indirectPercent, columns: columns
        };
        state.pricing.data[contractor] = state.pricing.data[contractor] || { contracts: {} };
        state.pricing.data[contractor].contracts[contract] = state.pricing.data[contractor].contracts[contract] || { priceCalculations: {} };
        state.pricing.data[contractor].contracts[contract].priceCalculations[rdc] = {
          sourceUrl: sourceUrl, sheetName: sheetName, indirectPercent: indirectPercent, rates: rates, columns: columns
        };
        state.pricing.status = "active";
        state.configDirty = true;
        finishProcess("success", "Завершено", Object.keys(rates).length, "Источник расценок загружен из вкладки «" + sheetName + "»");
        renderContent();
        showToast("Источник добавлен", "Расценки загружены: " + Object.keys(rates).length + " позиций.");

        const message = error.message || "Не удалось загрузить источник расценок";
        state.pricing.addForm.fileCheckStatus = "error";
        state.pricing.addForm.fileCheckMessage = message;
        finishProcess("error", "Загрузка расценок", 0, message);
        renderContent();
        showToast("Ошибка загрузки", message);
      }
    });

    document.getElementById("refresh-pricing")?.addEventListener("click", function() {

  function saveContractorMapping(sourceName, canonicalName) {
    if (!state.editMode) return;
    sourceName = String(sourceName || "").trim();
    canonicalName = String(canonicalName || "").trim();
    if (!sourceName || !canonicalName) {
      showToast("Наименование не указано", "Выберите существующего канонического подрядчика или введите новое наименование.");
      return;
    }
    const directory = getContractorDirectory();
    const sourceKey = normalizeParserLabel(sourceName);
    const canonicalKey = normalizeParserLabel(canonicalName);
    const canonicalExists = directory.entries.some(function (entry) {
      return normalizeParserLabel(entry.sourceName) === canonicalKey && normalizeParserLabel(entry.canonicalName) === canonicalKey;
    });
    if (!canonicalExists) directory.entries.push({ sourceName: canonicalName, canonicalName: canonicalName, status: "canonical" });

    const existing = directory.entries.find(function (entry) {
      return normalizeParserLabel(entry.sourceName) === sourceKey;
    });
    if (existing && existing.status === "canonical" && sourceKey !== canonicalKey) {
      directory.entries.forEach(function (entry) {
        if (normalizeParserLabel(entry.canonicalName) === sourceKey) {
          entry.canonicalName = canonicalName;
          entry.status = normalizeParserLabel(entry.sourceName) === canonicalKey ? "canonical" : "alias";
        }
      });
    }
    if (existing) {
      existing.sourceName = sourceName;
      existing.canonicalName = canonicalName;
      existing.status = sourceKey === canonicalKey ? "canonical" : "alias";
    } else {
      directory.entries.push({ sourceName: sourceName, canonicalName: canonicalName, status: sourceKey === canonicalKey ? "canonical" : "alias" });
    }
    state.config.contractorDirectory = normalizeContractorDirectory(directory);
    state.configDirty = true;
    state.kfo.contractors = (function() {
      const map = new Map();
      const groups = (function() {
        const merged = new Map();
        const directory = contractorDirectoryIndex();
        (state.kfo.groups || []).forEach(function (entry) {
          const canonicalName = canonicalContractorName(entry.contractor);
          const key = [normalizeParserLabel(canonicalName), normalizeParserLabel(entry.kqCode), normalizeParserLabel(entry.unit), entry.level || "", entry.mode || ""].join("||");
          let target = merged.get(key);
          if (!target) {
            target = Object.assign({}, entry, {
              contractor: canonicalName,
              rows: 0, regulationRows: 0,
              actualSmr: 0, acceptedSk: 0, acceptedId: 0,
              evaluatedVolume: null,
              rawContractors: []
            });
            merged.set(key, target);
          }
          target.rows += Number(entry.rows) || 0;
          target.regulationRows += Number(entry.regulationRows) || 0;
          target.actualSmr += Number(entry.actualSmr) || 0;
          target.acceptedSk += Number(entry.acceptedSk) || 0;
          target.acceptedId += Number(entry.acceptedId) || 0;
          if (entry.evaluatedVolume != null) target.evaluatedVolume = (target.evaluatedVolume || 0) + (Number(entry.evaluatedVolume) || 0);
          if (target.rawContractors.indexOf(entry.contractor) < 0) target.rawContractors.push(entry.contractor);
        });
        return Array.from(merged.values());
      })();
      groups.forEach(function (group) {
        const key = normalizeParserLabel(group.contractor);
        let entry = map.get(key);
        if (!entry) {
          entry = {
            name: group.contractor,
            rows: 0,
            workTypeSet: new Set(),
            unitSet: new Set(),
            regulationRows: 0,
            regulatedBase: 0
          };
          map.set(key, entry);
        }
        entry.rows += group.rows;
        entry.workTypeSet.add([normalizeParserLabel(group.kqCode || group.kqName || group.erName), group.level || ""].join("||"));
        entry.unitSet.add(group.unit);
        if (group.mode === "with-regulations") {
          entry.regulationRows += group.regulationRows;
          entry.regulatedBase += group.rows;
        }
      });
      return Array.from(map.values()).map(function (entry) {
        return {
          name: entry.name,
          rows: entry.rows,
          workTypes: entry.workTypeSet.size,
          units: entry.unitSet.size,
          regulationCoverage: entry.regulatedBase ? entry.regulationRows / entry.regulatedBase * 100 : null
        };
      }).sort(function (a, b) { return a.name.localeCompare(b.name, "ru"); });
    })();
    applyConfigToChrome();
    renderContent();
    showToast("Подрядчик акцептован", sourceName === canonicalName ? "Наименование отмечено как каноническое." : sourceName + " объединён с " + canonicalName + ".");
  }

          };
          map.set(key, entry);
        }

        entry.unitSet.add(group.unit);
        if (group.mode === "with-regulations") {

        };

    })();
    applyConfigToChrome();
    renderContent();
    showToast("Соответствие удалено", sourceName + " снова требует акцепта при наличии в БД КФО.");
  }

    state.config.dataSources = getKfoSources();

  function updateKfoSource(index, field, value, quiet) {
    const sources = ensureEditableSources();
    if (!sources[index]) return;
    if (field === "enabled") sources[index][field] = value === "true";
    else if (field === "headerSearchRows") sources[index][field] = Math.max(1, Math.min(Number(value) || 50, 500));
    else sources[index][field] = String(value || "").trim();
    if (field === "url") {
      state.sourceConnections[sources[index].id] = {
        status: "inactive",
        checkedAt: null,
        message: "Изменённая ссылка ещё не проверена"
      };
      if (!quiet && sources[index].url) {
        checkKfoSourceConnection(sources[index]).then(function() { renderContent(); });
      }
    }
    state.configDirty = true;
    applyConfigToChrome();
    if (!quiet && (field === "enabled" || field === "kqLevel")) renderContent();
  }

  function updateKfoColumn(index, key, value) {
    const sources = ensureEditableSources();
    if (!sources[index]) return;
    sources[index].columns[key] = String(value || "").trim().toUpperCase();
    state.configDirty = true;
    applyConfigToChrome();

    const acceptedSk = parseKfoNumber(document.getElementById("regulations-default-sk").value, 0.38);

  function downloadParserConfig() {
    const parserConfig = state.aggregation.parserConfig;
    if (!parserConfig) return;
    const clean = JSON.parse(JSON.stringify(parserConfig, function (key, value) {
      return key.charAt(0) === "_" ? undefined : value;
    }));
    const blob = new Blob([JSON.stringify(clean, null, 2) + "\n"], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "parser-config.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    state.aggregation.parserDirty = false;
    showToast("JSON сформирован", "Замените parser-config.json в GitHub или SharePoint.");
    renderContent();
  }

  function activateCoefficientEditor(buttonNode, scope) {
    if (!buttonNode || !buttonNode.parentNode) return;
    const levelName = buttonNode.getAttribute("data-coefficient-level");
    const keyAttribute = scope === "er" ? "data-er-code" : "data-group-code";
    const key = buttonNode.getAttribute(keyAttribute);
    const currentValue = buttonNode.getAttribute("data-current-value") || "";
    const input = document.createElement("input");
    let cancelled = false;
    let finished = false;

    input.type = "number";
    input.step = "any";
    input.className = "input aggregation-coefficient-input";
    input.style.width = scope === "group" ? "150px" : "100px";
    input.value = currentValue;
    input.placeholder = buttonNode.getAttribute("data-placeholder") || currentValue;
    input.setAttribute("aria-label", buttonNode.getAttribute("aria-label") || "Coefficient");

    function finish(save) {
      if (finished) return;
      finished = true;
      const normalizedValue = input.value.trim().replace(",", ".");
      if (save && normalizedValue !== "" && Number.isFinite(Number(normalizedValue))) {
        const saved = setParserCoefficientCorrection(levelName, key, normalizedValue, scope);
        if (!saved) {
          if (input.parentNode) input.parentNode.replaceChild(buttonNode, input);
          return;
        }
        buttonNode.setAttribute("data-current-value", normalizedValue);
        if (scope === "kfo") {
          buttonNode.innerHTML = "<strong>" + escapeHtml(key) + "</strong><small>" + escapeHtml(formatNumber(Number(normalizedValue), 3)) + "</small>";
        } else if (scope === "group") {
          buttonNode.textContent = "Коэф. " + levelName.toUpperCase() + ": " + normalizedValue;
        } else {
          buttonNode.innerHTML = "<strong>" + escapeHtml(normalizedValue) + "</strong> <span class=\"badge warning\">JSON</span>";
        }
      } else if (save && normalizedValue !== "") {
        showToast("Коэффициент не сохранён", "Введите корректное числовое значение.");
      }
      if (input.parentNode) input.parentNode.replaceChild(buttonNode, input);
    }

    input.addEventListener("click", function (event) { event.stopPropagation(); });
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        input.blur();
      } else if (event.key === "Escape") {
        event.preventDefault();
        cancelled = true;
        finish(false);
      }
    });
    input.addEventListener("blur", function () { finish(!cancelled); });
    buttonNode.parentNode.replaceChild(input, buttonNode);
    input.focus();
    input.select();
  }

  function setParserCoefficientCorrection(levelName, key, rawValue, scope) {
    const parserConfig = state.aggregation.parserConfig;
    const normalizedValue = String(rawValue == null ? "" : rawValue).trim().replace(",", ".");
    const value = Number(normalizedValue);
    if (!parserConfig || !levelName || !key || !normalizedValue || !Number.isFinite(value)) {
      showToast("Коэффициент не сохранён", "Введите корректное числовое значение.");
      return false;
    }
    const logic = scope === "kfo"
      ? (parserConfig.kfoLogic = parserConfig.kfoLogic || {})
      : (parserConfig.aggregationLogic = parserConfig.aggregationLogic || {});
    const corrections = logic.coefficientCorrections = logic.coefficientCorrections || {};
    if (scope === "er") {
      const byEr = corrections.byErCode = corrections.byErCode || {};
      let existing = byEr[key];
      if (typeof existing === "number") existing = { kq2: existing };
      if (!existing || typeof existing !== "object") existing = {};
      existing[levelName] = value;
      byEr[key] = existing;
    } else {
      const mapName = "by" + levelName.charAt(0).toUpperCase() + levelName.slice(1) + "Code";
      corrections[mapName] = corrections[mapName] || {};
      corrections[mapName][key] = value;
    }
    coefficientCache.clear();
    state.aggregation.parserDirty = true;
    const downloadButton = document.getElementById("download-parser-config");
    if (downloadButton) downloadButton.classList.add("btn-primary");
    showToast("Коэффициент изменён", key + ": " + value + ". Скачайте обновлённый JSON.");
    return true;
  }

  // =====================================================================
  // 22. СИСТЕМНЫЕ ФУНКЦИИ
  // =====================================================================
  function setConfigStatus(type, message) {
    const node = document.getElementById("config-status");
    node.className = "status-chip edit-only " + (type || "");
    node.innerHTML = '<span class="status-dot"></span><span>' + escapeHtml(message) + '</span>';
  }

  function applyConfigToChrome() {
    const cfg = state.config || DEFAULT_CONFIG;
    document.getElementById("app-title").textContent = cfg.title || DEFAULT_CONFIG.title;
    document.title = cfg.title || DEFAULT_CONFIG.title;
    document.getElementById("version-label").textContent = "Версия " + (cfg.version || DEFAULT_CONFIG.version);
    document.getElementById("footer-status").textContent = state.configDirty ? "Есть несохранённые изменения конфигурации" : "Изменения конфигурации отсутствуют";
  }

  function setEditMode(enabled, quiet) {
    const shouldDownloadConfig = state.editMode && !enabled && state.configDirty;
    state.editMode = Boolean(enabled);
    document.body.classList.toggle("edit-mode", state.editMode);
    document.getElementById("edit-mode").checked = state.editMode;

    renderNav();
    renderContent();

    if (shouldDownloadConfig) {
      downloadConfig();
      if (!quiet) showToast("Режим просмотра включён", "Изменённый config.json сохранён в загрузках браузера для самостоятельной публикации.");
    } else if (!quiet) {
      showToast(state.editMode ? "Режим редактирования включён" : "Режим просмотра включён",
        state.editMode ? "Доступны элементы настройки конфигурации." : "Поля настроек защищены от изменений.");
    }
  }

  function downloadConfig() {
    const output = Object.assign({}, state.config, {
      editMode: false,
      dataSources: getKfoSources(),
      calculation: { defaultKqLevel: state.kqLevel, defaultMode: "with-regulations" },
      pricingBindings: state.config.pricingBindings || {}
    });
    const blob = new Blob([JSON.stringify(output, null, 2) + "\n"], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "config.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    state.configDirty = false;
    applyConfigToChrome();
    showToast("config.json сформирован", "Замените им файл в GitHub или SharePoint.");
  }

  function showToast(title, note) {
    const region = document.getElementById("toast-region");
    const node = document.createElement("div");
    node.className = "toast";
    node.innerHTML = ICONS.check + '<div><div class="toast-title">' + escapeHtml(title) + '</div><div class="toast-note">' + escapeHtml(note || "") + '</div></div>';
    region.appendChild(node);
    window.setTimeout(function () { node.remove(); }, 3800);
  }

  // =====================================================================
  // 23. ИНИЦИАЛИЗАЦИЯ
  // =====================================================================
  document.getElementById("nav-list").addEventListener("click", function(event) {
    const buttonNode = event.target.closest("[data-section]");
    if (!buttonNode) return;
    state.active = buttonNode.getAttribute("data-section");
    renderNav();
    renderContent();
    document.getElementById("main-scroll").scrollTop = 0;
  });

  document.getElementById("edit-mode").addEventListener("change", function (event) {
    const enabled = event.target.checked;
    setEditMode(enabled, false);
  });

  document.getElementById("download-config").addEventListener("click", downloadConfig);

  decorateStaticIcons(document);
  renderNav();
  renderContent();

  if (state.selectedContractors.length === 0) {
    state.selectedContractors = ["__ALL__"];
  }

  loadConfig(false);
})();
</script>
</body>
</html>
