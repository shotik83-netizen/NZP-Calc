<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#289672" />
  <title>Отчёт по незавершённому строительству (НЗП)</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f8faf9;
      --foreground: #17201c;
      --card: #ffffff;
      --card-foreground: #17201c;
      --primary: #289672;
      --primary-strong: #1f7a5d;
      --primary-soft: #e8f5f0;
      --primary-faint: #f4fbf8;
      --muted: #f1f4f3;
      --muted-foreground: #68736e;
      --accent: #e8eeeb;
      --border: #dce4e0;
      --danger: #b42318;
      --danger-soft: #fff0ee;
      --warning: #9a6700;
      --warning-soft: #fff8e6;
      --shadow: 0 8px 24px rgba(23, 49, 39, 0.06);
      --radius: 9px;
      font-family: "Segoe UI", Inter, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); }
    body { min-width: 320px; overflow: hidden; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(40, 150, 114, .22); outline-offset: 2px; }
    svg { display: block; }

    .app-shell { width: 100%; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; display: grid; grid-template-rows: 56px minmax(0, 1fr) 48px; }

    .app-header {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 0 20px; background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--border); box-shadow: 0 2px 10px rgba(27, 53, 43, .04);
      backdrop-filter: blur(10px);
    }
    .brand { min-width: 0; display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; color: white; background: var(--primary); border-radius: 9px; box-shadow: 0 4px 10px rgba(40, 150, 114, .22); }
    .brand-copy { min-width: 0; }
    .brand-title { margin: 0; font-size: 17px; line-height: 1.2; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-subtitle { display: none; color: var(--muted-foreground); font-size: 11px; margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    .status-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 10px; color: var(--muted-foreground); background: var(--muted); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; white-space: nowrap; }
    .status-chip.ok { color: var(--primary-strong); background: var(--primary-soft); border-color: rgba(40, 150, 114, .24); }
    .status-chip.error { color: var(--danger); background: var(--danger-soft); border-color: rgba(180, 35, 24, .2); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .workspace { min-height: 0; display: grid; grid-template-columns: 256px minmax(0, 1fr); }
    .sidebar { min-width: 0; overflow-y: auto; background: #f5f8f6; border-right: 1px solid var(--border); }
    .sidebar-label { margin: 18px 14px 8px; color: var(--muted-foreground); font-size: 10px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
    .nav-list { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 16px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 9px 11px; color: #34423c; background: transparent; border: 0; border-radius: 7px; text-align: left; font-size: 13px; font-weight: 550; transition: background .16s ease, color .16s ease; }
    .nav-item:hover { background: rgba(40, 150, 114, .07); }
    .nav-item.active { color: var(--primary-strong); background: rgba(40, 150, 114, .1); }
    .nav-icon { width: 18px; height: 18px; flex: 0 0 auto; color: var(--primary); }
    .nav-text { line-height: 1.25; }

    .admin-group {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 2px solid var(--border);
    }
    .admin-group .admin-group-label {
      padding: 4px 11px 8px;
      color: var(--muted-foreground);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .admin-group .nav-item {
      opacity: 0.85;
    }
    .admin-group .nav-item:hover {
      opacity: 1;
    }
    .admin-group .nav-item.active {
      opacity: 1;
    }

    .content-scroll { min-width: 0; overflow: auto; }
    .content { width: min(1120px, 100%); margin: 0 auto; padding: 30px 30px 42px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .page-title-row { display: flex; align-items: center; gap: 10px; }
    .page-icon { width: 23px; height: 23px; color: var(--primary); }
    .page-title { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 650; }
    .page-description { max-width: 720px; margin: 6px 0 0 33px; color: var(--muted-foreground); font-size: 13px; line-height: 1.5; }
    .page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .btn { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 12px; color: #34423c; background: var(--card); border: 1px solid var(--border); border-radius: 7px; font-size: 12px; font-weight: 600; transition: background .16s, border-color .16s, color .16s; }
    .btn:hover { background: var(--muted); border-color: #cbd7d1; }
    .btn-primary { color: white; background: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-strong); border-color: var(--primary-strong); }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn:disabled { cursor: not-allowed; opacity: .46; }
    .btn svg { width: 15px; height: 15px; }

    .stack { display: grid; gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(20, 40, 32, .02); }
    .card-header { padding: 18px 18px 0; }
    .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-title { margin: 0; font-size: 14px; font-weight: 650; }
    .card-desc { margin: 5px 0 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }
    .card-body { padding: 16px 18px 18px; }
    .card-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 18px; background: #fbfcfb; border-top: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); }

    .banner { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; color: #44524c; background: var(--primary-faint); border: 1px solid rgba(40, 150, 114, .18); border-radius: 8px; font-size: 12px; line-height: 1.45; }
    .banner svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--primary); margin-top: 1px; }
    .banner.warning { background: var(--warning-soft); border-color: rgba(154, 103, 0, .18); }
    .banner.warning svg { color: var(--warning); }
    .banner-action { margin-left: auto; flex: 0 0 auto; }

    .badge { display: inline-flex; align-items: center; gap: 5px; min-height: 23px; padding: 3px 8px; color: #4c5a54; background: var(--muted); border: 1px solid var(--border); border-radius: 999px; font-size: 10px; font-weight: 650; white-space: nowrap; }
    .badge.green { color: var(--primary-strong); background: var(--primary-soft); border-color: rgba(40, 150, 114, .2); }
    .badge.warning { color: var(--warning); background: var(--warning-soft); border-color: rgba(154, 103, 0, .18); }
    .badge.primary { color: var(--primary-strong); background: var(--primary-soft); border-color: rgba(40, 150, 114, .2); }
    .badge.dev { background: #fff3cd; color: #856404; border-color: #ffc107; }

    .upload-zone { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 190px; padding: 24px; color: var(--muted-foreground); background: #f9fbfa; border: 2px dashed #cbd7d1; border-radius: 9px; text-align: center; transition: border-color .16s, background .16s; }
    .upload-zone:hover, .upload-zone.dragging { background: var(--primary-faint); border-color: var(--primary); }
    .upload-zone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .upload-mark { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 11px; color: var(--primary); background: var(--primary-soft); border-radius: 50%; }
    .upload-mark svg { width: 20px; height: 20px; }
    .upload-title { color: var(--foreground); font-size: 13px; font-weight: 650; }
    .upload-note { max-width: 340px; margin-top: 5px; font-size: 11px; line-height: 1.45; }

    .source-list { display: grid; gap: 8px; }
    .source-row { display: flex; align-items: center; gap: 11px; padding: 11px; background: #fbfcfb; border: 1px solid var(--border); border-radius: 7px; }
    .source-icon { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; color: var(--primary); background: var(--primary-soft); border-radius: 7px; }
    .source-icon svg { width: 16px; height: 16px; }
    .source-copy { min-width: 0; flex: 1; }
    .source-name { overflow: hidden; color: var(--foreground); font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .source-meta { overflow: hidden; margin-top: 2px; color: var(--muted-foreground); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .source-grid { display: grid; gap: 12px; }
    .source-card { overflow: hidden; background: #fbfcfb; border: 1px solid var(--border); border-radius: 8px; }
    .source-overview { min-height: 46px; display: grid; grid-template-columns: minmax(90px, 1fr) auto minmax(190px, auto) auto auto; align-items: center; gap: 14px; padding: 9px 12px; }
    .source-overview-name { min-width: 0; overflow: hidden; color: var(--foreground); font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .source-status-inline { display: inline-flex; align-items: center; gap: 6px; color: var(--danger); font-size: 10px; font-weight: 650; white-space: nowrap; }
    .source-status-inline.active { color: var(--primary-strong); }
    .source-status-dot { width: 7px; height: 7px; flex: 0 0 auto; background: currentColor; border-radius: 50%; }
    .source-overview-metric { min-width: 0; overflow: hidden; color: var(--muted-foreground); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .source-overview-metric strong { color: #44524c; font-weight: 700; font-variant-numeric: tabular-nums; }
    .source-overview-date { color: var(--muted-foreground); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .source-overview-date strong { color: #44524c; font-weight: 650; }
    .source-overview-actions { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .source-open-link { color: var(--primary-strong); font-size: 10px; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .source-open-link:hover { text-decoration: underline; }
    .source-settings { margin: 0 12px 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .settings-section-title { margin: 16px 0 4px; color: var(--foreground); font-size: 12px; font-weight: 650; }
    .settings-section-note { margin: 0; color: var(--muted-foreground); font-size: 10px; line-height: 1.45; }
    .mapping-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .mapping-grid .input { text-transform: uppercase; }
    .result-note { margin: 10px 0 0; color: var(--muted-foreground); font-size: 10px; line-height: 1.45; }

    .coefficient-overview { display: grid; gap: 10px; margin-bottom: 14px; padding: 12px 14px; background: #fbfdfc; border: 1px solid var(--border); border-radius: 8px; }
    .coefficient-overview-title { color: var(--foreground); font-size: 12px; font-weight: 650; }
    .coefficient-overview-note { margin-top: 2px; color: var(--muted-foreground); font-size: 10px; line-height: 1.4; }
    .coefficient-bars { display: grid; gap: 8px; }
    .coefficient-bar-row { display: grid; grid-template-columns: 58px minmax(90px, 1fr) auto; align-items: center; gap: 8px; font-size: 10px; }
    .coefficient-bar-label { color: #44524c; font-weight: 650; }
    .coefficient-bar-track { height: 8px; overflow: hidden; background: var(--muted); border-radius: 999px; }
    .coefficient-bar-fill { height: 100%; min-width: 2px; background: var(--primary); border-radius: inherit; transition: width .18s ease; }
    .coefficient-bar-value { color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .aggregation-coefficient-edit, .aggregation-group-coefficient-edit, .kfo-coefficient-edit { min-height: 28px; padding: 4px 7px; font-variant-numeric: tabular-nums; }
    .aggregation-coefficient-edit:focus-visible, .aggregation-group-coefficient-edit:focus-visible, .kfo-coefficient-edit:focus-visible { outline-offset: 1px; }
    .kq-detail { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 58px; line-height: 1.15; }
    .kq-detail small { color: var(--muted-foreground); font-size: 10px; font-variant-numeric: tabular-nums; }
    .kfo-coefficient-edit { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; line-height: 1.15; }
    .aggregation-coefficient-input { min-height: 30px; padding: 5px 7px; text-align: right; font-variant-numeric: tabular-nums; }
    .kq-detail { display: inline-flex; min-width: 78px; flex-direction: column; align-items: flex-end; gap: 1px; line-height: 1.15; }
    .kq-detail strong { font-size: 11px; }
    .kq-detail small { color: var(--muted-foreground); font-size: 10px; font-variant-numeric: tabular-nums; }

    .form-actions { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
    .form-actions .field { min-width: min(100%, 210px); flex: 1; }

    .empty { min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 28px; color: var(--muted-foreground); background: #fafcfb; border: 1px dashed var(--border); border-radius: 8px; text-align: center; }
    .empty-icon { width: 42px; height: 42px; display: grid; place-items: center; color: var(--muted-foreground); background: var(--muted); border-radius: 50%; }
    .empty-icon svg { width: 19px; height: 19px; }
    .empty-title { color: #3e4b45; font-size: 12px; font-weight: 650; }
    .empty-note { max-width: 420px; font-size: 11px; line-height: 1.45; }

    .metric-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stat { padding: 11px 13px; background: #fafcfb; border: 1px solid var(--border); border-radius: 8px; }
    .stat.highlight { background: var(--primary-faint); border-color: rgba(40, 150, 114, .2); }
    .stat-label { color: var(--muted-foreground); font-size: 11px; }
    .stat-value { margin-top: 4px; color: var(--foreground); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat.highlight .stat-value { color: var(--primary-strong); }
    .stat-note { margin-top: 3px; color: var(--muted-foreground); font-size: 10px; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { padding: 10px 12px; color: var(--muted-foreground); background: #f6f8f7; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 650; letter-spacing: .05em; text-align: left; text-transform: uppercase; white-space: nowrap; }
    td { padding: 11px 12px; border-bottom: 1px solid #e9eeeb; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fbfcfb; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted-foreground); }

    .contractor-list { display: grid; gap: 8px; }
    .contractor-item { overflow: hidden; background: #fbfcfb; border: 1px solid var(--border); border-radius: 8px; }
    .contractor-item[open] { background: white; border-color: rgba(40, 150, 114, .28); box-shadow: 0 2px 10px rgba(27, 53, 43, .04); }
    .contractor-item > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
    .contractor-item > summary::-webkit-details-marker { display: none; }
    .contractor-item > summary::after { content: "›"; color: var(--primary); font-size: 22px; line-height: 1; text-align: center; transition: transform .16s ease; }
    .contractor-item[open] > summary::after { transform: rotate(90deg); }
    .contractor-item > summary:hover { background: var(--primary-faint); }
    .contractor-item > summary:focus-visible { outline: 3px solid rgba(40, 150, 114, .22); outline-offset: -3px; }
    .contractor-name { min-width: 0; color: var(--foreground); font-size: 12px; font-weight: 650; line-height: 1.35; }
    .contractor-metrics { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .metric-inline { display: inline-flex; align-items: center; gap: 4px; min-height: 23px; padding: 3px 8px; color: var(--muted-foreground); background: var(--muted); border-radius: 999px; font-size: 10px; white-space: nowrap; }
    .metric-inline strong { color: #44524c; font-weight: 700; font-variant-numeric: tabular-nums; }
    .contractor-body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .contractor-body .table-wrap { margin-top: 12px; }
    .work-code { min-width: 105px; white-space: nowrap; }
    .work-name { min-width: 220px; }

    .directory-toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) 220px; gap: 10px; margin-bottom: 12px; }
    .directory-source { min-width: 210px; color: var(--foreground); font-weight: 600; }
    .directory-canonical { min-width: 260px; }
    .directory-editor { display: grid; grid-template-columns: minmax(170px, 1fr) auto; align-items: center; gap: 7px; }
    .directory-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .directory-actions .btn { min-height: 30px; padding: 5px 9px; }
    .directory-status { min-width: 120px; }
    .directory-suggestion { display: block; margin-top: 4px; color: var(--muted-foreground); font-size: 10px; }

    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .field { display: grid; gap: 6px; }
    .field-wide { grid-column: 1 / -1; }
    .field label { color: #44524c; font-size: 11px; font-weight: 600; }
    .input { width: 100%; min-height: 36px; padding: 7px 10px; color: var(--foreground); background: white; border: 1px solid var(--border); border-radius: 7px; font-size: 12px; }
    .input:disabled { color: var(--muted-foreground); background: var(--muted); }
    .input-sm { min-height: 28px; padding: 3px 8px; font-size: 11px; }

    .edit-only { display: none !important; }
    body.edit-mode .edit-only { display: inline-flex !important; }
    body.edit-mode .edit-only.block { display: flex !important; }
    body.edit-mode .editable-card { border-color: rgba(40, 150, 114, .32); box-shadow: 0 0 0 2px rgba(40, 150, 114, .05); }

    .error-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 40px 20px;
    }
    .error-screen .error-icon { width: 60px; height: 60px; color: var(--danger); margin-bottom: 16px; }
    .error-screen h2 { font-size: 24px; font-weight: 650; margin: 0 0 12px; }
    .error-screen p { max-width: 560px; color: var(--muted-foreground); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    .error-screen .btn { min-height: 40px; padding: 0 28px; font-size: 14px; }

    .app-footer { position: relative; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 18px; color: var(--muted-foreground); background: rgba(255, 255, 255, .97); border-top: 1px solid var(--border); box-shadow: 0 -3px 14px rgba(27, 53, 43, .04); backdrop-filter: blur(10px); font-size: 11px; }
    .app-footer .status-chip { min-height: 27px; padding: 0 9px; }
    .footer-part { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .footer-center { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .edit-toggle { display: inline-flex; align-items: center; gap: 9px; color: #405048; font-size: 12px; font-weight: 600; user-select: none; cursor: pointer; }
    .edit-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .switch { width: 36px; height: 20px; position: relative; flex: 0 0 auto; background: #cbd5d0; border-radius: 999px; transition: background .18s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: white; border-radius: 50%; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .18s; }
    .edit-toggle input:checked + .switch { background: var(--primary); }
    .edit-toggle input:checked + .switch::after { transform: translateX(16px); }
    .edit-toggle input:focus-visible + .switch { outline: 3px solid rgba(40, 150, 114, .22); outline-offset: 2px; }

    .toast-region { position: fixed; z-index: 100; top: 70px; right: 18px; display: grid; gap: 8px; pointer-events: none; }
    .toast { width: min(360px, calc(100vw - 36px)); display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; color: var(--card-foreground); background: var(--card); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow); animation: toast-in .2s ease-out; pointer-events: auto; }
    .toast svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--primary); }
    .toast-title { font-size: 12px; font-weight: 650; }
    .toast-note { margin-top: 2px; color: var(--muted-foreground); font-size: 10px; line-height: 1.4; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }

    .contractor-selector {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px;
      background: #fafcfb;
      max-height: 200px;
      overflow-y: auto;
    }
    .contractor-selector .select-all-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .contractor-selector .select-all-row label {
      font-weight: 600;
      font-size: 12px;
      color: var(--foreground);
    }
    .contractor-selector .contractor-check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
      cursor: pointer;
    }
    .contractor-selector .contractor-check-item:hover {
      background: var(--primary-faint);
    }
    .contractor-selector .contractor-check-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .contractor-selector .contractor-check-item label {
      cursor: pointer;
      flex: 1;
    }

    .filter-section {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }
    .filter-section .field {
      margin-bottom: 0;
    }
    .filter-section .btn {
      min-height: 40px;
      padding: 0 24px;
      font-size: 13px;
      white-space: nowrap;
    }

    /* ===== РАСЦЕНКИ ===== */
    .pricing-tree { display: grid; gap: 2px; }
    .pricing-node .node-header {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; background: transparent;
      cursor: pointer; user-select: none;
      font-size: 13px; font-weight: 600;
      border-radius: 4px;
      transition: background .1s;
    }
    .pricing-node .node-header:hover { background: var(--primary-faint); }
    .pricing-node .node-header .toggle {
      width: 18px; height: 18px; display: grid; place-items: center;
      color: var(--muted-foreground); transition: transform .16s;
      font-size: 14px;
    }
    .pricing-node .node-header .toggle.open { transform: rotate(90deg); }
    .pricing-node .node-children {
      padding: 2px 0 4px 20px;
    }
    .pricing-node .node-actions { margin-left: auto; display: flex; gap: 4px; }
    .pricing-node .node-actions .btn { min-height: 24px; padding: 2px 8px; font-size: 10px; }

    .pricing-node .node-header.level-0 { font-size: 14px; font-weight: 700; color: var(--foreground); }
    .pricing-node .node-header.level-1 { font-size: 13px; font-weight: 600; color: var(--foreground); padding-left: 12px; }
    .pricing-node .node-header.level-2 { font-size: 12px; font-weight: 600; color: var(--primary-strong); padding-left: 16px; }

    .rate-row {
      display: grid;
      grid-template-columns: 0.4fr 0.5fr 0.9fr 0.5fr 0.6fr 0.6fr 0.5fr auto;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 20px;
      font-size: 11px;
      border-bottom: 1px solid #f0f2f1;
    }
    .rate-row:last-child { border-bottom: none; }
    .rate-row .rate-check { display: flex; align-items: center; justify-content: center; }
    .rate-row .rate-check input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .rate-row .rate-code { font-weight: 600; font-family: monospace; font-size: 11px; }
    .rate-row .rate-name { color: var(--muted-foreground); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rate-row .rate-unit { color: var(--muted-foreground); font-size: 10px; text-align: center; }
    .rate-row .rate-price { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted-foreground); font-size: 11px; }
    .rate-row .rate-total { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; font-size: 11px; }
    .rate-row .rate-currency { color: var(--muted-foreground); font-size: 10px; text-align: center; }
    .rate-row .rate-actions { display: flex; gap: 4px; justify-content: flex-end; }
    .rate-row .rate-actions .btn { min-height: 20px; padding: 0 4px; font-size: 9px; }

    .rate-header {
      display: grid;
      grid-template-columns: 0.4fr 0.5fr 0.9fr 0.5fr 0.6fr 0.6fr 0.5fr auto;
      gap: 6px;
      padding: 4px 8px 4px 20px;
      font-size: 9px;
      font-weight: 650;
      text-transform: uppercase;
      color: var(--muted-foreground);
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .rate-header .h-check { text-align: center; }
    .rate-header .h-code { text-align: left; }
    .rate-header .h-name { text-align: left; }
    .rate-header .h-unit { text-align: center; }
    .rate-header .h-price { text-align: right; }
    .rate-header .h-total { text-align: right; }
    .rate-header .h-currency { text-align: center; }

    .indirect-edit {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 6px; background: var(--primary-faint);
      border-radius: 4px; font-size: 11px;
    }
    .indirect-edit input {
      width: 60px; min-height: 22px; padding: 1px 4px;
      font-size: 11px; text-align: right;
      border: 1px solid var(--border); border-radius: 3px;
      background: white;
    }
    .indirect-edit input:disabled { background: var(--muted); }

    .source-url-edit {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px;
      color: var(--muted-foreground);
    }
    .source-url-edit input {
      width: 300px; min-height: 24px; padding: 1px 6px;
      font-size: 11px;
      border: 1px solid var(--border); border-radius: 3px;
      background: white;
    }
    .source-url-edit input:disabled { background: var(--muted); }

    .add-form {
      background: var(--primary-faint);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .add-form .form-title {
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 12px;
      color: var(--foreground);
    }
    .add-form .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .add-form .form-row .field { margin-bottom: 0; }
    .add-form .form-row .field label { font-size: 10px; font-weight: 600; color: var(--muted-foreground); }
    .add-form .form-row .field input,
    .add-form .form-row .field select { min-height: 30px; font-size: 11px; }
    .add-form .form-row .btn { min-height: 30px; padding: 0 16px; font-size: 11px; }

    .add-form .form-details {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
      gap: 8px;
      align-items: end;
    }
    .add-form .form-details .field { margin-bottom: 0; }
    .add-form .form-details .field label { font-size: 9px; font-weight: 600; color: var(--muted-foreground); }
    .add-form .form-details .field input { min-height: 28px; font-size: 10px; padding: 3px 6px; }

    .rate-search-wrap {
      display: flex; gap: 10px; margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .rate-search-wrap .field { flex: 1; min-width: 200px; margin-bottom: 0; }
    .rate-search-wrap .field label { font-size: 11px; font-weight: 600; color: var(--muted-foreground); }
    .rate-search-wrap .field input { min-height: 32px; font-size: 12px; }
    .rate-search-wrap .badge { font-size: 10px; white-space: nowrap; align-self: flex-end; margin-bottom: 3px; }
    .rate-search-wrap .btn-collapse { min-height: 32px; padding: 0 12px; font-size: 11px; }

    .comparison-section {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      margin-top: 12px;
    }
    .comparison-left {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      max-height: 600px;
      overflow-y: auto;
    }
    .comparison-left .comparison-title {
      font-size: 12px;
      font-weight: 650;
      margin-bottom: 6px;
      color: var(--muted-foreground);
    }
    .comparison-item {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 6px; font-size: 12px;
      cursor: pointer; border-radius: 4px;
    }
    .comparison-item:hover { background: var(--primary-faint); }
    .comparison-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
    .comparison-item .item-code { font-family: monospace; font-weight: 600; font-size: 11px; }
    .comparison-item .item-name { color: var(--muted-foreground); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .comparison-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    .comparison-table {
      width: 100%; border-collapse: collapse; font-size: 11px;
    }
    .comparison-table th {
      padding: 6px 8px; background: #f6f8f7;
      border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: 650;
      text-transform: uppercase; text-align: center;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
    .comparison-table th .sub {
      font-weight: 400; font-size: 9px;
      color: var(--muted-foreground);
      display: block;
    }
    .comparison-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #e9eeeb;
      font-variant-numeric: tabular-nums;
      text-align: center;
      vertical-align: middle;
    }
    .comparison-table tr:last-child td { border-bottom: none; }
    .comparison-table .num { text-align: center; }
    .comparison-table .highlight-diff { color: var(--primary-strong); font-weight: 700; }
    .comparison-table .highlight-negative { color: var(--danger); }
    .comparison-table .rate-code-cell { text-align: left; font-weight: 600; font-family: monospace; font-size: 11px; }
    .comparison-table .rate-name-cell { text-align: left; font-size: 10px; color: var(--muted-foreground); }
    .comparison-table .rate-unit-cell { text-align: center; font-size: 10px; color: var(--muted-foreground); }
    .comparison-table .contractor-header { text-align: center; }

    .search-input-wrap { position: relative; }
    .search-input-wrap .search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: white; border: 1px solid var(--border);
      border-radius: 7px; box-shadow: var(--shadow);
      max-height: 200px; overflow-y: auto; z-index: 10;
      display: none;
    }
    .search-input-wrap .search-results.active { display: block; }
    .search-input-wrap .search-results .result-item {
      padding: 6px 10px; font-size: 12px;
      cursor: pointer; border-bottom: 1px solid #f0f2f1;
    }
    .search-input-wrap .search-results .result-item:hover { background: var(--primary-faint); }
    .search-input-wrap .search-results .result-item:last-child { border-bottom: none; }

    @media (max-width: 900px) {
      .app-shell { grid-template-rows: 56px auto minmax(0, 1fr) 52px; }
      .workspace { display: contents; }
      .sidebar { width: 100%; max-width: 100vw; overflow: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
      .sidebar-label { display: none; }
      .nav-list { width: 100%; max-width: 100vw; overflow-x: auto; flex-direction: row; padding: 7px 10px; flex-wrap: nowrap; }
      .nav-item { width: auto; min-width: max-content; min-height: 38px; padding: 8px 10px; }
      .nav-text { white-space: nowrap; }
      .admin-group { border-top: none; margin-top: 0; padding-top: 0; display: flex; align-items: center; gap: 2px; }
      .admin-group .admin-group-label { display: none; }
      .content-scroll { min-height: 0; }
      .content { padding: 24px 20px 34px; }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .mapping-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .directory-toolbar { grid-template-columns: minmax(180px, 1fr) 200px; }
      .footer-center { display: none; }
      .filter-section {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .filter-section .btn {
        width: 100%;
        justify-content: center;
      }
      .comparison-section { grid-template-columns: 1fr; }
      .field-grid { grid-template-columns: 1fr; }
      .add-form .form-row { grid-template-columns: 1fr 1fr; }
      .add-form .form-details { grid-template-columns: 1fr 1fr 1fr; }
      .rate-row { grid-template-columns: 0.3fr 0.3fr 0.4fr 0.3fr 0.4fr 0.4fr 0.3fr auto; gap: 4px; font-size: 10px; }
      .rate-header { grid-template-columns: 0.3fr 0.3fr 0.4fr 0.3fr 0.4fr 0.4fr 0.3fr auto; gap: 4px; font-size: 8px; }
      .rate-search-wrap { flex-wrap: wrap; }
      .source-url-edit input { width: 180px; }
    }

    @media (max-width: 680px) {
      .app-header { padding: 0 12px; }
      .brand-title { font-size: 14px; }
      .header-actions .btn, body.edit-mode .header-actions .btn { display: none !important; }
      .status-chip { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
      .content { padding: 20px 14px 30px; }
      .page-head { display: grid; }
      .page-actions { justify-content: flex-start; }
      .page-description { margin-left: 0; }
      .banner { flex-wrap: wrap; }
      .banner-action { margin-left: 27px; }
      .grid-2, .grid-3, .field-grid { grid-template-columns: 1fr; }
      .mapping-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .directory-toolbar { grid-template-columns: 1fr; }
      .field-wide { grid-column: auto; }
      .source-overview { grid-template-columns: minmax(60px, 1fr) auto auto auto auto; gap: 6px; padding-inline: 9px; }
      .source-overview-secondary, .source-date-origin { display: none; }
      .metric-strip { grid-template-columns: 1fr; }
      .contractor-item > summary { grid-template-columns: minmax(0, 1fr) 18px; }
      .contractor-metrics { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
      .app-footer { padding: 0 12px; }
      .footer-part:first-child { display: none; }
      .footer-part:last-child { margin-left: auto; }
      .nav-icon { width: 16px; height: 16px; }
      .contractor-selector { max-height: 150px; }
      .add-form .form-row { grid-template-columns: 1fr; }
      .add-form .form-details { grid-template-columns: 1fr; }
      .rate-row { grid-template-columns: 0.3fr 0.3fr 0.4fr auto; gap: 4px; }
      .rate-row .rate-price { display: none; }
      .rate-row .rate-name { display: none; }
      .rate-row .rate-check { display: none; }
      .rate-row .rate-currency { display: none; }
      .rate-header .h-price { display: none; }
      .rate-header .h-name { display: none; }
      .rate-header .h-check { display: none; }
      .rate-header .h-currency { display: none; }
      .rate-header { grid-template-columns: 0.3fr 0.3fr 0.4fr auto; gap: 4px; }
      .comparison-table { font-size: 10px; }
      .comparison-table th, .comparison-table td { padding: 4px 6px; }
      .source-url-edit input { width: 120px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true" data-icon="file-chart"></div>
      <div class="brand-copy">
        <h1 class="brand-title" id="app-title">Отчёт по незавершённому строительству (НЗП)</h1>
        <div class="brand-subtitle">Расчёт и подготовка отчётности</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost edit-only" type="button" id="download-config" data-icon-button="download">Скачать config.json</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-label="Разделы приложения">
      <div class="sidebar-label">Разделы</div>
      <nav class="nav-list" id="nav-list"></nav>
    </aside>
    <main class="content-scroll" id="main-scroll">
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>

  <footer class="app-footer">
    <div class="footer-part"><span id="version-label">Версия 1.6</span></div>
    <div class="footer-center" id="footer-status">Изменения конфигурации отсутствуют</div>
    <div class="footer-part">
      <div class="status-chip edit-only" id="config-status"><span class="status-dot"></span><span>Загрузка конфигурации…</span></div>
      <label class="edit-toggle" for="edit-mode">
        <span>Режим редактирования</span>
        <input id="edit-mode" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
      </label>
    </div>
  </footer>
</div>
<div class="toast-region" id="toast-region" aria-live="polite"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  const numberFormatters = new Map();
  const normalizedLabelCache = new Map();
  const MAX_NORMALIZED_LABEL_CACHE = 10000;

  function formatNumber(value, digits) {
    if (value == null || value === "") return "—";
    const number = Number(value);
    if (!Number.isFinite(number)) return "—";
    const precision = digits == null ? 3 : digits;
    if (!numberFormatters.has(precision)) {
      numberFormatters.set(precision, new Intl.NumberFormat("ru-RU", { maximumFractionDigits: precision }));
    }
    return numberFormatters.get(precision).format(number);
  }

  function formatDateTime(value) {
    const date = value instanceof Date ? value : new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    return new Intl.DateTimeFormat("ru-RU", { dateStyle: "short", timeStyle: "medium" }).format(date);
  }

  function formatDateShort(value) {
    const date = new Date(String(value || "") + "T00:00:00");
    if (Number.isNaN(date.getTime())) return "—";
    return new Intl.DateTimeFormat("ru-RU").format(date);
  }

  function normalizeParserLabel(value) {
    const source = String(value == null ? "" : value);
    if (normalizedLabelCache.has(source)) return normalizedLabelCache.get(source);
    const normalized = source.trim().replace(/\s+/g, " ").toLowerCase();
    if (normalizedLabelCache.size >= MAX_NORMALIZED_LABEL_CACHE) normalizedLabelCache.clear();
    normalizedLabelCache.set(source, normalized);
    return normalized;
  }

  // =====================================================================
  // 6. РАБОТА С КОНФИГУРАЦИЕЙ

  function normalizeKfoSource(source, index) {
    const incoming = typeof source === "string" ? { url: source } : (source || {});
    const normalized = Object.assign({}, DEFAULT_KFO_SOURCE, incoming);
    normalized.id = String(incoming.id || "kfo-" + (index + 1)).replace(/[^a-zA-Z0-9_-]/g, "-");
    normalized.name = String(incoming.name || "БД КФО " + (index + 1));
    normalized.url = String(incoming.url || "").trim();
    normalized.enabled = incoming.enabled !== false;
    normalized.headerSearchRows = Math.max(1, Math.min(Number(incoming.headerSearchRows) || 50, 500));
    normalized.calculationMode = "with-regulations";
    normalized.columns = Object.assign({}, DEFAULT_KFO_COLUMNS, incoming.columns || {});
    ["kq1Code", "kq1Coefficient", "kq2Code", "kq2Coefficient"].forEach(function (field) {
      if (!String(normalized.columns[field] || "").trim()) normalized.columns[field] = DEFAULT_KFO_COLUMNS[field];
    });
    return normalized;
  }

  function getKfoSources() {
    const sources = Array.isArray(state.config && state.config.dataSources) ? state.config.dataSources : [];
    return sources.map(normalizeKfoSource);

  function getRegulationsSource() {
    const fallback = DEFAULT_CONFIG.regulationsSource;
    const cfg = state.config || {};

    source.sheetName = String(source.sheetName || "ДК").trim() || "ДК";
    source.headerSearchRows = Math.max(1, Math.min(Number(source.headerSearchRows) || 30, 500));
    source.enabled = source.enabled !== false;
    return source;
  }

  function normalizeContractorDirectory(directory) {
    const incoming = directory && typeof directory === "object" ? directory : {};
    const seen = new Map();
    (Array.isArray(incoming.entries) ? incoming.entries : []).forEach(function (entry) {
      const sourceName = String(entry && entry.sourceName || "").trim();
      const canonicalName = String(entry && entry.canonicalName || "").trim();
      if (!sourceName || !canonicalName) return;
      const key = normalizeParserLabel(sourceName);
      seen.set(key, { sourceName: sourceName, canonicalName: canonicalName, status: normalizeParserLabel(sourceName) === normalizeParserLabel(canonicalName) ? "canonical" : "alias" });
    });
    return { storage: "shared-config", entries: Array.from(seen.values()).sort(function (a, b) { return a.sourceName.localeCompare(b.sourceName, "ru"); }) };
  }

  function getContractorDirectory() {
    const cfg = state.config || {};
    cfg.contractorDirectory = normalizeContractorDirectory(cfg.contractorDirectory || { entries: [] });
    return cfg.contractorDirectory;
  }

  function contractorDirectoryIndex() {
    const index = new Map();
    getContractorDirectory().entries.forEach(function (entry) { index.set(normalizeParserLabel(entry.sourceName), entry); });
    return index;
  }

  function canonicalContractorName(sourceName) {
    const directory = contractorDirectoryIndex();
    let currentName = String(sourceName || "").trim();
    if (!currentName) return "";

    // Защита от циклических ссылок - отслеживаем все посещенные имена
    const visited = new Set();
    const maxIterations = 10; // Безопасный лимит

    let iterations = 0;
    while (currentName && iterations < maxIterations) {
      iterations++;
      const key = normalizeParserLabel(currentName);

      // Если уже были в этом имени - выходим, чтобы избежать бесконечного цикла
      if (visited.has(key)) {
        return String(sourceName || "").trim();
      }
      visited.add(key);

      const entry = directory.get(key);

      // Если записи нет или каноническое имя совпадает с текущим - это конечная точка
      if (!entry || normalizeParserLabel(entry.canonicalName) === key) {
        return entry ? entry.canonicalName : currentName;
      }

      // Переходим к следующему имени в цепочке
      currentName = entry.canonicalName;
    }

    // Если достигнут лимит итераций - возвращаем исходное имя
    return String(sourceName || "").trim();
  }

  function getCanonicalContractorNames() {
    const names = new Set();
    getContractorDirectory().entries.filter(function (entry) { return entry.status === "canonical"; }).forEach(function (entry) {
      names.add(entry.canonicalName);
    });
    return Array.from(names).sort(function (a, b) { return a.localeCompare(b, "ru"); });
  }

  function contractorDirectoryRows() {
    const rows = new Map();
    (state.kfo.rawContractors || []).forEach(function (entry) {
      rows.set(normalizeParserLabel(entry.name), { sourceName: entry.name, rows: Number(entry.rows) || 0, detected: true });
    });
    getContractorDirectory().entries.forEach(function (entry) {
      const key = normalizeParserLabel(entry.sourceName);
      const row = rows.get(key) || { sourceName: entry.sourceName, rows: 0, detected: false };
      row.entry = entry;
      rows.set(key, row);
    });
    return Array.from(rows.values()).sort(function (a, b) {
      if (Boolean(a.entry) !== Boolean(b.entry)) return a.entry ? 1 : -1;
      return a.sourceName.localeCompare(b.sourceName, "ru");
    });
  }

  function canonicalContractorNames() {
    const names = new Map();
    getContractorDirectory().entries.filter(function (entry) { return entry.status === "canonical"; }).forEach(function (entry) { names.set(normalizeParserLabel(entry.canonicalName), entry.canonicalName); });
    return Array.from(names.values()).sort(function (a, b) { return a.localeCompare(b, "ru"); });
  }

function contractorNameStem(value) {
    // Защита от бесконечного цикла - максимум 3 итерации
    const maxIterations = 3;
    let result = normalizeParserLabel(value);

    for (let i = 0; i < maxIterations; i++) {
        const prev = result;
        result = result
            .replace(/\s*\([^)]*\)\s*$/g, "")
            .replace(/\s*\[[^\]]*\]\s*$/g, "")
            .replace(/[\s._-]*\d+\s*$/g, "")
            .replace(/[^a-zа-яё0-9]+/gi, "");

        // Если результат не изменился - выходим из цикла
        if (result === prev) break;
    }

    return result;
}

  function suggestCanonicalContractor(sourceName) {
    const sourceStem = contractorNameStem(sourceName);
    if (!sourceStem) return "";
    return canonicalContractorNames().find(function (name) { return normalizeParserLabel(name) !== normalizeParserLabel(sourceName) && contractorNameStem(name) === sourceStem; }) || "";
  }

  function getContractorNamesFromDirectory() {
    const directory = getContractorDirectory();
    const names = new Set();
    directory.entries.forEach(function(entry) {
      if (entry.status === 'canonical' || entry.status === 'alias') {

    Object.keys(state.pricing.data || {}).forEach(function(name) {

  function getContractorContracts(contractor) {

  function getKfoContracts(contractor) {
    const key = normalizeParserLabel(contractor);
    const contracts = new Set();
    (state.kfo.rawContractors || []).forEach(function (entry) {
      if (normalizeParserLabel(canonicalContractorName(entry.name)) !== key) return;
      (entry.contracts || []).forEach(function (contract) { if (contract) contracts.add(contract); });

  function getContractorRDC(contractor, contract) {
    const data = state.pricing.data || {};
    const contractorData = data[contractor];
    if (!contractorData) return [];

    return Object.keys(contractData.priceCalculations || {}).sort();
