  function getIndirectPercent(contractor, contract, rdc) {
    try {
      const data = state.pricing.data || {};
      const contractorData = data[contractor];
      if (!contractorData) return 0;
      const contractData = contractorData.contracts[contract];
      if (!contractData) return 0;
      const rdц = contractData.priceCalculations[rdc];
      return rdц ? rdц.indirectPercent || 0 : 0;
    } catch (_) { return 0; }
  }

  function getSourceUrl(contractor, contract, rdc) {
    try {
      const data = state.pricing.data || {};
      const contractorData = data[contractor];
      if (!contractorData) return "";
      const contractData = contractorData.contracts[contract];
      if (!contractData) return "";
      const rdц = contractData.priceCalculations[rdc];
      return rdц ? rdц.sourceUrl || "" : "";
    } catch (_) { return ""; }
  }

  function getRatePrice(contractor, contract, priceCalculation, rateCode) {
    try {
      const data = state.pricing.data || {};
      const contractorData = data[contractor];
      if (!contractorData) return null;
      const contractData = contractorData.contracts[contract];
      if (!contractData) return null;
      const rdц = contractData.priceCalculations[priceCalculation];
      if (!rdц) return null;
      const rate = rdц.rates[rateCode];
      return rate ? rate.totalPrice : null;
    } catch (_) { return null; }
  }

  function getRateName(rateCode) {
    const data = state.pricing.data || {};
    for (const contractor of Object.keys(data)) {
      const contracts = data[contractor].contracts || {};
      for (const contract of Object.keys(contracts)) {
        const rdц = contracts[contract].priceCalculations || {};
        for (const rdцKey of Object.keys(rdц)) {
          const rate = rdц[rdцKey].rates[rateCode];
          if (rate) return rate.name || rateCode;
        }
      }
    }
    return rateCode;
  }

  function getRateUnit(rateCode) {
    const data = state.pricing.data || {};
    for (const contractor of Object.keys(data)) {
      const contracts = data[contractor].contracts || {};
      for (const contract of Object.keys(contracts)) {
        const rdц = contracts[contract].priceCalculations || {};
        for (const rdцKey of Object.keys(rdц)) {
          const rate = rdц[rdцKey].rates[rateCode];
          if (rate) return rate.unit || "—";
        }
      }
    }
    return "—";
  }

  function getRateCurrency(rateCode) {
    const data = state.pricing.data || {};
    for (const contractor of Object.keys(data)) {
      const contracts = data[contractor].contracts || {};
      for (const contract of Object.keys(contracts)) {
        const rdц = contracts[contract].priceCalculations || {};
        for (const rdцKey of Object.keys(rdц)) {
          const rate = rdц[rdцKey].rates[rateCode];
          if (rate) return rate.currency || "RUB";
        }
      }
    }
    return "RUB";
  }

  function getAllRates() {
    const rates = new Set();
    const data = state.pricing.data || {};
    Object.keys(data).forEach(function(contractor) {
      const contracts = data[contractor].contracts || {};
      Object.keys(contracts).forEach(function(contract) {
        const rdц = contracts[contract].priceCalculations || {};
        Object.keys(rdц).forEach(function(rdцKey) {
          const rateKeys = Object.keys(rdц[rdцKey].rates || {});
          rateKeys.forEach(function(rate) { rates.add(rate); });
        });
      });
    });
    return Array.from(rates).sort();
  }

  function generateNodeId(level, indices) {
    return level + '-' + indices.join('-');
  }

  // =====================================================================
  // 7. РАБОТА С EXCEL
  // =====================================================================
  function columnLetterToIndex(value) {
    const text = String(value || "").replace(/\$/g, "").trim().toUpperCase();
    if (!/^[A-Z]+$/.test(text)) return -1;
    let result = 0;
    for (let i = 0; i < text.length; i += 1) result = result * 26 + text.charCodeAt(i) - 64;
    return result - 1;
  }

  function readSheetCell(sheet, rowIndex, columnIndex) {
    // Проверка на null/undefined входных параметров
    if (!sheet || rowIndex == null || columnIndex == null || rowIndex < 0 || columnIndex < 0) {
      return "";
    }

    try {
      const dense = sheet["!data"];
      let cell = null;

      if (dense && dense[rowIndex] && dense[rowIndex][columnIndex] !== undefined) {
        cell = dense[rowIndex][columnIndex];
      } else {
        // Если dense-режим не работает, пробуем через encode_cell
        const cellAddress = XLSX.utils.encode_cell({ r: rowIndex, c: columnIndex });
        cell = sheet[cellAddress];
      }

      // Проверяем, что ячейка существует и имеет значение
      if (!cell) return "";
      if (cell.v === undefined || cell.v === null) return "";

      // Если значение - строка, обрезаем пробелы
      if (typeof cell.v === "string") return cell.v.trim();

      return cell.v;
    } catch (error) {
      // В случае ошибки возвращаем пустую строку
      return "";
    }
  }

  function readSheetAddress(sheet, address) {
    try {
      const decoded = XLSX.utils.decode_cell(String(address || "A1"));
      return readSheetCell(sheet, decoded.r, decoded.c);
    } catch (_) { return ""; }
  }

  function getWorkbookSheet(workbook, preferredName, aliases) {
    const names = [preferredName].concat(aliases || []).filter(Boolean);
    for (let i = 0; i < names.length; i += 1) {
      const exact = workbook.SheetNames.find(function (name) { return normalizeParserLabel(name) === normalizeParserLabel(names[i]); });
      if (exact) return { name: exact, sheet: workbook.Sheets[exact] };
    }
    return null;
  }

  function parseExcelDate(value) {
    // Проверка на null/undefined
    if (value === null || value === undefined || value === "") {
      return "";
    }

    try {
      // Если это уже объект Date
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return value.toISOString().slice(0, 10);
      }

      // Если это число (серийный номер даты Excel)
      if (typeof value === "number" && Number.isFinite(value) && value > 0) {
        try {
          const parsed = XLSX.SSF && XLSX.SSF.parse_date_code ? XLSX.SSF.parse_date_code(value) : null;
          if (parsed && parsed.y && parsed.m && parsed.d) {
            return [parsed.y, String(parsed.m).padStart(2, "0"), String(parsed.d).padStart(2, "0")].join("-");
          }
        } catch (_) { /* игнорируем ошибки парсинга даты */ }
      }

      // Попытка распарсить строку
      const text = String(value).trim();
      if (!text) return "";

      // Русский формат ДД.ММ.ГГГГ или ДД/ММ/ГГГГ
      const ru = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec(text);
      if (ru) {
        return [ru[3], ru[2].padStart(2, "0"), ru[1].padStart(2, "0")].join("-");
      }

      // ISO формат ГГГГ-ММ-ДД
      const iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(text);
      if (iso) {
        return iso[1] + "-" + iso[2] + "-" + iso[3];
      }

      // Попытка через конструктор Date
      const date = new Date(text);
      if (!Number.isNaN(date.getTime())) {
        return date.toISOString().slice(0, 10);
      }

      return "";
    } catch (error) {
      return "";
    }
  }

  function parseKfoNumber(value, fallback) {
    // Проверка на null/undefined
    if (value === null || value === undefined || value === "") {
      return fallback == null ? 0 : fallback;
    }

    // Если уже число
    if (typeof value === "number") {
      return Number.isFinite(value) ? value : (fallback == null ? 0 : fallback);
    }

    try {
      const normalized = String(value).replace(/[\s\u00a0]/g, "").replace(",", ".");
      if (!normalized) return fallback == null ? 0 : fallback;

      const result = Number(normalized);
      return Number.isFinite(result) ? result : (fallback == null ? 0 : fallback);
    } catch (error) {
      return fallback == null ? 0 : fallback;
    }
  }

   function parsePricingNumber(value, fallback) {
    // Проверка на null/undefined
    if (value === null || value === undefined || value === "") {
      return fallback == null ? 0 : fallback;
    }

    // Если уже число
    if (typeof value === "number") {
      return Number.isFinite(value) ? value : (fallback == null ? 0 : fallback);
    }

    try {
      const normalized = String(value).replace(/[\s\u00a0]/g, "").replace(",", ".");
      if (!normalized) return fallback == null ? 0 : fallback;

      const result = Number(normalized);
      return Number.isFinite(result) ? result : (fallback == null ? 0 : fallback);
    } catch (error) {
      return fallback == null ? 0 : fallback;
    }
  }

  function parsePricingWorkbook(buffer, columnsConfig, sheetName) {
    if (!window.XLSX) throw new Error("Библиотека чтения Excel не загрузилась");
    const workbook = XLSX.read(buffer, { type: "array", dense: true, cellDates: true });
    const requestedSheet = String(sheetName || "").trim();
    const selected = requestedSheet ? getWorkbookSheet(workbook, requestedSheet, []) : getWorkbookSheet(workbook, "Лист1", ["Sheet1", "Расценки", "Prices"]);
    if (!selected) throw new Error("Вкладка «" + (requestedSheet || "Лист1") + "» не найдена. Найдены вкладки: " + workbook.SheetNames.join(", "));

    const sheet = selected.sheet;
    const colMap = {};
    const fields = ['code', 'name', 'unit', 'currency', 'basePrice'];
    const colLetters = {
      code: columnsConfig.code || 'A',
      name: columnsConfig.name || 'B',
      unit: columnsConfig.unit || 'C',
      currency: columnsConfig.currency || 'D',
      basePrice: columnsConfig.basePrice || 'E'
    };

    fields.forEach(function(field) {
      colMap[field] = columnLetterToIndex(colLetters[field]);
    });

    const rates = {};
    const reference = XLSX.utils.decode_range(sheet["!ref"] || "A1:A1");
    let startRow = reference.s.r;

    for (let rowIndex = 0; rowIndex < Math.min(reference.e.r + 1, 50); rowIndex += 1) {
      const code = String(readSheetCell(sheet, rowIndex, colMap.code) || "").trim();
      const normalizedCode = normalizeParserLabel(code);
      if (["шифр ер", "код", "код расценки", "code", "rate code"].indexOf(normalizedCode) >= 0) {
        startRow = rowIndex + 1;
        break;
      }
      const rawPrice = readSheetCell(sheet, rowIndex, colMap.basePrice);
      const price = typeof rawPrice === "number" ? rawPrice : Number(String(rawPrice || "").replace(/[\s\u00a0]/g, "").replace(",", "."));
      if (code && rawPrice !== "" && Number.isFinite(price)) {
        startRow = rowIndex;
        break;
      }
    }

    for (let rowIndex = startRow; rowIndex <= reference.e.r; rowIndex += 1) {
      const code = String(readSheetCell(sheet, rowIndex, colMap.code) || "").trim();
      if (!code) continue;
      const name = String(readSheetCell(sheet, rowIndex, colMap.name) || "").trim() || code;
      const unit = String(readSheetCell(sheet, rowIndex, colMap.unit) || "").trim() || "—";
      const currency = String(readSheetCell(sheet, rowIndex, colMap.currency) || "").trim() || "RUB";
      const basePrice = parsePricingNumber(readSheetCell(sheet, rowIndex, colMap.basePrice), 0);

      rates[code] = {
        name: name,
        unit: unit,
        currency: currency,
        basePrice: basePrice,
        totalPrice: basePrice
      };
    }

    return rates;
  }

  // =====================================================================
  // 8. ПАРСИНГ РЕГЛАМЕНТОВ И KFO
  // =====================================================================
  function resolveParserColumns(sheet, parser, sourceColumns, searchRows, sheetName) {
    const reference = XLSX.utils.decode_range(sheet["!ref"] || "A1:A1");
    const fields = Object.keys(parser.fields || {});
    let headerIndex = -1;
    const resolved = {};
    const maximumRows = reference.e.r + 1;
    const requiredFields = fields.filter(function (field) { return parser.fields[field].required; });
    const aliasIndex = new Map();
    const mergedValues = new Map();
    (sheet["!merges"] || []).forEach(function(merge) {
      const value = readSheetCell(sheet, merge.s.r, merge.s.c);
      const cellCount = (merge.e.r - merge.s.r + 1) * (merge.e.c - merge.s.c + 1);
      if (!value || cellCount > 10000) return;
      for (let row = merge.s.r; row <= merge.e.r; row += 1) {
        for (let col = merge.s.c; col <= merge.e.c; col += 1) mergedValues.set(row + ":" + col, value);
      }
    });
    const readHeaderCell = function(row, col) { return readSheetCell(sheet, row, col) || mergedValues.get(row + ":" + col) || ""; };
    fields.forEach(function(field) {
      (parser.fields[field].aliases || []).forEach(function(alias) {
        const key = normalizeParserLabel(alias);
        const list = aliasIndex.get(key) || [];
        list.push(field);
        aliasIndex.set(key, list);
      });
    });
    let bestCandidate = { count: 0, fields: [] };
    for (let rowIndex = 0; rowIndex < maximumRows; rowIndex += 1) {
      const candidate = {};
      for (let columnIndex = reference.s.c; columnIndex <= reference.e.c; columnIndex += 1) {
        const current = readHeaderCell(rowIndex, columnIndex);
        const variants = [current];
        if (rowIndex > 0) variants.push(readHeaderCell(rowIndex - 1, columnIndex) + " " + current);
        if (rowIndex > 1) variants.push(readHeaderCell(rowIndex - 2, columnIndex) + " " + readHeaderCell(rowIndex - 1, columnIndex) + " " + current);
        variants.forEach(function(value) {
          const matches = aliasIndex.get(normalizeParserLabel(value)) || [];
          matches.forEach(function(field) { if (candidate[field] === undefined) candidate[field] = columnIndex; });
        });
      }
      const foundRequired = requiredFields.filter(function (field) { return candidate[field] !== undefined; });
      if (foundRequired.length > bestCandidate.count) bestCandidate = { count: foundRequired.length, fields: foundRequired };
      const minimumAliasMatches = Math.max(2, Math.ceil(requiredFields.length * 0.7));
      const ready = foundRequired.length >= minimumAliasMatches && requiredFields.every(function (field) {
        if (candidate[field] !== undefined) return true;
        const fallback = sourceColumns && sourceColumns[field] ? sourceColumns[field] : parser.fields[field].fallbackColumn;
        const fallbackIndex = columnLetterToIndex(fallback);
        return fallbackIndex >= 0 && Boolean(normalizeParserLabel(readHeaderCell(rowIndex, fallbackIndex)));
      });
      if (ready) { headerIndex = rowIndex; Object.assign(resolved, candidate); break; }
    }
    if (headerIndex < 0) {
      const missing = requiredFields.filter(function (field) { return bestCandidate.fields.indexOf(field) < 0; });
      throw new Error("Вкладка «" + (sheetName || "не указана") + "»: не найдена строка заголовков. Отсутствуют обязательные поля: " + missing.join(", ") + ". Просмотрено строк: " + maximumRows + ". Проверьте названия заголовков, объединённые ячейки и aliases в parser-config.json.");
    }
    fields.forEach(function (field) {
      if (resolved[field] !== undefined) return;
      const fallback = sourceColumns && sourceColumns[field] ? sourceColumns[field] : parser.fields[field].fallbackColumn;
      const fallbackIndex = columnLetterToIndex(fallback);
      if (fallbackIndex >= 0) resolved[field] = fallbackIndex;
    });
    return { headerIndex: headerIndex, columns: resolved, lastRow: reference.e.r, diagnostics: { sheetName: sheetName || "", scannedRows: headerIndex + 1, headerRow: headerIndex + 1, requiredFields: requiredFields } };
  }

  function findRegulationRule(rules, markCode, contractor, contractNumber) {
    const normalizedMark = normalizeParserLabel(markCode);
    const candidates = rules.get(normalizedMark) || (normalizedMark ? [] : (rules.get("") || []));
    const contractorKey = normalizeParserLabel(canonicalContractorName(contractor));
    const contractKey = normalizeParserLabel(contractNumber);
    const matches = candidates.map(function (rule) {
      const ruleContractor = normalizeParserLabel(canonicalContractorName(rule.sourceContractor || rule.contractor));
      const ruleContract = normalizeParserLabel(rule.contractNumber);
      if (ruleContractor && ruleContractor !== contractorKey) return null;
      if (ruleContract && ruleContract !== contractKey) return null;
      return { rule: rule, score: (ruleContractor ? 4 : 0) + (ruleContract ? 2 : 0) };
    }).filter(Boolean).sort(function (a, b) { return b.score - a.score; });
    return matches.length ? matches[0].rule : null;
  }

  function regulationCoefficient(rule, field) {
    const value = Number(rule && rule[field]);
    return Number.isFinite(value) ? value : 0;
  }

  const coefficientCache = new Map();

  function getEffectiveLevelCoefficient(levelName, rule, config) {
    const cacheKey = levelName + "|" + (rule && rule.erCode || "") + "|" + (rule && rule[levelName + "Code"] || "");
    if (coefficientCache.has(cacheKey)) return coefficientCache.get(cacheKey);
    const logic = config.aggregationLogic || {};
    let corrections = logic.coefficientCorrections || {};
    if (rule && rule.__kfoSource && config.kfoLogic) corrections = (config.kfoLogic.coefficientCorrections || {});
    const byEr = corrections.byErCode || {};
    const erCode = String(rule.erCode || "");
    let erCorrection = byEr[erCode];
    if (erCorrection === undefined) erCorrection = byEr[normalizeParserLabel(erCode)];
    let corrected = typeof erCorrection === "object" && erCorrection !== null ? erCorrection[levelName] : (levelName === "kq2" ? erCorrection : undefined);
    const level = (logic.levels || {})[levelName] || {};
    const code = String(rule[level.codeField] || "");
    const correctionMapName = "by" + levelName.charAt(0).toUpperCase() + levelName.slice(1) + "Code";
    const byCode = corrections[correctionMapName] || {};
    if (corrected === undefined) corrected = byCode[code];
    if (corrected === undefined) corrected = byCode[normalizeParserLabel(code)];
    if (corrected === undefined && (levelName === "kq1" || levelName === "kq2")) {
      const effectiveGroup = getEffectiveAggregationGroup(levelName, code, rule[level.nameField], config);
      const effectiveCode = String(effectiveGroup.code || "");
      if (effectiveCode && effectiveCode !== code) {
        corrected = byCode[effectiveCode];
        if (corrected === undefined) corrected = byCode[normalizeParserLabel(effectiveCode)];
      }
    }
    const sourceCoefficient = level.coefficientField ? rule[level.coefficientField] : level.coefficient;
    const coefficient = corrected === undefined ? Number(sourceCoefficient) : Number(corrected);
    const result = Number.isFinite(coefficient) ? coefficient : 1;
    coefficientCache.set(cacheKey, result);
    return result;
  }

  function getEffectiveAggregationGroup(level, sourceCode, sourceName, config) {
    const logic = config.aggregationLogic || {};
    const groups = (logic.groupCorrections || {})[level] || {};
    let correction = groups[sourceCode];
    if (correction === undefined) correction = groups[normalizeParserLabel(sourceCode)];
    if (correction === undefined) {
      return { code: sourceCode || "", name: sourceName || "", corrected: false };
    }
    if (typeof correction === "string") {
      return { code: sourceCode || "", name: correction, corrected: true };
    }
    return {
      code: correction.code || sourceCode || "",
      name: correction.name || sourceName || "",
      corrected: true
    };
  }

  function analyzeKqControlSheet(workbook) {
    const selected = getWorkbookSheet(workbook, "KQ", ["KQ"]);
    if (!selected) return { rows: 0, uniqueEr: 0, duplicates: 0 };
    const reference = XLSX.utils.decode_range(selected.sheet["!ref"] || "A1:A1");
    const seen = new Set();
    let rows = 0, duplicates = 0;
    for (let rowIndex = reference.s.r + 1; rowIndex <= reference.e.r; rowIndex += 1) {
      const erCode = String(readSheetCell(selected.sheet, rowIndex, 0) || "").trim();
      if (!erCode) continue;
      rows += 1;
      const key = normalizeParserLabel(erCode);
      if (seen.has(key)) duplicates += 1; else seen.add(key);
    }
    return { rows: rows, uniqueEr: seen.size, duplicates: duplicates };
  }

  function parseRegulationsWorkbook(buffer, source, parserConfig) {
    if (!window.XLSX) throw new Error("Библиотека чтения Excel не загрузилась");
    const parser = parserConfig.parsers && parserConfig.parsers.dk;
    if (!parser) throw new Error("в JSON-конфигураторе отсутствует parsers.dk");
    const workbook = XLSX.read(buffer, { type: "array", dense: true, cellDates: true, sheets: [source.sheetName] });
    const selected = getWorkbookSheet(workbook, source.sheetName, parser.sheetAliases);
    if (!selected) throw new Error("лист «" + source.sheetName + "» не найден");
    const resolved = resolveParserColumns(selected.sheet, parser, null, source.headerSearchRows, selected.name);
    const rules = new Map();
    const entries = [];
    for (let rowIndex = resolved.headerIndex + 1; rowIndex <= resolved.lastRow; rowIndex += 1) {
      const get = function (field) { return resolved.columns[field] === undefined ? "" : readSheetCell(selected.sheet, rowIndex, resolved.columns[field]); };
      const markCode = String(get("markCode") || "").trim();
      if (!markCode) continue;
      const rule = {
        markCode: markCode,
        contractor: String(get("contractor") || "").trim(),
        contractNumber: String(get("contractNumber") || "").trim(),
        actualSmr: parseKfoNumber(get("actualSmr"), 0),
        acceptedSk: parseKfoNumber(get("acceptedSk"), 0),
        acceptedId: parseKfoNumber(get("acceptedId"), 0),
        sourceRow: rowIndex + 1
      };
      const key = normalizeParserLabel(markCode);
      const list = rules.get(key) || [];
      list.push(rule);
      rules.set(key, list);
      entries.push(rule);
    }
    const defaults = source.defaultDistribution || {};
    rules.set("", [{
      markCode: "",
      contractor: "",
      contractNumber: "",
      actualSmr: parseKfoNumber(defaults.actualSmr, 0.5),
      acceptedSk: parseKfoNumber(defaults.acceptedSk, 0.38),
      acceptedId: parseKfoNumber(defaults.acceptedId, 0.12),
      isDefault: true,
      sourceRow: 0
    }]);
    return { rules: rules, entries: entries, sheetName: selected.name };
  }

  async function parseKfoWorkbook(buffer, source, parserConfig, selectedContractors, onProgress, isCancelled) {
    if (!window.XLSX) throw new Error("Библиотека чтения Excel не загрузилась");
    const sheetSelection = [source.sheetName, "KQ"].filter(Boolean);
    const workbook = XLSX.read(buffer, { type: "array", dense: true, cellDates: true, sheets: sheetSelection });
    const parser = parserConfig.parsers && parserConfig.parsers.kfo;
    if (!parser) throw new Error("в JSON-конфигураторе отсутствует parsers.kfo");

    const kqNameMap = { kq1: {}, kq2: {} };
    const kqSheet = getWorkbookSheet(workbook, "KQ", ["KQ"]);
    if (kqSheet) {
      const kqData = XLSX.utils.sheet_to_json(kqSheet.sheet, { header: 1, defval: "", blankrows: false });
      for (let i = 1; i < kqData.length; i++) {
        const row = kqData[i];
        if (!row || row.length < 6) continue;
        const kq1Code = String(row[1] || "").trim();
        const kq1Name = String(row[2] || "").trim();
        const kq2Code = String(row[4] || "").trim();
        const kq2Name = String(row[5] || "").trim();
        if (kq1Code) kqNameMap.kq1[normalizeParserLabel(kq1Code)] = kq1Name || kq1Code;
        if (kq2Code) kqNameMap.kq2[normalizeParserLabel(kq2Code)] = kq2Name || kq2Code;
      }
    }
    state.kqNameMap = kqNameMap;

    const selected = getWorkbookSheet(workbook, source.sheetName, parser.sheetAliases);
    if (!selected) throw new Error("лист «" + source.sheetName + "» не найден");
    const resolved = resolveParserColumns(selected.sheet, parser, source.columns, source.headerSearchRows, selected.name);
    const regulationRules = state.regulations.status === "active" && state.regulations.rules instanceof Map ? state.regulations.rules : new Map();

    const level = ["kq1", "kq2"].indexOf(source.kqLevel) >= 0 ? source.kqLevel : state.kqLevel;
    const mode = "with-regulations";

    const filterContractors = Array.isArray(selectedContractors) && selectedContractors.length > 0;
    const contractorFilterSet = filterContractors ? new Set(selectedContractors.map(function(name) { return normalizeParserLabel(name); })) : null;

    const groups = new Map();
    const detectedContractors = new Map();
    const diagnostics = { totalRows: 0, includedRows: 0, dateExcludedRows: 0, futureFactRows: 0, missingContractorRows: 0, missingKqRows: 0, missingRegulationRows: 0, regulationMatchedRows: 0, zeroVolumeRows: 0, filteredOutByContractor: 0 };
    let maximumRowDate = "";

    const firstDataRow = resolved.headerIndex + 1;
    const totalDataRows = Math.max(0, resolved.lastRow - firstDataRow + 1);
    const batchSize = 2000;
    for (let rowIndex = firstDataRow; rowIndex <= resolved.lastRow; rowIndex += 1) {
      if ((rowIndex - firstDataRow) % batchSize === 0) {
        if (isCancelled && isCancelled()) throw new DOMException("Загрузка отменена новым запросом", "AbortError");
        if (onProgress) onProgress(rowIndex - firstDataRow, totalDataRows);
        await new Promise(function (resolve) {
          if (typeof requestAnimationFrame === "function") requestAnimationFrame(function () { resolve(); });
          else setTimeout(resolve, 0);
        });
      }
      const get = function (field) { return resolved.columns[field] === undefined ? "" : readSheetCell(selected.sheet, rowIndex, resolved.columns[field]); };
      const erCode = String(get("erCode") || "").trim();
      const contractor = String(get("contractor") || "").trim();
      const contractNumber = String(get("contractNumber") || "").trim();
      if (!erCode && !contractor) continue;
      diagnostics.totalRows += 1;

      if (filterContractors && contractor) {
        const canonicalName = canonicalContractorName(contractor);
        if (!contractorFilterSet.has(normalizeParserLabel(canonicalName))) {
          diagnostics.filteredOutByContractor += 1;
          continue;
        }
      }

      if (contractor) {
        const detectedKey = normalizeParserLabel(contractor);
        const detected = detectedContractors.get(detectedKey) || { name: contractor, rows: 0, contracts: new Set() };
        detected.rows += 1;
        if (contractNumber) detected.contracts.add(contractNumber);
        detectedContractors.set(detectedKey, detected);
      }
      if (!erCode || !contractor) { diagnostics.missingContractorRows += 1; continue; }

      const rowDate = parseExcelDate(get("rowDate"));
      if (rowDate && (!maximumRowDate || rowDate > maximumRowDate)) maximumRowDate = rowDate;
      if (state.asOfDate && rowDate && rowDate > state.asOfDate) { diagnostics.dateExcludedRows += 1; continue; }

      const lastFactDate = parseExcelDate(get("lastFactDate"));
      let actualSmr = parseKfoNumber(get("actualSmr"), 0);
      if (state.asOfDate && lastFactDate && lastFactDate > state.asOfDate) { actualSmr = 0; diagnostics.futureFactRows += 1; }

      const acceptedSk = parseKfoNumber(get("acceptedSk"), 0);
      const acceptedId = parseKfoNumber(get("acceptedId"), 0);
      if (actualSmr === 0 && acceptedSk === 0 && acceptedId === 0) { diagnostics.zeroVolumeRows += 1; continue; }

      const codeField = level === "kq1" ? "kq1Code" : "kq2Code";
      const coefficientField = level === "kq1" ? "kq1Coefficient" : "kq2Coefficient";

      let kq1Code = String(get("kq1Code") || "").trim();
      let kq2Code = String(get("kq2Code") || "").trim();
      let kq1Coefficient = parseKfoNumber(get("kq1Coefficient"), 1);
      let kq2Coefficient = parseKfoNumber(get("kq2Coefficient"), 1);

      const coefficientRule = { __kfoSource: true, erCode: erCode, kq1Code: kq1Code, kq2Code: kq2Code, kq1Coefficient: kq1Coefficient, kq2Coefficient: kq2Coefficient };
      kq1Coefficient = getEffectiveLevelCoefficient("kq1", coefficientRule, parserConfig);
      kq2Coefficient = getEffectiveLevelCoefficient("kq2", coefficientRule, parserConfig);

      const kqCode = level === "kq1" ? kq1Code : kq2Code;
      const kqCoefficient = level === "kq1" ? kq1Coefficient : kq2Coefficient;
      const effectiveKqCode = kqCode || erCode;
      const effectiveKqCoeff = kqCode ? kqCoefficient : 1;

      if (!kqCode) diagnostics.missingKqRows += 1;

      const rule = findRegulationRule(regulationRules, String(get("markCode") || "").trim(), contractor, contractNumber);
      if (rule) diagnostics.regulationMatchedRows += 1; else diagnostics.missingRegulationRows += 1;

      const actualCalculated = actualSmr * effectiveKqCoeff;
      const skCalculated = acceptedSk * effectiveKqCoeff;
      const idCalculated = acceptedId * effectiveKqCoeff;
      const regulationEvaluation = rule
        ? actualCalculated * regulationCoefficient(rule, "actualSmr") + skCalculated * regulationCoefficient(rule, "acceptedSk") + idCalculated * regulationCoefficient(rule, "acceptedId")
        : 0;

      const unit = String(get("unit") || "").trim() || "без ед. изм.";

      const kqName = (function() {
        const mapKey = level === "kq1" ? "kq1" : (level === "kq2" ? "kq2" : null);
        if (mapKey && state.kqNameMap && state.kqNameMap[mapKey]) {
          const name = state.kqNameMap[mapKey][normalizeParserLabel(effectiveKqCode)];
          if (name && name !== effectiveKqCode) return name;
        }
        const rule = state.aggregation.index && state.aggregation.index.get(normalizeParserLabel(erCode));
        if (rule) {
          const codeField = level === "kq1" ? "kq1Code" : "kq2Code";
          const nameField = level === "kq1" ? "kq1Name" : "kq2Name";
          if (normalizeParserLabel(rule[codeField]) === normalizeParserLabel(effectiveKqCode)) {
            return rule[nameField] || effectiveKqCode;
          }
        }
        return (String(get("erName") || "").trim() && String(get("erName") || "").trim() !== effectiveKqCode) ? String(get("erName") || "").trim() : effectiveKqCode;
      })();

      const groupKey = [source.id, normalizeParserLabel(contractor), normalizeParserLabel(effectiveKqCode), normalizeParserLabel(unit), level, mode].join("||");

      let group = groups.get(groupKey);
      if (!group) {
        group = {
          sourceId: source.id, sourceName: source.name,
          contractor: contractor,
          kqCode: effectiveKqCode,
          kqName: kqName,
          erName: String(get("erName") || "").trim(),
          unit: unit,
          level: level,
          mode: mode,
          kq1Code: kq1Code, kq2Code: kq2Code,
          kq1Coefficient: kq1Coefficient, kq2Coefficient: kq2Coefficient,
          rows: 0, regulationRows: 0,
          actualSmr: 0, acceptedSk: 0, acceptedId: 0,
          evaluatedVolume: 0, monthly: {}
        };
        groups.set(groupKey, group);
      }

      group.rows += 1;
      if (rule) group.regulationRows += 1;
      group.actualSmr += actualCalculated;
      group.acceptedSk += skCalculated;
      group.acceptedId += idCalculated;
      group.evaluatedVolume += regulationEvaluation;
      const monthKey = (rowDate || lastFactDate || "").slice(0, 7);
      if (monthKey) group.monthly[monthKey] = (group.monthly[monthKey] || 0) + actualCalculated;
      diagnostics.includedRows += 1;
    }

    const updatedAtCell = source.updatedAtCell || parser.updatedAtCell;
    const configuredUpdatedAt = parseExcelDate(readSheetAddress(selected.sheet, updatedAtCell));
    const updatedAt = configuredUpdatedAt || maximumRowDate;
    const updatedAtOrigin = configuredUpdatedAt ? "ячейка " + updatedAtCell : "максимальная дата строк";

    const outputGroups = Array.from(groups.values()).sort(function (a, b) {
      return a.contractor.localeCompare(b.contractor, "ru") || a.kqCode.localeCompare(b.kqCode, "ru") || a.unit.localeCompare(b.unit, "ru");
    });

    const coverageBase = diagnostics.regulationMatchedRows + diagnostics.missingRegulationRows;
    if (onProgress) onProgress(totalDataRows, totalDataRows);
    return {
      groups: outputGroups,
      summary: {
        id: source.id, name: source.name, sheetName: selected.name,
        updatedAt: updatedAt, updatedAtOrigin: updatedAtOrigin,
        totalRows: diagnostics.totalRows,
        includedRows: diagnostics.includedRows,
        groupCount: outputGroups.length,
        contractors: Array.from(detectedContractors.values()).map(function (entry) { return { name: entry.name, rows: entry.rows, contracts: Array.from(entry.contracts).sort() }; }),
        regulationCoverage: coverageBase ? diagnostics.regulationMatchedRows / coverageBase * 100 : null,
        diagnostics: diagnostics,
        kqControl: analyzeKqControlSheet(workbook),
        filteredOutByContractor: diagnostics.filteredOutByContractor
      }
    };
  }

  // 9. ЗАГРУЗКА ДАННЫХ
  // =====================================================================
  async function fetchWorkbookBuffer(url) {
    const parsed = new URL(url, location.href);
    if (!/^https?:$/.test(parsed.protocol)) throw new Error("поддерживаются только HTTP- и HTTPS-ссылки");
    const controller = new AbortController();
    const timer = window.setTimeout(function () { controller.abort(); }, 120000);
    try {
      const response = await fetch(parsed.href, { cache: "no-store", credentials: "include", signal: controller.signal });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return await response.arrayBuffer();
    } finally {
      window.clearTimeout(timer);
    }
  }

  async function checkKfoSourceConnection(source) {
    if (!source || !source.url) {
      if (source) state.sourceConnections[source.id] = { status: "inactive", checkedAt: new Date(), message: "Ссылка на файл не указана" };
      return false;
    }
    state.sourceConnections[source.id] = { status: "checking", checkedAt: new Date(), message: "Проверяем доступность файла…" };
    const controller = new AbortController();
    const timer = window.setTimeout(function() { controller.abort(); }, 20000);
    try {
      const response = await fetch(new URL(source.url, location.href).href, { method: "HEAD", cache: "no-store", credentials: "include", signal: controller.signal });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const length = Number(response.headers.get("content-length")) || 0;
      state.sourceConnections[source.id] = { status: "active", checkedAt: new Date(), message: "Файл доступен" + (length ? "; размер " + formatNumber(length / 1048576, 1) + " МБ" : "") + ". Данные не загружены." };
      return true;
    } catch (error) {
      state.sourceConnections[source.id] = { status: "error", checkedAt: new Date(), message: error.name === "AbortError" ? "Превышено время проверки файла" : (error.message || "Файл недоступен") };
      return false;
    } finally {
      window.clearTimeout(timer);
    }
  }

  async function checkKfoConnections(quiet) {
    const sources = getKfoSources().filter(function(source) { return source.enabled; });
    startProcess("Источники БД КФО", "Проверка файла");
    if (!sources.length) {
      finishProcess("error", "Проверка файла", 0, "Нет включённых источников БД КФО");
      if (state.configLoaded) renderContent();
      if (!quiet) showToast("Источники не настроены", "Добавьте и включите источник БД КФО.");
      return false;
    }
    const results = [];
    for (let index = 0; index < sources.length; index += 1) {
      updateProcess("Проверка файла", Math.round(index / sources.length * 100), index, sources[index].name || sources[index].url);
      results.push(await checkKfoSourceConnection(sources[index]));
    }
    const available = results.filter(Boolean).length;
    finishProcess(available === sources.length ? "success" : (available ? "warning" : "error"), "Завершено", sources.length, available + " из " + sources.length + " файлов доступны. Данные не загружались.");
    if (state.configLoaded) renderContent();
    if (!quiet) showToast(results.some(Boolean) ? "Проверка завершена" : "Источники недоступны", available + " из " + results.length + " файлов доступны. Данные не загружались.");
    return results.some(Boolean);
  }

  async function fetchParserConfiguration() {
    const cfg = state.config || {};
    const url = cfg.parserConfigUrl || "";
    if (!url) throw new Error("URL парсер-конфига не задан");
    const response = await fetch(new URL(url, location.href).href, { cache: "no-store", credentials: "include" });
    if (!response.ok) throw new Error("JSON-конфигуратор: HTTP " + response.status);
    const config = await response.json();
    if (!config || config.application !== "nzp-calculator" || !config.parsers || !config.parsers.aggregation) {
      throw new Error("неверная структура JSON-конфигуратора");
    }
    if (!config.parsers.kfo || !config.parsers.dk || !config.kfoLogic) {
      throw new Error("в конфигураторе не описаны parsers.kfo, parsers.dk и kfoLogic");
    }
    const aggregation = config.parsers.aggregation;
    if (!aggregation.fields || !Array.isArray(aggregation.recordRequiredFields)) {
      throw new Error("в конфигураторе не описаны поля парсера укрупнения");
    }
    if (!config.sources || !config.sources.aggregation || !config.sources.aggregation.url) {
      throw new Error("в конфигураторе не указана ссылка sources.aggregation.url");
    }
    if (!config.aggregationLogic || !config.aggregationLogic.activeLevel || !Array.isArray(config.sourcePriority)) {
      throw new Error("в конфигураторе не описаны aggregationLogic и sourcePriority");
    }
    config._sourceUrl = response.url || new URL(url, location.href).href;
    return config;
  }

  async function loadRegulations(quiet) {
    const source = getRegulationsSource();
    if (!source.enabled || !source.url) {
      state.regulations = { status: "inactive", rules: new Map(), entries: [], sourceName: source.name, message: "Источник регламентов не подключён" };
      if (state.active === "coefficients") renderContent();
      return false;
    }
    state.regulations = { status: "loading", rules: new Map(), entries: [], sourceName: source.name, message: "Читаем регламенты…" };
    if (state.active === "coefficients") renderContent();
    try {
      const parserConfig = await fetchParserConfiguration();
      const parsed = parseRegulationsWorkbook(await fetchWorkbookBuffer(source.url), source, parserConfig);
      state.regulations = { status: "active", rules: parsed.rules, entries: parsed.entries, sourceName: source.name, sheetName: parsed.sheetName, message: "Регламенты загружены" };
      if (!quiet) showToast("Регламенты загружены", "Прочитано записей: " + formatNumber(parsed.entries.length, 0) + ".");
      if (state.kfo.status === "active" && !quiet) showToast("Требуется обновление БД КФО", "Регламенты изменились. Для пересчёта нажмите «Собрать сведения» в разделе БД КФО.");
      if (state.active === "coefficients") renderContent();
      return true;
    } catch (error) {
      state.regulations = { status: "error", rules: new Map(), entries: [], sourceName: source.name, message: error.message || "Не удалось прочитать регламенты" };
      if (!quiet) showToast("Регламенты не загружены", state.regulations.message);
      if (state.active === "coefficients") renderContent();
      return false;
    }
  }

  async function loadProjectKpis() {
    const sources = getKfoSources().filter(function(source) { return source.enabled && source.url; });
    if (!sources.length) { showToast("KPI недоступны", "Нет подключённого источника БД КФО."); return false; }
    startProcess(sources.map(function(source) { return source.name; }).join(", "), "Загрузка БД КФО — KPI KQ-1");
    state.kpi = { status: "loading", groups: [], totalRows: 0, includedRows: 0, message: "Загрузка KPI уровня KQ-1…" };
    renderContent();
    try {
      const parserConfig = await fetchParserConfiguration();
      const groups = [];
      let totalRows = 0, includedRows = 0;
      for (let index = 0; index < sources.length; index += 1) {
        const source = Object.assign({}, sources[index], { kqLevel: "kq1" });
        const parsed = await parseKfoWorkbook(await fetchWorkbookBuffer(source.url), source, parserConfig, []);
        groups.push.apply(groups, parsed.groups);
        totalRows += parsed.summary.totalRows;
        includedRows += parsed.summary.includedRows;
      }
      state.kpi = { status: "active", groups: groups, totalRows: totalRows, includedRows: includedRows, message: "KPI KQ-1 сформированы" };
      finishProcess("success", "Завершено", totalRows, "KPI уровня KQ-1 сформированы");
      renderContent();
      showToast("KPI сформированы", "Обработано строк: " + formatNumber(totalRows, 0));
      return true;
    } catch (error) {
      state.kpi = { status: "error", groups: [], totalRows: 0, includedRows: 0, message: error.message || "Ошибка загрузки KPI" };
      finishProcess("error", "Обработка данных", 0, state.kpi.message);
      renderContent();
      showToast("Ошибка KPI", state.kpi.message);
      return false;
    }
  }

async function loadKfoSources() {
    const loadGeneration = ++state.kfoLoadGeneration;
    const sources = getKfoSources().filter(function (source) {
        return source.enabled && source.url;
    });

    if (!sources.length) {
        state.kfo = {
            status: "error",
            groups: [],
            contractors: [],
            rawContractors: [],
            sourceSummaries: [],
            totalRows: 0,
            includedRows: 0,
            message: "Не указана ссылка ни на одну БД КФО"
        };
        renderContent();
        showToast("Сведения не обновлены", "Укажите ссылку SharePoint в режиме редактирования.");
        return false;
    }

    let selectedContractors = state.selectedContractors || [];
    const isAllSelected = selectedContractors.length === 0 ||
        (selectedContractors.length === 1 && selectedContractors[0] === "__ALL__");
    const filterContractors = isAllSelected ? [] : selectedContractors;

    startProcess(sources.map(function(source) { return source.name; }).join(", "), "Проверка файла");

    function updateProgress(stage, detail, percent, processed) {
        updateProcess(stage || "Обработка данных", percent, processed == null ? state.process.processed : processed, detail || "");
    }

    state.kfo = {
        status: "loading",
        groups: [],
        contractors: [],
        rawContractors: [],
        sourceSummaries: [],
        totalRows: 0,
        includedRows: 0,
        message: "Читаем источники…"
    };

for (let idx = 0; idx < sources.length; idx++) {
    const source = sources[idx];
    state.sourceConnections[source.id] = {
        status: "loading",
        checkedAt: new Date(),
        message: "Загружаем и разбираем Excel…"
    };
}

    let parserConfig;
    try {
        parserConfig = await fetchParserConfiguration();
        if (state.aggregation.parserDirty && state.aggregation.parserConfig) {
            ["aggregationLogic", "kfoLogic"].forEach(function (logicName) {
                const storedLogic = state.aggregation.parserConfig[logicName];
                if (!storedLogic || !storedLogic.coefficientCorrections) return;
                const currentLogic = parserConfig[logicName] = parserConfig[logicName] || {};
                currentLogic.coefficientCorrections = storedLogic.coefficientCorrections;
            });
        }
        if (!state.aggregation.parserConfig) {
            state.aggregation.parserConfig = parserConfig;
            state.aggregation.parserVersion = parserConfig.version || "";
        }
    } catch (error) {
        state.kfo.status = "error";
        state.kfo.message = error.message || "Не удалось загрузить JSON-конфигуратор";
        finishProcess("error", "Поиск заголовков", 0, state.kfo.message);
        renderContent();
        showToast("Ошибка конфигурации БД КФО", state.kfo.message);
        return false;
    }

    state.aggregation.parserConfig = parserConfig;
    state.aggregation.parserVersion = parserConfig.version || state.aggregation.parserVersion || "";
    const allGroups = [];
    const summaries = [];
    const errors = [];
    const totalSources = sources.length;

    updateProgress("Проверка файла", "Конфигурация загружена", 10, 0);

    for (let i = 0; i < sources.length; i += 1) {
        const source = sources[i];
        try {
            const progress = 10 + ((i / totalSources) * 80);
            updateProgress(
                "Загрузка БД КФО",
                `${source.name} (${i + 1}/${totalSources})`,
                progress,
                state.process.processed
            );

            const workbookBuffer = await fetchWorkbookBuffer(source.url);
            if (loadGeneration !== state.kfoLoadGeneration) return false;
            const parsed = await parseKfoWorkbook(
                workbookBuffer,
                source,
                parserConfig,
                filterContractors,
                function(processed, total) {
                    const sourceShare = total ? processed / total : 1;
                    const percent = 10 + (((i + sourceShare) / totalSources) * 80);
                    updateProgress(
                        "Обработка данных",
                        `${source.name} — ${formatNumber(processed, 0)} из ${formatNumber(total, 0)} строк`,
                        percent,
                        processed
                    );
                },
                function() { return loadGeneration !== state.kfoLoadGeneration; }
            );

            if (loadGeneration !== state.kfoLoadGeneration) return false;

            allGroups.push.apply(allGroups, parsed.groups);
            summaries.push(parsed.summary);

            state.sourceConnections[source.id] = {
                status: "active",
                checkedAt: new Date(),
                message: "Проанализировано " + formatNumber(parsed.summary.totalRows, 0) +
                    " строк; с объёмами — " + formatNumber(parsed.summary.includedRows, 0) +
                    (parsed.summary.filteredOutByContractor ? "; отфильтровано по подрядчикам — " + formatNumber(parsed.summary.filteredOutByContractor, 0) : "")
            };

            const afterProgress = 10 + (((i + 1) / totalSources) * 80);
            updateProgress(
                "Обработка данных",
                `Обработано: ${source.name} (${i + 1}/${totalSources})`,
                afterProgress,
                parsed.summary.totalRows
            );

        } catch (error) {
            const message = error && error.name === "AbortError" ? "Превышено время загрузки" : (error.message || "Ошибка чтения Excel");
            state.sourceConnections[source.id] = {
                status: "error",
                checkedAt: new Date(),
                message: message
            };
            errors.push(source.name + ": " + message);
        }
    }

    if (loadGeneration !== state.kfoLoadGeneration) return false;
    state.dataUpdatedAt = new Date();
    updateProgress("Обработка данных", "Формирование итоговых данных", 95, summaries.reduce(function(sum, entry) { return sum + entry.totalRows; }, 0));

    const canonicalGroups = (function() {
        const merged = new Map();
        const directory = contractorDirectoryIndex();
        (allGroups || []).forEach(function (entry) {
            const canonicalName = canonicalContractorName(entry.contractor);
            const key = [normalizeParserLabel(canonicalName), normalizeParserLabel(entry.kqCode), normalizeParserLabel(entry.unit), entry.level || "", entry.mode || ""].join("||");
            let target = merged.get(key);
            if (!target) {
                target = Object.assign({}, entry, {
                    contractor: canonicalName,
                    rows: 0, regulationRows: 0,
                    actualSmr: 0, acceptedSk: 0, acceptedId: 0,
                    evaluatedVolume: null,
                    monthly: {},
                    rawContractors: []
                });
                merged.set(key, target);
            }
            target.rows += Number(entry.rows) || 0;
            target.regulationRows += Number(entry.regulationRows) || 0;
            target.actualSmr += Number(entry.actualSmr) || 0;
            target.acceptedSk += Number(entry.acceptedSk) || 0;
            target.acceptedId += Number(entry.acceptedId) || 0;
            if (entry.evaluatedVolume != null) target.evaluatedVolume = (target.evaluatedVolume || 0) + (Number(entry.evaluatedVolume) || 0);
            Object.keys(entry.monthly || {}).forEach(function(month) { target.monthly[month] = (target.monthly[month] || 0) + (Number(entry.monthly[month]) || 0); });
            if (target.rawContractors.indexOf(entry.contractor) < 0) target.rawContractors.push(entry.contractor);
        });
        return Array.from(merged.values()).sort(function (a, b) {
            return a.contractor.localeCompare(b.contractor, "ru") ||
                a.kqCode.localeCompare(b.kqCode, "ru") ||
                a.unit.localeCompare(b.unit, "ru");
        });
    })();

    const combinedContractors = (function() {
        const combined = new Map();
        (summaries || []).forEach(function (summary) {
            (summary.contractors || []).forEach(function (entry) {
                const key = normalizeParserLabel(entry.name);
                const current = combined.get(key) || { name: entry.name, rows: 0, contracts: [] };
                current.rows += Number(entry.rows) || 0;
                (entry.contracts || []).forEach(function (contract) { if (current.contracts.indexOf(contract) < 0) current.contracts.push(contract); });
                combined.set(key, current);
            });
        });
        return Array.from(combined.values()).sort(function (a, b) { return a.name.localeCompare(b.name, "ru"); });
    })();

    const contractorSummaries = (function() {
        const map = new Map();
        canonicalGroups.forEach(function (group) {
            const key = normalizeParserLabel(group.contractor);
            let entry = map.get(key);
            if (!entry) {
                entry = {
                    name: group.contractor,
                    rows: 0,
                    workTypeSet: new Set(),
                    unitSet: new Set(),
                    regulationRows: 0,
                    regulatedBase: 0
                };
                map.set(key, entry);
            }
            entry.rows += group.rows;
            entry.workTypeSet.add([normalizeParserLabel(group.kqCode || group.kqName || group.erName), group.level || ""].join("||"));
            entry.unitSet.add(group.unit);
            if (group.mode === "with-regulations") {
                entry.regulationRows += group.regulationRows;
                entry.regulatedBase += group.rows;
            }
        });
        return Array.from(map.values()).map(function (entry) {
            return {
                name: entry.name,
                rows: entry.rows,
                workTypes: entry.workTypeSet.size,
                units: entry.unitSet.size,
                regulationCoverage: entry.regulatedBase ? entry.regulationRows / entry.regulatedBase * 100 : null
            };
        }).sort(function (a, b) { return a.name.localeCompare(b.name, "ru"); });
    })();

    state.kfo = {
        status: summaries.length ? "active" : "error",
        groups: allGroups,
        contractors: contractorSummaries,
        rawContractors: combinedContractors,
        sourceSummaries: summaries,
        totalRows: summaries.reduce(function (sum, entry) { return sum + entry.totalRows; }, 0),
        includedRows: summaries.reduce(function (sum, entry) { return sum + entry.includedRows; }, 0),
        message: errors.length ? errors.join("; ") : "Сведения загружены"
    };
    if (state.pricing.addForm.contractor) {
        const refreshedContracts = getKfoContracts(state.pricing.addForm.contractor);
        if (refreshedContracts.indexOf(state.pricing.addForm.contract) < 0) state.pricing.addForm.contract = "";
    }
    state.connection = {
        status: summaries.length ? "active" : "inactive",
        checkedAt: new Date(),
        message: summaries.length + " из " + sources.length + " источников обработано" +
            (filterContractors.length ? "; выбрано подрядчиков: " + filterContractors.length : "")
    };

    finishProcess(errors.length ? "warning" : "success", "Завершено", state.kfo.totalRows, errors.length ? errors.join("; ") : "БД КФО успешно загружена");
    renderContent();

    const filterMsg = filterContractors.length ? " (отфильтровано по " + filterContractors.length + " подрядчикам)" : "";
    showToast(summaries.length ? "Сведения БД КФО обновлены" : "Не удалось прочитать БД КФО",
        summaries.length ? ("Проанализировано строк: " + formatNumber(state.kfo.totalRows, 0) +
            ". Видов работ: " + formatNumber((function() { const keys = new Set(); (allGroups || []).forEach(function (entry) { keys.add([normalizeParserLabel(entry.kqCode || entry.kqName || entry.erName), entry.level || ""].join("||")); }); return keys.size; })(), 0) + "." +
            filterMsg +
            (errors.length ? " Есть ошибки отдельных источников." : "")) : errors.join("; ")
    );
    return summaries.length > 0;
}

  async function parseAggregationWorkbook(buffer, parser, onProgress) {
    if (!window.XLSX) throw new Error("Библиотека чтения Excel не загрузилась");
    const workbook = XLSX.read(buffer, { type: "array", dense: true });
    const fieldNames = Object.keys(parser.fields || {});
    const requiredFields = fieldNames.filter(function(field) { return parser.fields[field].required; });
    const searchRows = Math.max(1, Math.min(Number(parser.headerSearchRows) || 50, 500));
    let lastHeaderError = "";

    for (let sheetIndex = 0; sheetIndex < workbook.SheetNames.length; sheetIndex += 1) {
      const sheetName = workbook.SheetNames[sheetIndex];
      const sheet = workbook.Sheets[sheetName];
      const reference = XLSX.utils.decode_range(sheet["!ref"] || "A1:A1");
      let headerIndex = -1;
      let columns = {};
      if (onProgress) onProgress("Поиск заголовков", 40 + Math.round((sheetIndex + 1) / Math.max(1, workbook.SheetNames.length) * 10), 0, "Лист: " + sheetName);

      for (let rowIndex = reference.s.r; rowIndex <= Math.min(reference.e.r, reference.s.r + searchRows - 1); rowIndex += 1) {
        const candidate = {};
        for (let columnIndex = reference.s.c; columnIndex <= reference.e.c; columnIndex += 1) {
          const value = normalizeParserLabel(readSheetCell(sheet, rowIndex, columnIndex));
          if (!value) continue;
          fieldNames.forEach(function(field) {
            if (candidate[field] !== undefined) return;
            const aliases = (parser.fields[field] && parser.fields[field].aliases) || [];
            if (aliases.some(function(alias) { return normalizeParserLabel(alias) === value; })) candidate[field] = columnIndex;
          });
        }
        if (requiredFields.every(function(field) { return candidate[field] !== undefined; })) {
          headerIndex = rowIndex;
          columns = candidate;
          break;
        }
      }

      if (headerIndex < 0) {
        lastHeaderError = "Лист «" + sheetName + "»: обязательные заголовки не найдены в первых " + searchRows + " строках";
        continue;
      }

      const entries = [];
      const totalRows = Math.max(0, reference.e.r - headerIndex);
      for (let rowIndex = headerIndex + 1; rowIndex <= reference.e.r; rowIndex += 1) {
        const processedRows = rowIndex - headerIndex;
        if (processedRows % 2000 === 0) {
          if (onProgress) onProgress("Обработка данных", 50 + Math.round(processedRows / Math.max(1, totalRows) * 40), entries.length, "Формируем облегчённый индекс BOQ");
          await new Promise(function(resolve) {
            if (typeof requestAnimationFrame === "function") requestAnimationFrame(function() { resolve(); });
            else setTimeout(resolve, 0);
          });
        }
        const getValue = function(field) { return columns[field] === undefined ? "" : readSheetCell(sheet, rowIndex, columns[field]); };
        const complete = parser.recordRequiredFields.every(function(field) { return String(getValue(field) == null ? "" : getValue(field)).trim(); });
        if (!complete) continue;
        const numeric = function(field) {
          const value = Number(String(getValue(field)).replace(/\s/g, "").replace(",", "."));
          return Number.isFinite(value) ? value : null;
        };
        const entry = {
          erCode: String(getValue("erCode")).trim(),
          erName: String(getValue("erName")).trim(),
          unit: String(getValue("unit")).trim(),
          kq1Code: String(getValue("kq1Code")).trim(),
          kq1Name: String(getValue("kq1Name")).trim(),
          kq1Coefficient: numeric("kq1Coefficient"),
          kq2Code: String(getValue("kq2Code")).trim(),
          kq2Name: String(getValue("kq2Name")).trim(),
          kq2Coefficient: numeric("kq2Coefficient"),
          status: String(getValue("status") || parser.defaultStatus || "Действует").trim()
        };
        const defaultCoefficient = Number(parser.missingCoefficient) || 1;
        ["kq1Coefficient", "kq2Coefficient"].forEach(function(field) { if (entry[field] === null) entry[field] = defaultCoefficient; });
        entries.push(entry);
      }
      if (entries.length) return entries;
      lastHeaderError = "Лист «" + sheetName + "»: таблица найдена, но полных записей BOQ нет";
    }
    throw new Error(lastHeaderError || "В Excel не найдена таблица, соответствующая JSON-конфигуратору");
  }

  async function loadAggregation(quiet) {
    const cfg = state.config || {};
    const source = cfg.aggregationSource || { name: "Справочник BOQ", url: "" };
    let previousParserConfig = state.aggregation.parserConfig;
    let previousParserDirty = state.aggregation.parserDirty;
    startProcess(source.name || "Справочник BOQ", "Проверка файла");
    state.aggregation.status = "loading";
    try {
      const parserConfig = await fetchParserConfiguration();
      updateProcess("Проверка файла", 10, 0, "Конфигурация источника проверена");
      const configuredSource = parserConfig.sources.aggregation.url || source.url;
      state.process.source = configuredSource || source.name || "Справочник BOQ";
      const response = await fetch(new URL(configuredSource, parserConfig._sourceUrl).href, { cache: "no-store", credentials: "include" });
      if (!response.ok) throw new Error("Справочник Excel: HTTP " + response.status);
      updateProcess("Чтение данных", 25, 0, "Файл получен, читаем Excel");
      const aggregationBuffer = await response.arrayBuffer();
      updateProcess("Поиск заголовков", 40, 0, "Ищем таблицу BOQ по обязательным полям");
      const entries = await parseAggregationWorkbook(aggregationBuffer, parserConfig.parsers.aggregation, updateProcess);
      updateProcess("Обработка данных", 95, entries.length, "Формируем индекс для поиска по требованию");
      previousParserConfig = state.aggregation.parserConfig;
      previousParserDirty = state.aggregation.parserDirty;
      if (previousParserDirty && previousParserConfig) {
        ["aggregationLogic", "kfoLogic"].forEach(function (logicName) {
          const previousLogic = previousParserConfig[logicName];
          if (!previousLogic || !previousLogic.coefficientCorrections) return;
          const currentLogic = parserConfig[logicName] = parserConfig[logicName] || {};
          currentLogic.coefficientCorrections = previousLogic.coefficientCorrections;
        });
      }
      state.aggregation = {
        status: "active",
        entries: entries,
        parserVersion: parserConfig.version || "",
        parserConfig: parserConfig,
        parserDirty: Boolean(previousParserDirty),
        index: (function(entries, config) {
          const logic = config.aggregationLogic || {};
          const matchField = logic.matchField || "erCode";
          const excluded = (logic.excludedStatuses || []).map(normalizeParserLabel);
          const index = new Map();
          entries.forEach(function (entry) {
            if (excluded.indexOf(normalizeParserLabel(entry.status)) >= 0) return;
            const key = normalizeParserLabel(entry[matchField]);
            if (key && !index.has(key)) index.set(key, entry);
          });
          return index;
        })(entries, parserConfig),
        message: "Справочник загружен"
      };
      finishProcess("success", "Завершено", entries.length, "Облегчённый модуль BOQ загружен по требованию");
      renderContent();
      if (!quiet) showToast("Справочник BOQ загружен", "Прочитано " + entries.length + " строк ЕР.");
      return true;
    } catch (error) {
      state.aggregation = {
        status: "error",
        entries: [],
        parserVersion: "",
        parserConfig: previousParserConfig || null,
        parserDirty: Boolean(previousParserDirty),
        index: new Map(),
        message: error.message || "Ошибка чтения справочника"
      };
      finishProcess("error", "Загрузка данных", 0, state.aggregation.message);
      renderContent();
      if (!quiet) showToast("Ошибка справочника BOQ", state.aggregation.message);
      return false;
    }
  }

  async function loadPricingData(quiet) {
    const bindings = state.config && state.config.pricingBindings ? state.config.pricingBindings : {};
    if (!Object.keys(bindings).length) {
      state.pricing.status = "inactive";
      state.pricing.data = {};
      if (!quiet) showToast("Расценки не загружены", "Нет привязок в конфигурации.");
      if (state.active === "pricing") renderContent();
      return false;
    }

    const pricingSourcesTotal = Object.values(bindings).reduce(function(contractorTotal, contracts) {
      return contractorTotal + Object.values(contracts || {}).reduce(function(contractTotal, rdcs) {
        return contractTotal + Object.keys(rdcs || {}).length;
      }, 0);
    }, 0);
    startProcess("Источники расценок", "Загрузка расценок");
    state.pricing.status = "loading";
    if (state.active === "pricing") renderContent();

    let loadedCount = 0;
    let errorCount = 0;

    for (const [contractor, contracts] of Object.entries(bindings)) {
      if (!state.pricing.data[contractor]) {
        state.pricing.data[contractor] = { contracts: {} };
      }
      for (const [contract, rdcs] of Object.entries(contracts)) {
        if (!state.pricing.data[contractor].contracts[contract]) {
          state.pricing.data[contractor].contracts[contract] = { priceCalculations: {} };
        }
        for (const [rdc, config] of Object.entries(rdcs)) {
          updateProcess("Загрузка расценок", Math.round((loadedCount + errorCount) / Math.max(1, pricingSourcesTotal) * 90), loadedCount + errorCount, contractor + " · " + contract + " · " + rdc);
          try {
            if (config.sourceUrl) {
              if (!String(config.sheetName || "").trim()) throw new Error("Не указано наименование вкладки Excel в конфигурации источника");
              const buffer = await fetchWorkbookBuffer(config.sourceUrl);
              const rates = parsePricingWorkbook(buffer, config.columns || { code: "A", name: "B", unit: "C", currency: "D", basePrice: "E" }, config.sheetName);

              const indirectPercent = config.indirectPercent || 0;
              const multiplier = 1 + indirectPercent / 100;

              Object.keys(rates).forEach(function(code) {
                rates[code].totalPrice = rates[code].basePrice * multiplier;
              });

              state.pricing.data[contractor].contracts[contract].priceCalculations[rdc] = {
                sourceUrl: config.sourceUrl,
                sheetName: config.sheetName,
                indirectPercent: indirectPercent,
                rates: rates,
                columns: config.columns || { code: "A", name: "B", unit: "C", currency: "D", basePrice: "E" }
              };
              loadedCount++;
            }
          } catch (error) {
            errorCount++;
            if (!quiet) {
              showToast("Ошибка загрузки расценок", contractor + " " + contract + " " + rdc + ": " + error.message);
            }
          }
        }
      }
    }

    state.pricing.status = loadedCount > 0 ? "active" : "error";
    finishProcess(loadedCount > 0 ? (errorCount ? "warning" : "success") : "error", loadedCount > 0 ? "Завершено" : "Загрузка расценок", loadedCount, errorCount ? "Ошибок источников: " + errorCount : "Расценки загружены");
    if (state.active === "pricing") renderContent();

    if (!quiet) {
      if (loadedCount > 0) {
        showToast("Расценки загружены", "Загружено источников: " + loadedCount + (errorCount ? ", ошибок: " + errorCount : ""));
      } else if (errorCount > 0) {
        showToast("Расценки не загружены", "Все источники недоступны или имеют ошибки.");
      }
    }
    return loadedCount > 0;
  }

  // 10. ЗАГРУЗКА КОНФИГА

  async function loadConfig(force) {
    const now = Date.now();

    if (!force && state.configLoaded && state.config && state.configLoadedAt &&
        (now - state.configLoadedAt) < CONFIG_LIFETIME_MS) {
      return true;
    }

    setConfigStatus("", "Загрузка конфигурации…");

    const urlToFetch = DEFAULT_CONFIG.configUrl;

    if (!urlToFetch) {
      state.configLoaded = false;
      state.configLoadError = "Адрес конфигурационного файла не указан в коде приложения.";
      setConfigStatus("error", "Адрес не указан");
      renderContent();
      return false;
    }

    try {
      const requestUrl = new URL(urlToFetch, location.href);
      requestUrl.searchParams.set("ts", now);
      const response = await fetch(requestUrl.href, { cache: "no-store", credentials: "include" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const incoming = await response.json();
      if (!incoming || incoming.application !== "nzp-calculator") {
        throw new Error("неверный формат файла (ожидается application: nzp-calculator)");
      }

      const merged = Object.assign({}, DEFAULT_CONFIG, incoming, {
        export: Object.assign({}, DEFAULT_CONFIG.export, incoming.export || {}),
        calculation: Object.assign({}, DEFAULT_CONFIG.calculation, incoming.calculation || {}),
        contractorDirectory: normalizeContractorDirectory(incoming.contractorDirectory || { entries: [] }),
        dataSources: Array.isArray(incoming.dataSources) ? incoming.dataSources.map((s, i) => normalizeKfoSource(s, i)) : [],
        pricingBindings: incoming.pricingBindings || {}
      });

      merged.configUrl = urlToFetch;

      coefficientCache.clear();
      state.config = merged;
      state.configLoaded = true;
      state.configLoadError = null;
      state.configLoadedAt = now;
      state.configDirty = false;
      state.kqLevel = ["kq1", "kq2"].indexOf(merged.calculation.defaultKqLevel) >= 0 ? merged.calculation.defaultKqLevel : "kq2";
      state.calculationMode = "with-regulations";

      state.sourceConnections = {};
      (state.config.dataSources || []).forEach(function (source) {
        state.sourceConnections[source.id] = {
          status: "inactive",
          checkedAt: null,
          message: source.url ? "Источник ещё не проверен" : "Ссылка на БД КФО не указана"
        };
      });

      applyConfigToChrome();
      setConfigStatus("ok", "config.json загружен");
      setEditMode(Boolean(state.config.editMode), true);
      renderContent();

      setTimeout(function() {
        checkKfoConnections(true);
      }, 100);

      return true;
    } catch (error) {
      state.configLoaded = false;
      state.config = null;
      state.configLoadError = error.message || "Неизвестная ошибка загрузки конфигурации.";
      setConfigStatus("error", "Ошибка загрузки");
      renderContent();
      showToast("Ошибка загрузки конфигурации", state.configLoadError);
      return false;
    }
  }

  function renderProcessIndicator() {
    const process = state.process || {};
    if (!process.visible) return "";
    const colors = { running: "#2563eb", success: "#16a34a", warning: "#d97706", error: "#dc2626" };
    const color = colors[process.status] || "#2563eb";
    const elapsedEnd = process.finishedAt || Date.now();
    const elapsed = process.startedAt ? ((elapsedEnd - process.startedAt) / 1000).toFixed(1) + " с" : "—";
    const closeButton = process.status === "running" ? "" : '<button class="btn btn-ghost" type="button" id="close-process-indicator">Закрыть</button>';
    return '<section id="process-indicator" class="card" aria-live="polite" style="border-color:' + color + ';margin-bottom:16px"><div class="card-body"><div class="card-title-row"><strong id="process-stage" style="color:' + color + '">' + escapeHtml(process.stage || "Обработка данных") + '</strong><div style="display:flex;align-items:center;gap:8px"><span class="badge" id="process-percent">' + formatNumber(process.percent || 0, 0) + '%</span>' + closeButton + '</div></div><div class="result-note"><span id="process-source">Источник: ' + escapeHtml(process.source || "—") + '</span> · <span id="process-processed">Обработано: ' + formatNumber(process.processed || 0, 0) + '</span> · <span id="process-elapsed">Время: ' + elapsed + '</span></div><div style="height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:8px"><div id="process-progress-bar" style="height:100%;width:' + Math.max(0, Math.min(100, process.percent || 0)) + '%;background:' + color + ';transition:width .2s ease"></div></div><p id="process-message" class="result-note" style="color:' + color + ';' + (process.message ? '' : 'display:none') + '">' + escapeHtml(process.message || '') + '</p></div></section>';
  }

  function startProcess(source, stage) {
    state.process = { visible: true, status: "running", source: source || "", stage: stage || "Проверка файла", percent: 0, processed: 0, startedAt: Date.now(), finishedAt: 0, message: "" };
    if (state.configLoaded) renderContent();
  }

  function refreshProcessIndicator() {
    const process = state.process || {};
    const colors = { running: "#2563eb", success: "#16a34a", warning: "#d97706", error: "#dc2626" };
    const color = colors[process.status] || "#2563eb";
    const card = document.getElementById("process-indicator");
    if (!card) return;
    const stage = document.getElementById("process-stage");
    const source = document.getElementById("process-source");
    const processed = document.getElementById("process-processed");
    const elapsed = document.getElementById("process-elapsed");
    const percent = document.getElementById("process-percent");
    const bar = document.getElementById("process-progress-bar");
    const message = document.getElementById("process-message");
    const elapsedEnd = process.finishedAt || Date.now();
    card.style.borderColor = color;
    if (stage) { stage.textContent = process.stage || "Обработка данных"; stage.style.color = color; }
    if (source) source.textContent = "Источник: " + (process.source || "—");
    if (processed) processed.textContent = "Обработано: " + formatNumber(process.processed || 0, 0);
    if (elapsed) elapsed.textContent = "Время: " + (process.startedAt ? ((elapsedEnd - process.startedAt) / 1000).toFixed(1) + " с" : "—");
    if (percent) percent.textContent = formatNumber(process.percent || 0, 0) + "%";
    if (bar) { bar.style.width = process.percent + "%"; bar.style.background = color; }
    if (message) { message.textContent = process.message || ""; message.style.color = color; message.style.display = process.message ? "" : "none"; }
  }

  function updateProcess(stage, percent, processed, message) {
    state.process.stage = stage || state.process.stage;
    state.process.percent = Math.max(0, Math.min(100, Number(percent) || 0));
    state.process.processed = Number(processed) || 0;
    state.process.message = message || "";
    refreshProcessIndicator();
  }

  function finishProcess(status, stage, processed, message) {
    state.process.status = status || "success";
    state.process.stage = stage || (status === "error" ? "Ошибка" : "Завершено");
    state.process.percent = status === "error" ? state.process.percent : 100;
    state.process.processed = Number(processed) || state.process.processed || 0;
    state.process.message = message || "";
    state.process.visible = true;
    state.process.finishedAt = Date.now();
    refreshProcessIndicator();
  }

        ? '<div class="source-settings"><div class="field-grid"><div class="field"><label>Наименование источника</label><input class="input" value="' + escapeHtml(source.name) + '" data-source-index="' + index + '" data-source-field="name" /></div><div class="field"><label>Использование</label><select class="input" data-source-index="' + index + '" data-source-field="enabled"><option value="true"' + (source.enabled ? " selected" : "") + '>Включён</option><option value="false"' + (!source.enabled ? " selected" : "") + '>Отключён</option></select></div><div class="field field-wide"><label>Ссылка SharePoint или путь к тестовому файлу</label><input class="input" type="text" placeholder="https://...sharepoint.com/.../БД-КФО.xlsb" value="' + escapeHtml(source.url) + '" data-source-index="' + index + '" data-source-field="url" /></div><div class="field"><label>Лист данных</label><input class="input" value="' + escapeHtml(source.sheetName) + '" data-source-index="' + index + '" data-source-field="sheetName" /></div><div class="field"><label>Ячейка даты обновления</label><input class="input" value="' + escapeHtml(source.updatedAtCell) + '" data-source-index="' + index + '" data-source-field="updatedAtCell" /></div><div class="field"><label>Строк поиска заголовка</label><input class="input" type="number" min="1" max="500" value="' + source.headerSearchRows + '" data-source-index="' + index + '" data-source-field="headerSearchRows" /></div><div class="field"><label>Уровень KQ для файла</label><select class="input" data-source-index="' + index + '" data-source-field="kqLevel">' + levelOptions + '</select></div></div><h5 class="settings-section-title">Колонки для сбора информации</h5><p class="settings-section-note">Все поля доступны для настройки. Заголовки определяются автоматически, указанные буквы используются как резерв.</p><div class="mapping-grid">' + mapping + '</div></div>'
        : "";

      return '<div class="source-card"><div class="source-overview"><div class="source-overview-name">' + escapeHtml(source.name) + '</div><div class="source-status-inline' + (active ? " active" : "") + '" title="' + escapeHtml(statusDetails) + '"><span class="source-status-dot"></span><span>' + title + '</span></div><div class="source-overview-metric">' + metric + '</div><div class="source-overview-date">' + date + '</div><div class="source-overview-actions">' + openLink + removeButton + '</div></div>' + editor + '</div>';
    }).join("") : emptyState("Источники не настроены", "Включите режим редактирования и добавьте ссылку на БД КФО.", "database");

    const kfo = state.kfo;
    const visibleGroups = (function() {
      const merged = new Map();
      const directory = contractorDirectoryIndex();
      (kfo.groups || []).forEach(function (entry) {
        const canonicalName = canonicalContractorName(entry.contractor);
        const key = [normalizeParserLabel(canonicalName), normalizeParserLabel(entry.kqCode), normalizeParserLabel(entry.unit), entry.level || "", entry.mode || ""].join("||");
        let target = merged.get(key);
        if (!target) {
          target = Object.assign({}, entry, {
            contractor: canonicalName,
            rows: 0, regulationRows: 0,
            actualSmr: 0, acceptedSk: 0, acceptedId: 0,
            evaluatedVolume: null,
            rawContractors: []
          });
          merged.set(key, target);
        }
        target.rows += Number(entry.rows) || 0;
        target.regulationRows += Number(entry.regulationRows) || 0;
        target.actualSmr += Number(entry.actualSmr) || 0;
        target.acceptedSk += Number(entry.acceptedSk) || 0;
        target.acceptedId += Number(entry.acceptedId) || 0;
        if (entry.evaluatedVolume != null) target.evaluatedVolume = (target.evaluatedVolume || 0) + (Number(entry.evaluatedVolume) || 0);
        if (target.rawContractors.indexOf(entry.contractor) < 0) target.rawContractors.push(entry.contractor);
      });
      return Array.from(merged.values()).filter(function(entry) {
        return [entry.actualSmr, entry.acceptedSk, entry.acceptedId, entry.evaluatedVolume].some(function (value) {
          if (value == null || value === "") return false;
          const number = Number(value);
          return Number.isFinite(number) && Math.round(number) !== 0;
        });
      });
    })();

    const visibleContractors = (function() {
      const map = new Map();
      visibleGroups.forEach(function (group) {
        const key = normalizeParserLabel(group.contractor);
        let entry = map.get(key);
        if (!entry) {
          entry = {
            name: group.contractor,
            rows: 0,
            workTypeSet: new Set(),
            unitSet: new Set(),
            regulationRows: 0,
            regulatedBase: 0
          };
          map.set(key, entry);
        }
        entry.rows += group.rows;
        entry.workTypeSet.add([normalizeParserLabel(group.kqCode || group.kqName || group.erName), group.level || ""].join("||"));
        entry.unitSet.add(group.unit);
        if (group.mode === "with-regulations") {
          entry.regulationRows += group.regulationRows;
          entry.regulatedBase += group.rows;
        }
      });
      return Array.from(map.values()).map(function (entry) {
        return {
          name: entry.name,
          rows: entry.rows,
          workTypes: entry.workTypeSet.size,
          units: entry.unitSet.size,
          regulationCoverage: entry.regulatedBase ? entry.regulationRows / entry.regulatedBase * 100 : null
        };
      }).sort(function (a, b) { return a.name.localeCompare(b.name, "ru"); });
    })();

    const workTypes = (function() {
      const keys = new Set();
      (visibleGroups || []).forEach(function (entry) { keys.add([normalizeParserLabel(entry.kqCode || entry.kqName || entry.erName), entry.level || ""].join("||")); });
      return keys.size;
    })();

    const allContractors = getCanonicalContractorNames();
    const selectedSet = new Set(state.selectedContractors.map(function(name) { return normalizeParserLabel(name); }));
    const searchQuery = normalizeParserLabel(state.contractorSearch || "");
    const filteredContractors = searchQuery ? allContractors.filter(function(name) { return normalizeParserLabel(name).indexOf(searchQuery) >= 0; }) : allContractors;
    const isAllSelected = state.selectedContractors.length === 0 || (state.selectedContractors.length === 1 && state.selectedContractors[0] === "__ALL__");

    let contractorSelectorHTML = '';
    if (allContractors.length > 0) {

        return '<div class="contractor-check-item">' +
          '<input type="checkbox" id="contractor_' + escapeHtml(name) + '" value="' + escapeHtml(name) + '" ' + (isChecked ? 'checked' : '') + ' />' +
          '<label for="contractor_' + escapeHtml(name) + '">' + escapeHtml(name) + '</label>' +

      contractorSelectorHTML =
        '<div class="field"><label>Выбор подрядчиков</label>' +
